name: Delete quotes older than 90 days
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete expired quotes
        run: python3 scripts/expire_quotes.py
      - name: Commit and push if anything was deleted
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Quote clean up"
            git config user.email "noreply@travelagentjake.co.uk"
            git add -A quotes
            git commit -m "Delete quotes older than 90 days"
            git push
          fi
