name: Close quotes
# Takes the page away from any quote Jake has closed in the dashboard (and restores reopened ones).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: close-quotes
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close or reopen quote pages
        run: python3 scripts/close_quotes.py
      - name: Commit and push if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Quote close"
            git config user.email "noreply@travelagentjake.co.uk"
            git add -A quotes
            git commit -m "Close or reopen quotes from the dashboard"
            git pull --rebase -q origin main || true
            git push
          fi
