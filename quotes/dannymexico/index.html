   "html": "<style>\n.dbg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}\n.dbb{background:var(--pill,#F1F4FD);border-radius:18px;padding:16px 18px}\n.dbb h4{margin:0 0 8px;color:var(--blue,#004AAD);font-family:'Archivo',sans-serif;font-weight:800;font-size:17px}\n.dbb ul{margin:0;padding-left:18px}.dbb li{margin:5px 0;font-size:15px}\n.dbb.safe{background:var(--blue,#004AAD);color:#fff}.dbb.safe h4{color:#FFD21F}\n.dbi{font-size:16px;margin:0 0 16px}\n@media(max-width:900px){.dbg{grid-template-columns:1fr}}\n<\/style><p class=\"dbi\">Thank you for being so open about your budget, Danny. I would rather be honest with you now than surprise you later. Christmas and New Year is the busiest and most expensive fortnight of the whole year in Mexico, and for 4 star all inclusive on direct flights for three, <b>£6,500 is not quite achievable on these dates<\/b>. The lowest price I could find for a 4 star all inclusive is <b>£8,440.25<\/b>, which is Option 1.<\/p>\n<div class=\"dbg\">\n<div class=\"dbb safe\"><h4>Ways to bring the cost down<\/h4><ul><li>Flying a week later, after Christmas, can save roughly £800 to £1,100 on the same hotel<\/li><li>Flying in early December can save up to around £2,000, if the school or college calendar allows<\/li><li>Staying 12 nights instead of 14 saves around £320<\/li><li>I keep an eye out for offers, and prices for these dates can drop as well as rise<\/li><\/ul><\/div>\n<div class=\"dbb\"><h4>Why I still chose these three<\/h4><ul><li>All three are 4 or 5 star and all inclusive, as you asked<\/li><li>All three sit away from the busy town centres, on quieter stretches of coast<\/li><li>Each has a room that sleeps the three of you together<\/li><li>I will request a room away from the entertainment and noisy areas whichever you choose<\/li><\/ul><\/div>\n<\/div>\n<p class=\"dbi\" style=\"margin-top:16px\">If any of the ideas above appeal, just tell me and I will price them up properly for you.<\/p>"
