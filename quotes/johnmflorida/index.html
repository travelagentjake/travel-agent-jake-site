   "html": "<style>.cxjump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}.cxjump a{background:var(--pill,#E8EDFF);color:var(--blue,#004AAD);font-weight:800;font-size:14px;border-radius:999px;padding:7px 14px;text-decoration:none}.cx{background:#fff;border:2px solid var(--line,#DCE3FF);border-radius:24px;padding:22px;margin:0 0 26px;scroll-margin-top:90px}.cx h3{font-family:'Archivo Black',sans-serif;color:var(--blue,#004AAD);font-size:24px;line-height:1.15;margin:0}.cx .cxh{font-weight:700;color:var(--muted,#55607A);margin:4px 0 14px;font-size:15px}.cx .cxi{font-size:16px;margin:0 0 16px}.cxgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.cxgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.cxb{background:var(--pill,#F1F4FD);border-radius:18px;padding:16px 18px}.cxb h4{margin:0 0 8px;color:var(--blue,#004AAD);font-family:'Archivo',sans-serif;font-weight:800;font-size:17px}.cxb ul{margin:0;padding-left:18px}.cxb li{margin:5px 0;font-size:15px}.cxb li b{color:var(--ink,#10142B)}.cxb.safe{background:var(--blue,#004AAD);color:#fff}.cxb.safe h4{color:#FFD21F}.cxb.safe li b{color:#FFD21F}.cxcred{font-size:12px;color:var(--muted,#55607A);margin:14px 0 0}@media(max-width:900px){.cxgrid,.cxgrid3{grid-template-columns:1fr}.cx{padding:16px}.cx h3{font-size:21px}}<\/style><div class=\"cxjump\"><a href=\"#car\">Your hire cars<\/a><a href=\"#buses\">Resort buses to the parks<\/a><a href=\"#localcosts\">Paid at the resort<\/a><\/div><div class=\"cx\" id=\"car\"><h3>Your two hire cars, included in every option<\/h3><div class=\"cxh\">Two 7 seater vans for 18 days, collected and returned at Orlando airport<\/div><p class=\"cxi\">With ten of you, two big cars give you total freedom. One group can head to Universal while the other does Disney, a supermarket run or a beach day, and you never have to wait for a bus.<\/p><div class=\"cxgrid\"><div class=\"cxb safe\"><h4>The cars<\/h4><ul><li><b>Car 1:<\/b> Dollar, 7 passenger minivan<\/li><li><b>Car 2:<\/b> Thrifty, 7 seater van<\/li><li><b>Collect:<\/b> Orlando International Airport, Sat 1 May from 18:45, about an hour after you land<\/li><li><b>Return:<\/b> Orlando International Airport, Wed 19 May by 17:45, before your 20:45 flight home<\/li><li><b>Hire:<\/b> 18 days<\/li><\/ul><\/div><div class=\"cxb\"><h4>What is included<\/h4><ul><li><b>Unlimited mileage<\/b>, so day trips to the coast are no problem<\/li><li><b>LDW<\/b>, the loss damage waiver that covers damage to or theft of the car<\/li><li><b>LIS<\/b>, extra liability insurance for third party claims<\/li><li><b>Taxes, airport fees and local surcharges<\/b><\/li><\/ul><\/div><div class=\"cxb\"><h4>Paid locally if you need it<\/h4><ul><li>Fuel, Florida road tolls and any optional extras such as extra drivers, sat nav or booster seats are paid at the rental desk<\/li><li>Each lead driver needs their full UK driving licence and a credit card in their own name<\/li><\/ul><\/div><div class=\"cxb\"><h4>Good to know<\/h4><ul><li>The exact model is confirmed at the desk, the car class is guaranteed<\/li><li>Ask me if you would like help adding booster seats for the younger ones<\/li><\/ul><\/div><\/div><\/div><div class=\"cx\" id=\"buses\"><h3>Resort buses to the theme parks<\/h3><div class=\"cxh\">Handy for days you would rather not drive or pay park parking<\/div><div class=\"cxgrid\"><div class=\"cxb safe\"><h4>The Grove<\/h4><ul><li>Daily buses to <b>Walt Disney World, Universal Orlando and SeaWorld<\/b>, covered by the resort fee that is already in your price<\/li><li>Book your seats with the concierge at least 2 hours and up to 48 hours before you travel (concierge desk open 8am to 4pm)<\/li><li>Buses leave from outside the main lobby next to Garage 1<\/li><\/ul><\/div><div class=\"cxb\"><h4>Embassy Suites<\/h4><ul><li>Scheduled transport to <b>Walt Disney World, Universal Orlando and SeaWorld<\/b>, included as part of the waived resort fee<\/li><li>Free shuttle to the restaurants and shops along the Promenade<\/li><li>Check times with the front desk when you arrive<\/li><\/ul><\/div><div class=\"cxb\"><h4>Villatel<\/h4><ul><li>Free scheduled daily transport to <b>Walt Disney World and Universal Orlando<\/b><\/li><li>Universal and Epic Universe are only around 2 miles away, so driving is quick too<\/li><li>Check times with the front desk when you arrive<\/li><\/ul><\/div><div class=\"cxb\"><h4>Encore Resort<\/h4><ul><li>The resort courtesy shuttle is not available for groups of ten or more, so your two hire cars are the way to go<\/li><li>Disney is about 7 miles away<\/li><li>Register both hire cars when the resort emails you 48 hours before arrival, so the gate camera lets you in<\/li><\/ul><\/div><\/div><p class=\"cxcred\">Bus details are from the supplier and the resorts at the time of quoting and timetables can change, so it is always worth checking with the resort when you arrive.<\/p><\/div><div class=\"cx\" id=\"localcosts\"><h3>Paid locally at the resort<\/h3><div class=\"cxh\">What to expect at check in<\/div><div class=\"cxgrid\"><div class=\"cxb safe\"><h4>The Grove<\/h4><ul><li><b>Resort fee:<\/b> already included in your price, so nothing to pay at check in. It covers Surfari Water Park, the park buses and wifi<\/li><li><b>Parking:<\/b> $35 plus tax per car per night, about <b>£940<\/b> for both cars<\/li><li>A card hold of $100 per night, up to $350, for incidentals at check in<\/li><\/ul><\/div><div class=\"cxb\"><h4>Embassy Suites<\/h4><ul><li><b>Resort fee:<\/b> waived, so nothing to pay<\/li><li><b>Parking:<\/b> self parking included<\/li><li>A refundable card hold of $75 per day for incidentals at check in<\/li><\/ul><\/div><div class=\"cxb\"><h4>Villatel<\/h4><ul><li>No resort fee is listed by the supplier<\/li><li>Villa resorts can ask for an accidental damage waiver or a card hold on arrival, and I will confirm this before you book<\/li><li>The villa grill has a small local charge for gas and cleaning if you use it<\/li><\/ul><\/div><div class=\"cxb\"><h4>Encore Resort<\/h4><ul><li>No resort fee is listed by the supplier<\/li><li>Water park entry is free for guests<\/li><li>Pool heating is not included, ask me and I can add it before you go<\/li><li>Check in from 4pm, check out by 10am<\/li><\/ul><\/div><\/div><p class=\"cxcred\">Local charges are in US dollars and converted here at roughly £1 to $1.34, with local tax added on top. The Grove's parking price is from the resort's own website, everything else is from the supplier.<\/p><\/div>"
  }
 ],
