   "intro": "Everything you asked about in one table: what each hotel has for the children, what the areas are like, flights, transfers and the bags. Swipe sideways on a phone.",
   "html": "<style>.vs{width:100%;border-collapse:collapse;background:#fff;border:2px solid #DCE3FF;border-radius:20px;overflow:hidden;font-size:15px}.vs th,.vs td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid #DCE3FF}.vs th{background:#004AAD;color:#fff;font-family:'Archivo Black',sans-serif;font-weight:400}.vs td:first-child{font-weight:800;color:#004AAD;width:22%}.vs tr:last-child td{border-bottom:0}.vs .tick{color:#118A5B;font-weight:800}.vs .cross{color:#A00;font-weight:800}@media(max-width:640px){.vs{font-size:14px}.vs th,.vs td{padding:10px 8px}.vs td:first-child{width:28%}}</style>\n<div style=\"overflow-x:auto\"><table class=\"vs\"><thead><tr><th></th><th>Maris Grand Waterpark Resort<br><small>Protaras, with Jet2holidays</small></th><th>Atlantica Oasis Hotel<br><small>Limassol, with TUI</small></th><th>Grand Ideal Premium<br><small>Marmaris, Turkey, with Jet2holidays</small></th></tr></thead><tbody>\n<tr><td>Water fun</td><td>Its own waterpark with 5 slides (2 aqua tubes, a freefall cube, a body slide and a multi slide), plus a main pool. <b>Slides need a height of 120cm</b>, so your 12 year old is fine and your 7 year old may or may not be, depending on height.</td><td>A huge lagoon style main pool with an outdoor Jacuzzi, a kids splash pool with a giant pirate ship, water cannons and tipping buckets (great for a 7 year old), and an adults only pool. No big slides.</td><td>A huge free form outdoor pool, a separate children's pool and an indoor pool. No waterpark or slides, but aqua aerobics and water polo in the main pool.</td></tr>\n<tr><td>For the kids</td><td>Kids club for 4 to 12 year olds, 11am to 4pm, with crafts, games, water activities and story time. Kids buffet in the restaurant. Daytime entertainment with team games and pool activities.</td><td>Hotel run kids club for 4 to 12 year olds (May to October). Playground and children's play area, games room with arcade games, table tennis, darts, padel and squash. Mini disco every evening then family shows, cabaret, karaoke and a magician.</td><td>Daytime entertainment from May to October with team games and pool activities, then bingo, karaoke, a mini disco, live music and a DJ in the evenings. Kids menu and kids buffet in all three restaurants. No kids club listed by Jet2.</td></tr>\n<tr><td>For you two</td><td>Spa with sauna, steam room and massages, gym, 3 bars and 2 restaurants (buffet and Italian à la carte). All Inclusive Plus, so a wider drinks choice and snacks through the day.</td><td>Adults only bar and adults only relax pool, the Oasis Spa with an indoor pool, gym, 3 restaurants including 2 à la carte (one visit included) and themed buffet nights with live cooking. All Inclusive with local brand drinks 10am to midnight.</td><td>Five star hotel with 5 bars including a cocktail bar, 3 restaurants (2 buffet, 1 Turkish à la carte), a spa with sauna and Turkish bath, and an indoor pool. All Inclusive with local drinks.</td></tr>\n<tr><td>Beach</td><td>About 1.2km (a 15 minute walk) to the beach. Protaras is famous for Fig Tree Bay, a gorgeous shallow sandy bay that is brilliant for kids.</td><td>In the Yermasoyia tourist strip of Limassol. The beach is a short walk and is mostly dark sand and pebbles, less postcard pretty than Protaras but fine for a dip.</td><td>200m to the beach, a short walk down the road. Marmaris beach is a long strip of sand and shingle on a sheltered bay with calm water, good for kids.</td></tr>\n<tr><td>Out and about</td><td>500m to the nearest bars and restaurants, 1km to the resort centre. Protaras is a purpose built, family friendly resort: lively but not rowdy, with the Cape Greco sea caves and Blue Lagoon boat trips on the doorstep.</td><td>400m to a strip of bars, restaurants and a supermarket. Limassol is a big, proper city with a smart marina, old town and castle about 15 minutes away by bus or taxi. Kourion ancient theatre and the Troodos mountains are easy day trips.</td><td>Shops, bars and restaurants 100m away, with the lively Marmaris centre, marina and bazaar 2.5km along the seafront promenade. Boat trips, Dalyan turtle beach and the mud baths are classic days out.</td></tr>\n<tr><td>Resort feel</td><td>Holiday resort. Nearly everything is built for tourists and families.</td><td>City by the sea. More local life, shops and restaurants, but busier roads and more of a mixed crowd.</td><td>Big, buzzy Turkish resort. Great value, warm welcome and lots going on, with the famous bar street if you want it and quieter spots if you do not.</td></tr>\n<tr><td>Your room</td><td>Family room, sleeps 4, with balcony, fridge, kettle and air conditioning.</td><td>Family room with a sliding partition between the two sleeping areas and a balcony. Upgrade to a Family Suite for £357.20 if you want more space.</td><td>Quadruple room for the four of you. Connecting rooms are available for £960 more, only 5 left.</td></tr>\n<tr><td>Flights</td><td>Stansted, out Sat 12 Aug 16:15, lands 22:55 (you will be at the hotel around midnight). Home Tue 22 Aug at 23:40, an overnight flight landing 02:35. You get the whole of the last day in resort.</td><td>Gatwick, out Sun 13 Aug 06:45 (early start), lands 13:10 so you are by the pool the same afternoon. Home Wed 23 Aug 19:05, landing 21:50. A late checkout room can be added for the last day.</td><td>Stansted, out Mon 14 Aug 16:45, lands 22:50 (at the hotel around 00:30). Home Thu 24 Aug at 23:50, an overnight flight landing 02:05. Whole last day in resort.</td></tr>\n<tr><td>Transfer</td><td>Private taxi from Larnaca, about 50 minutes.</td><td>Private taxi from Paphos, about an hour.</td><td>Private taxi from Dalaman, about 1 hour 30 minutes. It is the longest transfer of the three.</td></tr>\n<tr><td>Bags on the way home</td><td><span class=\"tick\">Resort Flight Check-In available.</span> Drop the cases at the hotel on the morning of the flight and collect them at Stansted. See below.</td><td><span class=\"cross\">Not offered.</span> Bags go with you in the taxi and are checked in at Paphos airport.</td><td><span class=\"cross\">Not offered at this hotel.</span> Jet2 do not list Resort Flight Check-In for the Grand Ideal, so bags go with you to Dalaman airport.</td></tr>\n<tr><td>Tripadvisor</td><td>4.5 out of 5 from 404 reviews</td><td>4 out of 5</td><td>4.5 out of 5 from 4,250 reviews</td></tr>\n<tr><td>Price for the four of you</td><td><b>£5,111.76</b> with seats together and private taxi included. £240 deposit.</td><td><b>£5,085.73</b> with seats together and private taxi included, and a free child place already taken off. £300 low deposit.</td><td><b>£5,164.24</b> with seats together and private taxi included, and a free child place already taken off. £240 deposit.</td></tr>\n</tbody></table></div>"

   "intro": "",
   "html": "<div style=\"background:#fff;border:2px solid #DCE3FF;border-radius:24px;padding:22px\"><h3 style=\"margin:0 0 10px;color:#004AAD;font-family:'Archivo Black',sans-serif;font-size:20px\">Jet2holidays Resort Flight Check-In at the Maris Grand</h3>\n<p>You asked whether Jet2 collect the bags from the hotel before the flight home. The answer is yes at this hotel, through their <b>Resort Flight Check-In</b> service. It is <b>free and completely optional</b>, and you do not need to book it. Here is how it works:</p>\n<ol style=\"padding-left:20px;line-height:1.6\"><li>Check in online at least 72 hours before your flight home (online check-in opens 28 days before).</li><li>About 3 days before, Jet2 text you to say when and where in the hotel to drop the bags.</li><li>On the morning of Tuesday 22 August, you take the cases to the Resort Flight Check-In desk at the hotel with everyone's passports and boarding passes. A Jet2 team checks them in there and loads them onto a sealed, security tagged lorry to Larnaca airport.</li><li>You keep your hand luggage, enjoy the whole of your last day bag free (your flight is not until 23:40), then collect the cases from the belt at Stansted as normal.</li></ol>\n<p>A few small rules: the return flight has to leave after 11am (yours does), bags must be 22kg or under, and you can keep one case back and check it in at the airport yourself if you would rather. If you decide not to use it, you simply take the bags to the airport in the taxi like any other holiday.</p>\n<h3 style=\"margin:18px 0 10px;color:#004AAD;font-family:'Archivo Black',sans-serif;font-size:20px\">And at the other two?</h3>\n<p style=\"margin:0\">TUI do not offer a hotel bag drop in Cyprus. At the Atlantica Oasis you would take the cases with you in the taxi and check them in at Paphos airport in the usual way, which with a 19:05 flight means leaving the hotel late afternoon. TUI do offer a late checkout room for that last day, which I can price up if you like.</p><p style=\"margin:10px 0 0\">The Grand Ideal in Marmaris is also with Jet2, but Jet2 do not list Resort Flight Check-In at that hotel, so there the bags would go with you in the taxi to Dalaman as normal.</p></div>"
  }
