r:var(--blue,#004AAD);font-weight:800;font-size:12.5px;border-radius:999px;padding:4px 10px;white-space:nowrap}\n.nbr b.nbn{display:block;color:var(--blue,#004AAD);font-weight:800;font-size:15.5px}\n.nbr span.nbd{display:block;font-size:14px;margin-top:2px}\n.nbr span.nbd b{color:var(--ink,#10142B)}\n.agcred{font-size:11.5px;color:var(--muted,#55607A);margin:14px 0 0}\n@media(max-width:900px){.aggrid,.nbl{grid-template-columns:1fr}.agstrip figure{flex-basis:82%}.agstrip.sm figure{flex-basis:70%}.agstrip img{height:210px}.ag{padding:16px}.ag h3{font-size:21px}.nbr{flex-direction:column;gap:6px}}\n<\/style><div class=\"agjump\"><a href=\"#jfk-train\">By train (cheapest)<\/a><a href=\"#jfk-car\">By taxi or car<\/a><a href=\"#jfk-tips\">Arrival day tips<\/a><\/div><div class=\"ag\" id=\"jfk-train\"><h3>By AirTrain, subway and PATH<\/h3><div class=\"agh\">About 1 hour 30 to 1 hour 45 minutes, and around £11 to £12 per adult<\/div><div class=\"agstrip sm\"><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1757047149678-fe7c70472a7c?w=900&q=80&auto=format&fit=crop\" alt=\"The Oculus at World Trade Center, where you change onto the PATH\"><figcaption>The Oculus at World Trade Center, where you change onto the PATH<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1697896321319-2bca3f51d105?w=900&q=80&auto=format&fit=crop\" alt=\"Trains are frequent all day\"><figcaption>Trains are frequent all day<\/figcaption><\/figure><\/div><p class=\"agi\">This is the easy public transport route with only two changes, and it finishes one minute from your hotel. You land around 1pm, so you will be on the trains well before the evening rush hour.<\/p><div class=\"aggrid\"><div class=\"agb safe\"><h4>Step by step<\/h4><ol><li><b>AirTrain<\/b> from your terminal to <b>Jamaica<\/b> station (about 10 minutes). You pay as you leave the AirTrain at Jamaica by tapping a contactless card or phone<\/li><li><b>E train<\/b> from Sutphin Blvd Archer Av JFK Airport, heading to <b>World Trade Center<\/b>. Stay on to the end of the line (about 55 to 60 minutes)<\/li><li>Walk through the <b>Oculus<\/b> to the PATH station and take a <b>Newark<\/b> train for two stops to <b>Grove Street<\/b> (about 7 minutes)<\/li><li>Your hotel is on Morgan Street, around a minute's walk from the Grove Street station<\/li><\/ol><\/div><div class=\"agb\"><h4>What it costs<\/h4><ul><li><b>AirTrain:<\/b> $8.75 each (about £6.50). Children under 5 ride free<\/li><li><b>Subway:<\/b> $3 each (about £2.25). Up to three children under 44 inches tall ride free with an adult<\/li><li><b>PATH:<\/b> $3.25 each today (about £2.40), with small rises planned each January so expect a little more in 2028. Children under 5 ride free<\/li><li>All three take tap and pay with a contactless bank card or phone, so there is no need to buy tickets<\/li><li>Use a <b>separate card or phone for each adult<\/b>, as one card can only pay for one person on the subway<\/li><\/ul><\/div><\/div><p class=\"agcred\">Fares are set by the Port Authority and the MTA and were correct in October 2026. They are likely to rise slightly before 2028.<\/p><\/div><div class=\"ag\" id=\"jfk-car\"><h3>By taxi, Uber or a private car<\/h3><div class=\"agh\">Straight to the door, around 60 to 90 minutes depending on traffic<\/div><p class=\"agi\">JFK is about 21 miles from the hotel and the drive crosses Manhattan or Staten Island, so it is not a cheap trip. A yellow taxi or Uber to Jersey City usually comes to around <b>$170 to $220 including tolls and tip<\/b> (about £125 to £165) for the four of you.<\/p><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">Easiest<\/span><div><b class=\"nbn\">With tired children and suitcases<\/b><span class=\"nbd\">After a long flight, going straight to the hotel by car is the least stressful option, just slower and pricier than the train.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Ask me<\/span><div><b class=\"nbn\">A pre booked private car<\/b><span class=\"nbd\">If you would rather have a driver waiting for you with a name board, just ask and I will get you a live price for your exact flight.<\/span><\/div><\/div><\/div><\/div><div class=\"ag\" id=\"jfk-tips\"><h3>Arrival day tips<\/h3><div class=\"agh\">To make the first day as smooth as possible<\/div><div class=\"aggrid\"><div class=\"agb\"><h4>Before you land<\/h4><ul><li>Allow around 1 hour for immigration and bags at JFK<\/li><li>Make sure each adult has a contactless card or phone set up for tapping in<\/li><li>Download the Citymapper or Google Maps app, both are brilliant for the subway and PATH<\/li><\/ul><\/div><div class=\"agb safe\"><h4>Going home<\/h4><ul><li>Your flight home leaves JFK at 7pm, so plan to leave the hotel by about <b>2:30pm<\/b><\/li><li>The hotel can usually hold your bags after check out so you can enjoy your last morning<\/li><li>The same train route works in reverse: PATH to World Trade Center, E train to Jamaica, then the AirTrain<\/li><\/ul><\/div><\/div><\/div>"

   "title": "Getting into New York from the hotel",
   "intro": "How you get across to Manhattan each day, and how long it takes.",
   "html": "<div class=\"ag\" id=\"nyc-path\"><h3>The PATH train from Grove Street<\/h3><div class=\"agh\">Your station is around the corner, and Manhattan is under 10 minutes away<\/div><div class=\"agstrip sm\"><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1642266119404-3bcf85d2f8bb?w=900&q=80&auto=format&fit=crop\" alt=\"Lower Manhattan, just across the river\"><figcaption>Lower Manhattan, just across the river<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1757047149678-fe7c70472a7c?w=900&q=80&auto=format&fit=crop\" alt=\"Arrive at the World Trade Center\"><figcaption>Arrive at the World Trade Center<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1617688319108-cb3bdc88f587?w=900&q=80&auto=format&fit=crop\" alt=\"Midtown via the 33rd Street line\"><figcaption>Midtown via the 33rd Street line<\/figcaption><\/figure><\/div><p class=\"agi\">This is exactly why Jersey City works so well. You get a calmer neighbourhood to come back to each evening, and the PATH train under the Hudson gets you into the city faster than many hotels in Manhattan itself.<\/p><div class=\"aggrid\"><div class=\"agb safe\"><h4>To Lower Manhattan<\/h4><ul><li>Take a <b>World Trade Center<\/b> train, it is just two stops and around 7 minutes<\/li><li>Perfect for the 9/11 Memorial, One World Observatory, the Statue of Liberty ferries at Battery Park and the Brooklyn Bridge<\/li><li>Trains run all day, every few minutes at busy times<\/li><\/ul><\/div><div class=\"agb\"><h4>To Midtown<\/h4><ul><li>Take a <b>33rd Street<\/b> train, stopping at Christopher St, 9th St, 14th St, 23rd St and 33rd St, around 20 minutes on weekdays<\/li><li>At weekends and late at night this line runs via Hoboken, so allow about 30 minutes<\/li><li>33rd Street is next to the Empire State Building, Macy's and Penn Station, and the subway takes you on to Times Square and Central Park<\/li><\/ul><\/div><\/div><div class=\"nbl\" style=\"margin-top:14px\"><div class=\"nbr\"><span class=\"nbt\">Tap<\/span><div><b class=\"nbn\">Paying<\/b><span class=\"nbd\">Tap the same contactless card or phone on the PATH and the New York subway. Each single PATH ride is $3.25 today, with small rises planned by 2028.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Ferry<\/span><div><b class=\"nbn\">The scenic way<\/b><span class=\"nbd\">NY Waterway ferries run from the Paulus Hook terminal, a short walk away, across to Manhattan. Lovely views, but pricier than the train.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Tip<\/span><div><b class=\"nbn\">Getting around Manhattan<\/b><span class=\"nbd\">The subway is the quickest way between sights, and walking is often easiest for anything within 15 minutes.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Safety<\/span><div><b class=\"nbn\">Late evenings<\/b><span class=\"nbd\">Grove Street is busy with restaurants until late, so coming back in the evening feels easy and relaxed.<\/span><\/div><\/div><\/div><\/div>"
  },

   "title": "Your Jersey City neighbourhood",
   "intro": "There is more to Jersey City than the view, and it is all within easy reach of the hotel.",
   "html": "<div class=\"ag\" id=\"jc\"><h3>Things to do in Jersey City<\/h3><div class=\"agh\">Right on your doorstep, and a great way to slow the pace between big city days<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1613753298916-8f057bfb9173?w=900&q=80&auto=format&fit=crop\" alt=\"Manhattan views from Liberty State Park\"><figcaption>Manhattan views from Liberty State Park<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1791493997551-b2ef4551d697?w=900&q=80&auto=format&fit=crop\" alt=\"The waterfront walkway and the Lackawanna clock tower\"><figcaption>The waterfront walkway and the Lackawanna clock tower<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1520049289016-25a2ea819330?w=900&q=80&auto=format&fit=crop\" alt=\"Sunset over the Newport waterfront\"><figcaption>Sunset over the Newport waterfront<\/figcaption><\/figure><\/div><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">Must do<\/span><div><b class=\"nbn\">Liberty State Park<\/b><span class=\"nbd\">A huge waterfront park with some of the best Manhattan skyline views anywhere, plenty of space for the children to run around, and the Jersey City ferries to the Statue of Liberty and Ellis Island, often with shorter queues than the Manhattan side.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Kids<\/span><div><b class=\"nbn\">Liberty Science Center<\/b><span class=\"nbd\">A brilliant hands on science museum in Liberty State Park, with hundreds of interactive exhibits and the biggest planetarium in the Western Hemisphere. Perfect for a rainy day.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Walk<\/span><div><b class=\"nbn\">Hudson River Waterfront Walkway<\/b><span class=\"nbd\">Stroll along the river from Paulus Hook up to Newport with the skyline right in front of you. Magical at sunset, and the Colgate Clock is on the way.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Eat<\/span><div><b class=\"nbn\">Grove Street and the Arts District<\/b><span class=\"nbd\">Your hotel is in the middle of it, with pizza places, bakeries, diners and lots of family friendly restaurants. The murals around the Arts District are fun to spot too.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Shop<\/span><div><b class=\"nbn\">Newport Centre<\/b><span class=\"nbd\">A big indoor shopping mall about 10 minutes' walk away, with all the American favourites and a food court.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Nearby<\/span><div><b class=\"nbn\">Hoboken<\/b><span class=\"nbd\">A short hop up the river, famous for Carlo's Bakery from Cake Boss, a lovely waterfront and Pier A park.<\/span><\/div><\/div><\/div><\/div>"
  },

   "intro": "A few handy things to sort and remember before you go.",
   "html": "<div class=\"aggrid\"><div class=\"agb\"><h4>Before you fly<\/h4><ul><li>Everyone needs an <b>ESTA<\/b>, including the children. The official fee is $40.62 each (about £30). Only apply on the official site, esta.cbp.dhs.gov, as copycat sites charge much more<\/li><li>Passports must be valid for your whole stay<\/li><li>You will need US plug adaptors (type A)<\/li><\/ul><\/div><div class=\"agb safe\"><h4>New York in early April<\/h4><ul><li>Spring is just arriving, with highs of around 12°C to 15°C and chilly evenings<\/li><li>Pack layers, a warm jacket and comfy shoes, you will walk a lot<\/li><li>A small umbrella is handy for April showers<\/li><\/ul><\/div><div class=\"agb\"><h4>Money tips<\/h4><ul><li>Shop and restaurant prices are shown before sales tax, which is added at the till<\/li><li>Tipping of around 18% to 20% is normal in restaurants<\/li><li>A fee free travel card is ideal for paying in dollars and tapping on the trains<\/li><\/ul><\/div><div class=\"agb\"><h4>Room only<\/h4><ul><li>The hotel's Canopy Central Bistro serves breakfast if you fancy it<\/li><li>Grove Street is full of bakeries, cafes and diners for breakfast on the go<\/li><li>Each room has a fridge, handy for drinks, milk and snacks for the children<\/li><\/ul><\/div><\/div>"
