ays flights, with private taxis in both prices<\/li><li>So the whole difference is the hotel itself, about <b>£307<\/b> a night for the two of you<\/li><li>Flights are a similar cost for both, so it really is the resort you are paying for<\/li><\/ul><\/div>\n<div class=\"agb\"><h4>2. A higher category of resort<\/h4><ul><li>Akumal is a <b>AAA Five Diamond<\/b> resort, The Vine is <b>Four Diamond<\/b><\/li><li>Akumal scores <b>5.0<\/b> on Tripadvisor against The Vine's <b>4.6<\/b><\/li><li>Every room at Akumal is a junior suite, The Vine's entry room is a deluxe double<\/li><\/ul><\/div>\n<div class=\"agb\"><h4>3. Where it is<\/h4><ul><li>Akumal sits on a protected turtle bay with the reef just offshore, a rare and much more exclusive spot<\/li><li>The Vine is in the busy Cancun Hotel Zone, where far more hotels compete for guests, which tends to keep prices lower<\/li><li>New Year week is peak season, and the highest rated resorts tend to hold their price best<\/li><\/ul><\/div>\n<div class=\"agb\"><h4>What you do not lose at The Vine<\/h4><ul><li>The same Secrets unlimited luxury all inclusive, top shelf drinks and adults only<\/li><li>A similar number of restaurants, and even more bars and lounges<\/li><li>A much shorter private taxi from the airport, about 25 minutes instead of around 75<\/li><\/ul><\/div>\n<\/div>\n<div class=\"verdict\"><h4>My honest take<\/h4><p>If you want the special, tucked away, swim with turtles kind of holiday and the budget allows, Akumal is the one and you will feel the difference. If you want to keep the cost down, The Vine is still a brilliant Secrets resort, just busier and more of a city beach feel, and the £3,074.88 saving buys an awful lot of spa treatments and excursions.<\/p><\/div>"

1,033<\/td><td class=\"win\">about £725<\/td><\/tr><tr><th>Where it is<\/th><td>Akumal Bay on the Riviera Maya, a quiet turtle bay between Playa del Carmen and Tulum<\/td><td>Cancun Hotel Zone, between the Caribbean Sea and the Nichupte Lagoon<\/td><\/tr><tr><th>Private taxi from the airport<\/th><td>About 75 minutes, up to 90 in heavy traffic (about 90km)<\/td><td class=\"win\">About 20 to 30 minutes (about 17km)<\/td><\/tr><tr><th>Feel of the resort<\/th><td>Low rise and spread out, 434 suites across 11 buildings of up to 5 floors, set in tropical gardens<\/td><td>One modern high rise tower with 497 rooms, chic and contemporary, lagoon or sea views<\/td><\/tr><tr><th>Official rating<\/th><td class=\"win\">AAA Five Diamond<\/td><td>AAA Four Diamond<\/td><\/tr><tr><th>Tripadvisor<\/th><td class=\"win\">5.0 out of 5 from 13,598 reviews<\/td><td>4.6 out of 5 from 19,576 reviews<\/td><\/tr><tr><th>Restaurants<\/th><td>9, including French (Bordeaux), Italian (Portofino), seafood (Oceana), Mexican (El Patio), Asian (Himitsu), Seaside Grill and a buffet<\/td><td>9, including Italian (Nebbiolo), Mediterranean (Olio), Asian (Dragons), seafood (Sea Salt Grill), steak (Bluewater Grill) and a buffet<\/td><\/tr><tr><th>Bars<\/th><td>7, including the Barracuda pool and beach bar and a lobby bar with fire pit<\/td><td class=\"win\">Over a dozen bars and lounges, including a wine cellar bar, piano lounge and sports bar<\/td><\/tr><tr><th>Pools<\/th><td>3 pools including an oceanfront infinity pool<\/td><td>3 pools including 2 infinity pools<\/td><\/tr><tr><th>Room you are quoted<\/th><td class=\"win\">Tropical Junior Suite with balcony or terrace<\/td><td>Deluxe Double Room with balcony and partial lagoon view<\/td><\/tr><tr><th>Spa<\/th><td class=\"win\">Secrets Spa, around 18,000 square feet, with an outdoor hydrotherapy circuit<\/td><td>Secrets Spa with hydrotherapy<\/td><\/tr><tr><th>Beach and sea<\/th><td class=\"win\">Calm bay with green sea turtles and the reef about 150m offshore, great snorkelling<\/td><td>Long soft white sand beach on the open Caribbean, livelier sea<\/td><\/tr><tr><th>On your doorstep<\/th><td>Tulum ruins about 26km away, cenotes and eco parks nearby<\/td><td>Cancun nightlife, shopping and restaurants, ferries to Isla Mujeres<\/td><\/tr><tr><th>Tourist tax at the hotel<\/th><td>About £56.72 (US$76)<\/td><td>About £56.72 (US$76)<\/td><\/tr><\/tbody><\/table><\/div>"

b>Preferred Club Lounge<\/b>, open 07.00 to 23.00 every day<\/li><li>Personalised concierge, plus private check in and check out<\/li><li>Daily continental breakfast in the lounge<\/li><li>Afternoon hot and cold canapés, desserts and premium spirits in the lounge<\/li><li>An exclusive breakfast at Seaside Grill, 08.00 to 10.00<\/li><li>Upgraded minibar and upgraded bathroom toiletries<\/li><li>Access to Preferred Club only areas around the resort<\/li><\/ul><\/div>\n<div class=\"agb\"><h4>Live upgrade prices at Akumal<\/h4><ul><li><b>Tropical Club Junior Suite<\/b>, garden view: <b>+£929.20<\/b> for you both (about £46 per person per night). Only 1 left<\/li><li><b>Club Preferred Junior Suite with Sea View<\/b>: <b>+£1,535.20<\/b> for you both (about £77 per person per night). Only 2 left<\/li><li>Tick either one in the extras below and the full price updates<\/li><\/ul><\/div>\n<\/div>\n<div class=\"verdict\"><h4>Is it worth it?<\/h4><p>Honestly, on a holiday where you are keeping an eye on the cost, Preferred Club is a lovely extra rather than a must. Everything that makes Secrets great, the restaurants, the bars, the top shelf drinks and the beach, is already included without it. Where it earns its money is a quieter lounge to escape to over New Year, a relaxed private breakfast and someone on hand to book restaurants and trips for you. If you do go for it, the sea view version is the one I would pick, as that is the upgrade you notice every single day.<\/p><p>At The Vine, Preferred Club rooms are not available on your dates. The only upgrade available there is a sea view room for +£351.48, which is in the extras below.<\/p><\/div>"
