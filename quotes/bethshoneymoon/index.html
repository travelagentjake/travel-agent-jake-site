   "id": "allinclusive",
   "title": "What is included and the local area",
   "intro": "You said the all inclusive matters most, so here is exactly what this hotel includes and what costs extra, followed by a guide to the area.",
   "html": "<div class=\"ag\" id=\"ag-trsyucatan\"><h3>What is included at TRS Yucatan Hotel</h3><p class=\"agh\">All inclusive, as listed by the tour operator</p><div class=\"aggrid\"><div class=\"agb\"><h4>Included in your price</h4><ul><li>Breakfast, lunch, dinner, snacks and drinks all day</li><li>A la carte dinners at the TRS only restaurants: Tentazione Italian, La Boheme French and El Gaucho Argentinian steakhouse</li><li>More a la carte at the sister hotels, including steakhouse, Brazilian, Mexican and Japanese</li><li>Capricho for breakfast and lunch with a buffet and an a la carte menu, plus Helios beach club</li><li>29 bars across the resort, 6 just for TRS guests including Aurum lobby bar and Gaia, Las Rocas and La Terraza pool bars</li><li>Personalised minibar in your suite</li><li>Waiter service at the TRS pools</li></ul></div><div class=\"agb\"><h4>Costs extra</h4><ul><li>The Chic Cabaret dinner show has a reservation fee, plus spa treatments, diving and catamaran trips</li></ul></div></div><h3 style=\"margin-top:22px\">The local area</h3><p class=\"agi\">Riviera Maya is the Caribbean coast south of Cancun, with white sand beaches, Mayan ruins and freshwater cenotes. The hotel sits on a quiet beachfront stretch between Playa del Carmen and Tulum.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat</h4><ul><li>21 restaurants across the Grand Palladium resort</li><li>Playa del Carmen's Fifth Avenue for a night out, about 32km away</li><li>Fresh tacos and ceviche in local towns</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li>6 TRS only bars including Full Moon and Io</li><li>Live shows in the resort theatre</li><li>Beach clubs in Playa del Carmen</li></ul></div><div class=\"agb\"><h4>Nearby</h4><ul><li>Playa del Carmen, about 32km</li><li>Tulum ruins and beaches, about 45 minutes</li><li>Cenotes for swimming, a short drive</li><li>Cancun, about 95km</li></ul></div></div></div><div class=\"ag\" id=\"ag-secretsmirabel\"><h3>What is included at Secrets Mirabel Cancun Resort & Spa</h3><p class=\"agh\">All inclusive, as listed by the tour operator</p><div class=\"aggrid\"><div class=\"agb\"><h4>Included in your price</h4><ul><li>Breakfast, lunch, dinner, snacks and premium drinks</li><li>A la carte dinners at Blue Water steakhouse, Bordeaux French, Himitsu Japanese sushi bar and Olio Mediterranean and Italian with homemade pasta and pizza</li><li>Market Cafe buffet with live cooking for breakfast and lunch, and Barefoot Grill by the pool</li><li>Coco Cafe open 24 hours for snacks and gelato</li><li>Lobby bar, Desires bar which becomes a nightclub from 10pm, and Manatees pool bar</li><li>Gluten free and plant based options</li></ul></div><div class=\"agb\"><h4>Costs extra</h4><ul><li>Dry aged steaks, teppanyaki tables, premium sake and fine wines, the wine cellar, romantic dinners, spa and the Preferred Club areas such as the rooftop Sky Bar</li></ul></div></div><h3 style=\"margin-top:22px\">The local area</h3><p class=\"agi\">Cancun's Hotel Zone is a long strip of land between the Caribbean and a lagoon, lined with beaches, beach clubs, malls and restaurants.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat</h4><ul><li>Gourmet restaurants at the hotel</li><li>La Isla Shopping Village restaurants, about 8km</li><li>Seafood and tacos in downtown Cancun</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li>Six bars at the hotel</li><li>Famous Hotel Zone clubs like Coco Bongo</li><li>Beach clubs along the strip</li></ul></div><div class=\"agb\"><h4>Nearby</h4><ul><li>La Isla Shopping Village, about 8km</li><li>Isla Mujeres by ferry, about 25 minutes</li><li>Xcaret park, about 70km</li><li>Chichen Itza, about 212km</li></ul></div></div></div><div class=\"ag\" id=\"ag-couplestowerisle\"><h3>What is included at Couples Tower Isle</h3><p class=\"agh\">All inclusive, as listed by the tour operator</p><div class=\"aggrid\"><div class=\"agb\"><h4>Included in your price</h4><ul><li>Breakfast, lunch, dinner, snacks and drinks</li><li>A la carte dinners at Eight Rivers (gourmet Caribbean), Bayside Asian and The Verandah with sea views, book ahead for these</li><li>Patio Mediterranean buffet, a pool grill open late into the night and a beach barbecue on Mondays</li><li>Room service included, with breakfast, lunch, snacks and dinner to your room</li><li>Java Cafe with Jamaica Blue Mountain coffee, and a veggie bar for smoothies and salads</li><li>Piano bar, main bar, two swim up bars, The Lounge beach nightclub and Martinis on the Roof</li><li>Scuba diving (an introductory dive, and one dive a day if you are PADI certified), water skiing, windsurfing, kayaks, snorkelling and glass bottom boat trips</li><li>Golf at nearby Upton Hills with green fees and transfers, plus a shopping shuttle to Ocho Rios</li></ul></div><div class=\"agb\"><h4>Costs extra</h4><ul><li>Private dining on the beach, night snorkelling, golf club and caddy hire, and spa treatments</li></ul></div></div><h3 style=\"margin-top:22px\">The local area</h3><p class=\"agi\">Ocho Rios is on Jamaica's lush north coast, known for waterfalls, rainforest and river adventures, with a lively little town for shopping and local food.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat</h4><ul><li>Three a la carte restaurants at the resort</li><li>Jerk chicken and pork at local jerk centres</li><li>Fresh seafood in Ocho Rios</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li>Six bars at the resort</li><li>Weekly beach party</li><li>Martinis on the Roof</li></ul></div><div class=\"agb\"><h4>Nearby</h4><ul><li>Ocho Rios town, about 8km</li><li>Dunn's River Falls, a short drive</li><li>Blue Hole, about 30 minutes</li><li>Montego Bay, about 2 hours</li></ul></div></div></div><div class=\"ag\" id=\"ag-royaltonhideaway\"><h3>What is included at Royalton Hideaway Negril</h3><p class=\"agh\">All inclusive, as listed by the tour operator</p><div class=\"aggrid\"><div class=\"agb\"><h4>Included in your price</h4><ul><li>Breakfast, lunch, dinner, snacks and drinks</li><li>El Dorado beachfront seafood restaurant, just for Hideaway guests, and a Hideaway only area in the buffet</li><li>A la carte as many times as you like at the Royalton Negril: Zen Japanese teppanyaki, Grazie Italian, Hunter steakhouse and Armadillo's Tex Mex</li><li>Ocean Point Bistro with French inspired dinners and Calypso with West Indies dishes</li><li>Cafe lounge and ice cream bar</li><li>Pool bar, beach bar with premium drinks and handcrafted cocktails, lobby bar, Martini bar and SCORE sports bar</li><li>Cold towels, drinks and afternoon hors d'oeuvres at the Hideaway infinity pool</li></ul></div><div class=\"agb\"><h4>Costs extra</h4><ul><li>The CX seven course chef's table, private cabanas and spa treatments</li></ul></div></div><h3 style=\"margin-top:22px\">The local area</h3><p class=\"agi\">Negril is on Jamaica's western tip, a laid back place known for Seven Mile Beach, clifftop bars and some of the best sunsets in the Caribbean.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat</h4><ul><li>Nine restaurants across the Royalton Negril complex</li><li>Beach shacks along Seven Mile Beach</li><li>Jerk and seafood in Negril town</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li>Eight bars across the resort</li><li>Rick's Cafe on the West End cliffs for sunset</li><li>Beach bars along Seven Mile Beach</li></ul></div><div class=\"agb\"><h4>Nearby</h4><ul><li>Seven Mile Beach, on your doorstep</li><li>Rick's Cafe and the West End cliffs, a short drive</li><li>Negril town, a short drive</li><li>Montego Bay, about 70km</li></ul></div></div></div><div class=\"ag\" id=\"ag-liveaqua\"><h3>What is included at Live Aqua Beach Resort Punta Cana</h3><p class=\"agh\">All inclusive, as listed by the tour operator</p><div class=\"aggrid\"><div class=\"agb\"><h4>Included in your price</h4><ul><li>Breakfast, lunch, dinner, snacks and drinks</li><li>Eight restaurants, from Spanish tapas to Japanese sushi</li><li>A la carte Italian, Mexican, French and Asian dining</li><li>Pool bar, sports bar, beach club, beach kiosk and a coffee shop</li><li>Live shows, a disco and live sport in the evenings</li><li>Volleyball, beach football, spinning and morning yoga</li></ul></div><div class=\"agb\"><h4>Costs extra</h4><ul><li>Bali beds by the pool, spa treatments and the sauna, and personal training</li></ul></div></div><h3 style=\"margin-top:22px\">The local area</h3><p class=\"agi\">Uvero Alto is the quiet northern end of the Punta Cana coast, with long empty beaches and palm groves, away from the busier resorts of Bavaro.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat</h4><ul><li>Eight restaurants at the resort</li><li>Dominican dishes such as mofongo and fresh seafood</li><li>Beach shacks for fried fish</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li>Six bars at the resort</li><li>Beach club and sports bar</li><li>Bavaro's bars, about 40 minutes</li></ul></div><div class=\"agb\"><h4>Nearby</h4><ul><li>Private beach, on your doorstep</li><li>Saona Island boat trips from the south coast</li><li>Bavaro and Punta Cana, about 40 minutes</li><li>Punta Cana airport, about 70 minutes</li></ul></div></div></div><div class=\"ag\" id=\"ag-trsturquesa\"><h3>What is included at TRS Turquesa</h3><p class=\"agh\">All inclusive, as listed by the tour operator</p><div class=\"aggrid\"><div class=\"agb\"><h4>Included in your price</h4><ul><li>Breakfast, lunch, dinner, snacks and drinks, with Champagne and premium drinks by the Turquoise pool</li><li>3 a la carte restaurants just for TRS guests, including La Boheme French and Capricho with show cooking</li><li>13 more a la carte restaurants across the resort, including Portofino Italian on the beach, Sumptuori Japanese, Adelita Mexican, Bamboo Asian and Indian, The Lola tapas and Kusko Japanese Peruvian</li><li>Six buffet restaurants for something easy</li><li>Aurum lobby bar open 24 hours, Hemingway adults only bar with a pianist and afternoon tea, swim up bar and Xtra Time sports bar</li><li>Waiter service on the private beach</li><li>Tennis, minigolf, kayaks, windsurfing and an introductory scuba session in the pool</li></ul></div><div class=\"agb\"><h4>Costs extra</h4><ul><li>The Chic Cabaret show, teppanyaki tables need booking, the casino, sailing, and the spa including its wet areas</li></ul></div></div><h3 style=\"margin-top:22px\">The local area</h3><p class=\"agi\">Bavaro is Punta Cana's best known beach, mile after mile of white sand and palm trees, with plenty of restaurants and bars a short ride away.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat</h4><ul><li>16 a la carte restaurants and 6 buffets in the Grand Palladium resort</li><li>Palma Real Shopping Village restaurants</li><li>Dominican food such as mofongo and la bandera</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li>Hemingway bar with a resident pianist</li><li>Beach parties and a disco in the resort</li><li>Beach bars in Bavaro town</li></ul></div><div class=\"agb\"><h4>Nearby</h4><ul><li>Resort centre, about 700m</li><li>Bavaro, about 4km</li><li>Saona Island day trips</li><li>Punta Cana airport, about 50 minutes</li></ul></div></div></div><div class=\"ag\" id=\"ag-mayia\"><h3>What is included at Mayia Exclusive Resort and Spa</h3><p class=\"agh\">All inclusive, as listed by the tour operator</p><div class=\"aggrid\"><div class=\"agb\"><h4>Included in your price</h4><ul><li>Breakfast, lunch, dinner, snacks and drinks including branded spirits and signature cocktails</li><li>Four a la carte restaurants included: Thymari Greek, Al Dente Italian trattoria, Wasabi Asian fusion with a retractable roof, and a grill, book ahead for dinner</li><li>Waterfront main restaurant with show cooking and theme nights</li><li>Street Food Corner, Healthy Bits, the All Day comfort restaurant and a patisserie and gelateria</li><li>Oinos Champagne bar with Champagne by the glass and canapes, Del Mar bar and Senso pool bar with waiter service</li><li>Sunbeds and umbrellas on the beach, and a local cooking class at the hotel</li><li>Live shows, Greek night and the Bo nightclub</li><li>Tennis, yoga, pilates, aqua aerobics and mixology lessons</li></ul></div><div class=\"agb\"><h4>Costs extra</h4><ul><li>Balinese beds on the beach, spa treatments, hammam treatments, hairdresser and tennis floodlights</li></ul></div></div><h3 style=\"margin-top:22px\">The local area</h3><p class=\"agi\">Kiotari is a quiet stretch of Rhodes' east coast with long beaches and clear water, with whitewashed Lindos and its clifftop Acropolis about 20 minutes away.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat</h4><ul><li>Five restaurants at the hotel</li><li>Tavernas in Lindos village</li><li>Fresh fish in Kiotari and Gennadi</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li>Oinos Champagne bar and Bo nightclub</li><li>Bars around Lindos main square</li><li>Beach bars in Kiotari</li></ul></div><div class=\"agb\"><h4>Nearby</h4><ul><li>Beach, about 200m</li><li>Kiotari resort centre, about 2.5km</li><li>Lindos, about 20 minutes by car</li><li>Rhodes Old Town, about an hour</li></ul></div></div></div><div class=\"ag\" id=\"ag-aulus\"><h3>What is included at Aulus Chania, by Domes Resorts</h3><p class=\"agh\">All inclusive, as listed by the tour operator</p><div class=\"aggrid\"><div class=\"agb\"><h4>Included in your price</h4><ul><li>Breakfast, lunch, dinner, snacks and drinks</li><li>A la carte dinners at Meze for Greek sharing plates and Yellow Sea for sushi and sashimi, book at least a day ahead</li><li>Tesoro Mio Italian a la carte lunch with pizza and antipasti, book a day ahead</li><li>The Island buffet with themed nights, vegan and gluten free choices and a 24 hour grab and go</li><li>The Spritzeria sea view cocktail bar until midnight and Tesoro Mio pool bar</li><li>One Night Out trip to Chania per stay with a minibus, a drink at a local bar and shop discounts</li><li>Weekly Greek panigiri, DJ nights, shows, yoga, pilates and sound baths</li></ul></div><div class=\"agb\"><h4>Costs extra</h4><ul><li>Spa treatments and sauna, bike and scooter hire, horse riding, hiking and boat cruises</li></ul></div></div><h3 style=\"margin-top:22px\">The local area</h3><p class=\"agi\">Stavros is a small, peaceful village on the Akrotiri peninsula near Chania, with a sheltered sandy bay and mountains behind. Chania's Venetian harbour and old town are a short drive away.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat</h4><ul><li>Four restaurants at the hotel</li><li>Seafood tavernas in Stavros</li><li>Chania's old harbour restaurants, about 15km</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li>The Spritzeria and Tesoro Mio bar</li><li>Bars around Chania's Venetian harbour</li><li>Beach bars in Stavros</li></ul></div><div class=\"agb\"><h4>Nearby</h4><ul><li>Stavros village, about 1km</li><li>Pachia Ammos beach, about 1.5km</li><li>Chania old town, about 15km</li><li>Chania airport, about 25 minutes</li></ul></div></div></div>",
