   "title": "Grand Baie and staying safe on your own",
   "html": "<div class=\"ag\"><h3>Grand Baie, on your doorstep<\/h3><div class=\"agh\">Both hotels are in Grand Baie, a few minutes' walk from the village<\/div><div class=\"agstrip\"><figure><img src=\"https://images.unsplash.com/photo-1576066626712-09fe5f4cbae0?w=900&amp;q=78&amp;auto=format&amp;fit=crop\" alt=\"The north coast of Mauritius near Grand Baie\" loading=\"lazy\"><figcaption>The north coast<\/figcaption><\/figure><figure><img src=\"https://images.unsplash.com/photo-1662039071109-001778325956?w=900&amp;q=78&amp;auto=format&amp;fit=crop\" alt=\"Boats on the water in Grand Baie\" loading=\"lazy\"><figcaption>Boats in the bay<\/figcaption><\/figure><figure><img src=\"https://images.unsplash.com/photo-1672351738075-b2ae4fe9f839?w=900&amp;q=78&amp;auto=format&amp;fit=crop\" alt=\"La Cuvette beach in Grand Baie\" loading=\"lazy\"><figcaption>La Cuvette beach<\/figcaption><\/figure><figure><img src=\"https://images.unsplash.com/photo-1744779368727-0cb713d962ca?w=900&amp;q=78&amp;auto=format&amp;fit=crop\" alt=\"Sunset over the sea at Pereybere\" loading=\"lazy\"><figcaption>Sunset at Pereybere<\/figcaption><\/figure><\/div><p class=\"agi\">Grand Baie is the liveliest spot on the island and the reason I picked these two hotels for you. Mauricia and the Royal Palm sit side by side on the bay, and the village centre is roughly a 5 to 10 minute stroll away, so you never need a taxi for dinner, a browse round the shops or a cocktail at sunset. It feels sociable and easy going, with plenty of other visitors around, which is exactly what you want travelling on your own.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Walk to from the hotel<\/h4><ul><li><b>Sunset Boulevard<\/b>, the waterfront strip of shops, cafes and restaurants<\/li><li><b>Grand Baie public beach<\/b>, where most of the catamaran trips set off<\/li><li><b>Grand Baie Bazaar<\/b>, a little local market for crafts, sarongs and souvenirs<\/li><li><b>Surya Oudaya Sangam temple<\/b>, a beautifully colourful Hindu temple<\/li><li><b>Bars and restaurants<\/b> along the Royal Road, from seafood to Creole curries<\/li><li><b>La Cuvette<\/b>, a pretty little public beach popular with locals<\/li><\/ul><\/div><div class=\"agb safe\"><h4>Travelling solo? You will feel at home<\/h4><ul><li>Mauritius is one of the most relaxed, welcoming islands I sell, and it is a big favourite of mine for solo travellers<\/li><li>Staying in Grand Baie means busy, well lit streets with restaurants and other holidaymakers, rather than an isolated resort<\/li><li>Both hotels have <b>24 hour security<\/b> and a friendly front desk who will happily book taxis and trips for you<\/li><li>Your <b>private transfers<\/b> mean you are met at the airport and taken straight to the door<\/li><li>Use the usual common sense: hotel safe for your passport, watch your bag in busy spots, use taxis the hotel books after dark rather than walking quiet beaches alone at night<\/li><li>English is widely spoken, and I am only a WhatsApp away the whole time you are there<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><p class=\"agnbi\">All easy by taxi or on a trip from the hotel.<\/p><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 10 mins<\/span><div><b class=\"nbn\">Pereybere beach<\/b><span class=\"nbd\">A lovely sheltered beach for snorkelling and sunset<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 15 mins<\/span><div><b class=\"nbn\">Cap Malheureux<\/b><span class=\"nbd\">The famous red roofed church looking out to Coin de Mire island<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 25 mins<\/span><div><b class=\"nbn\">Pamplemousses Botanical Garden<\/b><span class=\"nbd\">Giant water lilies, palms and centuries old trees<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 35 mins<\/span><div><b class=\"nbn\">Port Louis<\/b><span class=\"nbd\">The capital, with its busy central market and Caudan Waterfront<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos from Unsplash. Walking and driving times are approximate.<\/p><\/div>"

454019-6796c01e8e43?w=900&amp;q=78&amp;auto=format&amp;fit=crop\" alt=\"A chauffeur car door opening\" loading=\"lazy\"><figcaption>Chauffeur drive<\/figcaption><\/figure><\/div><div class=\"cx\"><div class=\"cxr\"><h4>Getting to the airport<\/h4><div class=\"cxg\"><div><b>Business<\/b>Emirates chauffeur drive from your door to Manchester Airport and home again, within Emirates' set distance for Business Class<\/div><div><b>First<\/b>Emirates chauffeur drive to and from Manchester Airport, with a longer distance allowance than Business Class<\/div><\/div><\/div><div class=\"cxr\"><h4>Check in<\/h4><div class=\"cxg\"><div><b>Business<\/b>Priority Business Class check in and fast track where available<\/div><div><b>First<\/b>Dedicated First Class check in and fast track where available<\/div><\/div><\/div><div class=\"cxr\"><h4>Lounges<\/h4><div class=\"cxg\"><div><b>Business<\/b>Emirates Business Class lounges in Manchester and Dubai<\/div><div><b>First<\/b>The Emirates First Class lounge in Dubai, with fine dining, a spa and quiet rooms for your night time connection<\/div><\/div><\/div><div class=\"cxr\"><h4>Your seat<\/h4><div class=\"cxg\"><div><b>Business<\/b>A lie flat bed with direct aisle access on most aircraft, with a minibar and big personal screen<\/div><div><b>First<\/b>A private suite with sliding doors, a fully flat bed, your own minibar and vanity area<\/div><\/div><\/div><div class=\"cxr\"><h4>Food and drink<\/h4><div class=\"cxg\"><div><b>Business<\/b>Multi course dining with fine wines and Champagne, served when you are ready<\/div><div><b>First<\/b>Dine on demand from an a la carte menu, Dom Perignon Champagne and caviar<\/div><\/div><\/div><div class=\"cxr\"><h4>Little luxuries<\/h4><div class=\"cxg\"><div><b>Business<\/b>Amenity kit, noise cancelling headphones and the onboard lounge bar on A380 flights<\/div><div><b>First<\/b>Luxury amenity kit, moisturising pyjamas and, on A380 flights, the famous onboard Shower Spa<\/div><\/div><\/div><div class=\"cxr\"><h4>Bags<\/h4><div class=\"cxg\"><div><b>Business<\/b>2 x 32kg hold bags<\/div><div><b>First<\/b>2 x 32kg hold bags<\/div><\/div><\/div><\/div><div class=\"cmpgap\"><b>What the upgrade costs.<\/b> Your flight times are exactly the same in both cabins, so it is purely about the experience. Going First Class adds £5,152 to the price, whichever hotel you choose. Business Class on Emirates is already a superb way to fly, with a proper bed for the overnight flights, and First Class turns the journey into part of the holiday.<\/div><p class=\"agcred\">Seat, menu and amenity details vary by aircraft and route and are set by Emirates. Chauffeur drive is booked through Emirates at least a day before you fly, and I will check your home address is within the free distance when we book. Photos from Unsplash are for illustration.<\/p>"
