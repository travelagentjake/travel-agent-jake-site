   "html": "<div class=\"ag\" id=\"ag-greekmystique\"><h3>Greek Mystique, then 7 nights in Cavtat<\/h3><p class=\"agh\">Cruise first, then relax<\/p><p class=\"agi\">You fly into Dubrovnik and board Marella Discovery 2 the same day, so the holiday starts with a week of Greek islands, Athens and the Bay of Kotor. When the ship comes back to Dubrovnik you head to Hotel Croatia in Cavtat for a week of sea views and doing as little as you like.<\/p><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">Thu 16 Sep<\/span><div><b class=\"nbn\">Dubrovnik, Croatia<\/b><span class=\"nbd\">Board the ship, sail at 20:00<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Fri 17 Sep<\/span><div><b class=\"nbn\">A day at sea<\/b><span class=\"nbd\">Spa, sun deck and a lazy lunch<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Sat 18 Sep<\/span><div><b class=\"nbn\">Piraeus for Athens, Greece<\/b><span class=\"nbd\">In port 09:00 to 18:00, see the Acropolis<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Sun 19 Sep<\/span><div><b class=\"nbn\">Souda for Chania, Crete<\/b><span class=\"nbd\">In port 09:00 to 17:00, a pretty Venetian harbour<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Mon 20 Sep<\/span><div><b class=\"nbn\">Katakolon for Olympia, Greece<\/b><span class=\"nbd\">In port 09:00 to 18:00, home of the first Olympic Games<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Tue 21 Sep<\/span><div><b class=\"nbn\">Corfu Town, Corfu<\/b><span class=\"nbd\">In port 09:00 to 17:00, cafes and old forts<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Wed 22 Sep<\/span><div><b class=\"nbn\">Kotor, Montenegro<\/b><span class=\"nbd\">In port 08:00 to 17:00, sail in through the fjord like bay<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Thu 23 Sep<\/span><div><b class=\"nbn\">Dubrovnik, Croatia<\/b><span class=\"nbd\">Arrive 04:00, then on to your hotel<\/span><\/div><\/div><\/div><h3 style=\"margin-top:22px\">Your ship, Marella Discovery 2<\/h3><p class=\"agh\">Adults only sailing, 17 and over<\/p><div class=\"agstrip\"><figure><img src=\"https://content.tui.co.uk/adamtui/2017_10/12_9/5992c13a-6592-4880-a239-a80a00977876/CRU_DIS2_17_F040_NEWWebOriginalCompressed.jpg\" alt=\"Marella Discovery 2\" loading=\"lazy\"><figcaption>Marella Discovery 2<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2020_3/16_14/374f62b0-40ba-4ea8-8cf9-ab8000ef869e/150013_CRU_DIS2_F014WebOriginalCompressed.jpg\" alt=\"On board Marella Discovery 2\" loading=\"lazy\"><figcaption>On board Marella Discovery 2<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2017_8/14_10/2da1b468-e73b-47c1-96ab-a7cf00b49e08/CRU_DIS2_17_F072WebOriginalCompressed.jpg\" alt=\"Sun deck and pool\" loading=\"lazy\"><figcaption>Sun deck and pool<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2020_3/16_14/41902fa1-2a7d-4778-a797-ab8000efcd55/150013_CRU_DIS2_F015WebOriginalCompressed.jpg\" alt=\"Relaxing on board\" loading=\"lazy\"><figcaption>Relaxing on board<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2023_12/19_13/873ce77a-b28a-48f9-be90-b0dd00e053b9/CRU_DIS_23_F033_Broadway_Show_LoungeWebOriginalCompressed.jpg\" alt=\"The Broadway style show lounge\" loading=\"lazy\"><figcaption>The Broadway style show lounge<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2023_12/19_13/11c3a455-d9c2-4d3e-9ed5-b0dd00dec1f6/CRU_DIS_23_F011_Atrium_BarWebOriginalCompressed.jpg\" alt=\"Atrium bar\" loading=\"lazy\"><figcaption>Atrium bar<\/figcaption><\/figure><\/div><p class=\"agi\">This sailing is adults only, so it is calm and relaxed. Marella Discovery 2 is one of the smaller ships in the Marella fleet, which you said you would prefer, so it never feels crowded and you get to know your way around quickly.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>On board<\/h4><ul><li>11 decks, 918 cabins and 9 lifts<\/li><li>9 restaurants and 7 bars<\/li><li>An indoor and an outdoor pool<\/li><li>Spa, outdoor cinema, climbing wall and minigolf<\/li><li>Broadway style shows every night<\/li><\/ul><\/div><div class=\"agb\"><h4>Included in your price<\/h4><ul><li>All inclusive food and selected drinks on board<\/li><li>All tips and service charges<\/li><li>Flights with a hold bag each, and transfers<\/li><li>Your balcony cabin on Deck 6, with two chairs and a table outside<\/li><li>Kora La pan Asian restaurant is an optional extra, book ahead<\/li><\/ul><\/div><\/div><h3 style=\"margin-top:22px\">Cavtat, your week on land<\/h3><p class=\"agi\" style=\"margin-top:8px\">Cavtat is a pretty little harbour town just south of Dubrovnik, with a palm lined promenade, waterfront restaurants and a lovely coastal path around the peninsula. It is much quieter than Dubrovnik but only a short boat ride away.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat<\/h4><ul><li>Fresh fish on the harbour front, caught that morning<\/li><li>Slow cooked Croatian dishes in the old town<\/li><li>The steakhouse and buffet at the hotel<\/li><\/ul><\/div><div class=\"agb\"><h4>Evenings<\/h4><ul><li>A drink on the promenade at sunset<\/li><li>The piano bar at Hotel Croatia<\/li><li>Summer festival music and street performers<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Easy days out from your hotel<\/h4><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Walk<\/span><div><b class=\"nbn\">Cavtat town<\/b><span class=\"nbd\">About 10 to 15 minutes downhill from the hotel<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Boat<\/span><div><b class=\"nbn\">Dubrovnik old town<\/b><span class=\"nbd\">Water taxis run along the coast from Cavtat harbour<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Walk<\/span><div><b class=\"nbn\">Peninsula path<\/b><span class=\"nbd\">A 2km path around the headland with beaches and sea views<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Day trip<\/span><div><b class=\"nbn\">Kotor or Mostar<\/b><span class=\"nbd\">Easy coach trips into Montenegro or Bosnia<\/span><\/div><\/div><\/div><\/div><div class=\"ag\" id=\"ag-iberiantreasures\"><h3>Iberian Treasures, then 7 nights in Nerja<\/h3><p class=\"agh\">Cruise first, then relax<\/p><p class=\"agi\">You fly to Malaga and board Marella Explorer 2, an adults only ship, for a week of Gibraltar, Porto, Lisbon, Cadiz and a day in Morocco. Then you finish with a week by the beach at the Riu Monica in Nerja, one of the prettiest towns on the Costa del Sol.<\/p><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">Wed 22 Sep<\/span><div><b class=\"nbn\">Malaga, Spain<\/b><span class=\"nbd\">Board the ship, sail at 22:00<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Thu 23 Sep<\/span><div><b class=\"nbn\">Gibraltar<\/b><span class=\"nbd\">In port 09:00 to 18:00, the Rock and its famous apes<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Fri 24 Sep<\/span><div><b class=\"nbn\">A day at sea<\/b><span class=\"nbd\">Spa, sun deck and afternoon tea<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Sat 25 Sep<\/span><div><b class=\"nbn\">Leixoes for Porto, Portugal<\/b><span class=\"nbd\">In port 08:00 to 16:00, port cellars by the river<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Sun 26 Sep<\/span><div><b class=\"nbn\">Lisbon, Portugal<\/b><span class=\"nbd\">In port 08:00 to 16:00, trams and pastel de nata<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Mon 27 Sep<\/span><div><b class=\"nbn\">Cadiz, Spain<\/b><span class=\"nbd\">In port 13:00 to 22:00, an evening in an old sea city<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Tue 28 Sep<\/span><div><b class=\"nbn\">Tangier, Morocco<\/b><span class=\"nbd\">In port 08:00 to 18:00, souks and mint tea in Africa<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Wed 29 Sep<\/span><div><b class=\"nbn\">Malaga, Spain<\/b><span class=\"nbd\">Arrive 06:00, then on to Nerja<\/span><\/div><\/div><\/div><h3 style=\"margin-top:22px\">Your ship, Marella Explorer 2<\/h3><p class=\"agh\">Adults only sailing, 17 and over<\/p><div class=\"agstrip\"><figure><img src=\"https://content.tui.co.uk/adamtui/2021_4/13_15/4e4f9de0-fd87-4459-bbac-ad0900f8e2c7/CRU_EXPLORER2_F295WebOriginalCompressed.jpg\" alt=\"Marella Explorer 2\" loading=\"lazy\"><figcaption>Marella Explorer 2<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2026_1/19_15/28b30fea-64c0-47e4-96ea-b3d700fbd5e9/ACC_150015_MARELLA_EXPLORER_2_014_BALCONY_CABIN_3_BERTHWebOriginalCompressed.jpg\" alt=\"A balcony cabin\" loading=\"lazy\"><figcaption>A balcony cabin<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2019_12/10_12/b843f2f9-c350-448c-bebf-ab1f00c99c6b/ACC_150015_CRU_EXPLORER2_F199_Main_Dining_RoomWebOriginalCompressed.jpg\" alt=\"The main dining room\" loading=\"lazy\"><figcaption>The main dining room<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2019_9/12_14/4df15e3e-5648-46f6-b676-aac600e8b3f7/CRU_EXPLORER2_F140WebOriginalCompressed.jpg\" alt=\"Out on deck\" loading=\"lazy\"><figcaption>Out on deck<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2026_1/19_15/278b628a-88b6-4578-8156-b3d700fccb5a/ACC_150015_MARELLA_EXPLORER_2_123_BROADWAY_SHOW_LOUNGEWebOriginalCompressed.jpg\" alt=\"The show lounge\" loading=\"lazy\"><figcaption>The show lounge<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2026_1/19_15/3cd8d4a6-9196-4a9b-8e61-b3d700fcd833/ACC_150015_MARELLA_EXPLORER_2_129_OCEANS_SPA_DOUBLE_TREATMENT_ROOMWebOriginalCompressed.jpg\" alt=\"Oceans Spa\" loading=\"lazy\"><figcaption>Oceans Spa<\/figcaption><\/figure><\/div><p class=\"agi\">Marella Explorer 2 is adults only on every sailing, so you have peace and quiet the whole week. It is a similar size to Discovery 2, small enough to feel friendly, with lots of little bars and quiet corners.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>On board<\/h4><ul><li>An adults only ship, 14 decks and 907 cabins<\/li><li>10 restaurants and 9 bars<\/li><li>A large spa and a pool<\/li><li>The 19th Hole golf bar with a golf simulator<\/li><li>Flutes for Champagne or Prosecco with a pianist, and Beach Cove with swinging seats<\/li><\/ul><\/div><div class=\"agb\"><h4>Included in your price<\/h4><ul><li>All inclusive food and selected drinks on board<\/li><li>All tips and service charges<\/li><li>Flights with a hold bag each, and transfers<\/li><li>Your Deck 8 balcony cabin, 16m² with a 3.7m² balcony, two chairs and a table<\/li><li>Speciality restaurants and Champagne are optional extras<\/li><\/ul><\/div><\/div><h3 style=\"margin-top:22px\">Nerja, your week on land<\/h3><p class=\"agi\" style=\"margin-top:8px\">Nerja is a whitewashed town on the eastern Costa del Sol, built on cliffs above a string of sandy coves. The Balcon de Europa viewpoint is the heart of the town, with cafes, tapas bars and little shops all around it.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat<\/h4><ul><li>Tapas bars in the old town streets<\/li><li>Seafood and paella by the beach<\/li><li>Buffet and themed nights at the hotel, or the Ole Spanish restaurant<\/li><\/ul><\/div><div class=\"agb\"><h4>Evenings<\/h4><ul><li>A stroll to the Balcon de Europa at sunset<\/li><li>Pubs and tapas bars close to the hotel<\/li><li>Live music in the town squares<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Easy days out from your hotel<\/h4><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Walk<\/span><div><b class=\"nbn\">Nerja beaches<\/b><span class=\"nbd\">The hotel overlooks the beach and promenade<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Short drive<\/span><div><b class=\"nbn\">Nerja Caves<\/b><span class=\"nbd\">Huge caves with concerts in the summer, a few minutes away<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Short drive<\/span><div><b class=\"nbn\">Frigiliana<\/b><span class=\"nbd\">A white hilltop village a short drive inland<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Day trip<\/span><div><b class=\"nbn\">Malaga or Granada<\/b><span class=\"nbd\">Malaga is under an hour, the Alhambra in Granada makes a great day out<\/span><\/div><\/div><\/div><\/div><div class=\"ag\" id=\"ag-sailthreeseas\"><h3>7 nights in Dubrovnik, then Sail Three Seas<\/h3><p class=\"agh\">Stay first, then cruise<\/p><p class=\"agi\">This one flips it round. You fly from Birmingham and spend your first week at Hotel Lapad in Dubrovnik, settling in and exploring the old town. Then you board Marella Discovery 2 for a week taking in Kotor, Corfu, Kefalonia, Sicily and Malta, and fly home from Dubrovnik on the last day.<\/p><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">Thu 30 Sep<\/span><div><b class=\"nbn\">Dubrovnik, Croatia<\/b><span class=\"nbd\">Board the ship, sail at 21:00<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Fri 1 Oct<\/span><div><b class=\"nbn\">Kotor, Montenegro<\/b><span class=\"nbd\">In port 08:00 to 17:00, hike up to the fortress<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Sat 2 Oct<\/span><div><b class=\"nbn\">Corfu Town, Corfu<\/b><span class=\"nbd\">In port 09:00 to 17:00, shops and cafes in the old town<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Sun 3 Oct<\/span><div><b class=\"nbn\">Argostoli, Kefalonia<\/b><span class=\"nbd\">In port 08:00 to 17:00, turquoise bays and sea turtles<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Mon 4 Oct<\/span><div><b class=\"nbn\">Messina for Etna and Taormina, Sicily<\/b><span class=\"nbd\">In port 09:00 to 18:00, Mount Etna and hilltop Taormina<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Tue 5 Oct<\/span><div><b class=\"nbn\">Valletta, Malta<\/b><span class=\"nbd\">In port 09:00 to 18:00, golden stone streets and harbour views<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Wed 6 Oct<\/span><div><b class=\"nbn\">A day at sea<\/b><span class=\"nbd\">A slow day before home<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Thu 7 Oct<\/span><div><b class=\"nbn\">Dubrovnik, Croatia<\/b><span class=\"nbd\">Arrive 04:00, fly home in the evening<\/span><\/div><\/div><\/div><h3 style=\"margin-top:22px\">Your ship, Marella Discovery 2<\/h3><p class=\"agh\">Adults only sailing, 17 and over<\/p><div class=\"agstrip\"><figure><img src=\"https://content.tui.co.uk/adamtui/2017_10/12_9/5992c13a-6592-4880-a239-a80a00977876/CRU_DIS2_17_F040_NEWWebOriginalCompressed.jpg\" alt=\"Marella Discovery 2\" loading=\"lazy\"><figcaption>Marella Discovery 2<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2020_3/16_14/374f62b0-40ba-4ea8-8cf9-ab8000ef869e/150013_CRU_DIS2_F014WebOriginalCompressed.jpg\" alt=\"On board Marella Discovery 2\" loading=\"lazy\"><figcaption>On board Marella Discovery 2<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2017_8/14_10/2da1b468-e73b-47c1-96ab-a7cf00b49e08/CRU_DIS2_17_F072WebOriginalCompressed.jpg\" alt=\"Sun deck and pool\" loading=\"lazy\"><figcaption>Sun deck and pool<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2020_3/16_14/41902fa1-2a7d-4778-a797-ab8000efcd55/150013_CRU_DIS2_F015WebOriginalCompressed.jpg\" alt=\"Relaxing on board\" loading=\"lazy\"><figcaption>Relaxing on board<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2023_12/19_13/873ce77a-b28a-48f9-be90-b0dd00e053b9/CRU_DIS_23_F033_Broadway_Show_LoungeWebOriginalCompressed.jpg\" alt=\"The Broadway style show lounge\" loading=\"lazy\"><figcaption>The Broadway style show lounge<\/figcaption><\/figure><figure><img src=\"https://content.tui.co.uk/adamtui/2023_12/19_13/11c3a455-d9c2-4d3e-9ed5-b0dd00dec1f6/CRU_DIS_23_F011_Atrium_BarWebOriginalCompressed.jpg\" alt=\"Atrium bar\" loading=\"lazy\"><figcaption>Atrium bar<\/figcaption><\/figure><\/div><p class=\"agi\">This sailing is adults only, so it is calm and relaxed. Marella Discovery 2 is one of the smaller ships in the Marella fleet, so it never feels crowded and you will soon find your favourite spots.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>On board<\/h4><ul><li>11 decks, 918 cabins and 9 lifts<\/li><li>9 restaurants and 7 bars<\/li><li>An indoor and an outdoor pool<\/li><li>Spa, outdoor cinema, climbing wall and minigolf<\/li><li>Broadway style shows every night<\/li><\/ul><\/div><div class=\"agb\"><h4>Included in your price<\/h4><ul><li>All inclusive food and selected drinks on board<\/li><li>All tips and service charges<\/li><li>Flights with a hold bag each, and transfers<\/li><li>Your balcony cabin on Deck 6, with two chairs and a table outside<\/li><li>Kora La pan Asian restaurant is an optional extra, book ahead<\/li><\/ul><\/div><\/div><h3 style=\"margin-top:22px\">Dubrovnik, your week on land<\/h3><p class=\"agi\" style=\"margin-top:8px\">Hotel Lapad sits on a peaceful harbour on the Lapad side of Dubrovnik. The famous old town, with its marble streets and city walls, is about 5 minutes away by taxi, and there are pebble beaches and a seafront promenade close by.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat<\/h4><ul><li>Seafood restaurants on the harbour near the hotel<\/li><li>Cafes and konobas tucked away in the old town<\/li><li>Buffet breakfast at the hotel, with a la carte on the lobby terrace<\/li><\/ul><\/div><div class=\"agb\"><h4>Evenings<\/h4><ul><li>Award winning cocktails at the hotel bar<\/li><li>Sunset from the city walls or the cable car<\/li><li>Bars along the Lapad promenade<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Easy days out from your hotel<\/h4><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Taxi<\/span><div><b class=\"nbn\">Dubrovnik old town<\/b><span class=\"nbd\">About 5 minutes by taxi, or a half hour walk<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Walk<\/span><div><b class=\"nbn\">Lapad beach<\/b><span class=\"nbd\">A small pebble beach about 10 minutes away<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Cable car<\/span><div><b class=\"nbn\">Mount Srd<\/b><span class=\"nbd\">Views over the old town and the islands<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Boat<\/span><div><b class=\"nbn\">Lokrum and the Elaphiti islands<\/b><span class=\"nbd\">Short boat trips from the old harbour<\/span><\/div><\/div><\/div><\/div>",
