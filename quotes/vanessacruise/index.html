   "intro": "A guide to the area around your hotel.",
   "html": "<div class=\"ag\" id=\"ag-greekmystique\"><h3>Cavtat, your week on land<\/h3><p class=\"agh\">The area around your hotel. Your day by day cruise is in the Itinerary tab.<\/p><p class=\"agi\">Cavtat is a pretty little harbour town just south of Dubrovnik, with a palm lined promenade, waterfront restaurants and a lovely coastal path around the peninsula. It is much quieter than Dubrovnik but only a short boat ride away.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat<\/h4><ul><li>Fresh fish on the harbour front, caught that morning<\/li><li>Slow cooked Croatian dishes in the old town<\/li><li>The steakhouse and buffet at the hotel<\/li><\/ul><\/div><div class=\"agb\"><h4>Evenings<\/h4><ul><li>A drink on the promenade at sunset<\/li><li>The piano bar at Hotel Croatia<\/li><li>Summer festival music and street performers<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Easy days out from your hotel<\/h4><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Walk<\/span><div><b class=\"nbn\">Cavtat town<\/b><span class=\"nbd\">About 10 to 15 minutes downhill from the hotel<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Boat<\/span><div><b class=\"nbn\">Dubrovnik old town<\/b><span class=\"nbd\">Water taxis run along the coast from Cavtat harbour<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Walk<\/span><div><b class=\"nbn\">Peninsula path<\/b><span class=\"nbd\">A 2km path around the headland with beaches and sea views<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Day trip<\/span><div><b class=\"nbn\">Kotor or Mostar<\/b><span class=\"nbd\">Easy coach trips into Montenegro or Bosnia<\/span><\/div><\/div><\/div><\/div><div class=\"ag\" id=\"ag-iberiantreasures\"><h3>Nerja, your week on land<\/h3><p class=\"agh\">The area around your hotel. Your day by day cruise is in the Itinerary tab.<\/p><p class=\"agi\">Nerja is a whitewashed town on the eastern Costa del Sol, built on cliffs above a string of sandy coves. The Balcon de Europa viewpoint is the heart of the town, with cafes, tapas bars and little shops all around it.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat<\/h4><ul><li>Tapas bars in the old town streets<\/li><li>Seafood and paella by the beach<\/li><li>Buffet and themed nights at the hotel, or the Ole Spanish restaurant<\/li><\/ul><\/div><div class=\"agb\"><h4>Evenings<\/h4><ul><li>A stroll to the Balcon de Europa at sunset<\/li><li>Pubs and tapas bars close to the hotel<\/li><li>Live music in the town squares<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Easy days out from your hotel<\/h4><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Walk<\/span><div><b class=\"nbn\">Nerja beaches<\/b><span class=\"nbd\">The hotel overlooks the beach and promenade<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Short drive<\/span><div><b class=\"nbn\">Nerja Caves<\/b><span class=\"nbd\">Huge caves with concerts in the summer, a few minutes away<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Short drive<\/span><div><b class=\"nbn\">Frigiliana<\/b><span class=\"nbd\">A white hilltop village a short drive inland<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Day trip<\/span><div><b class=\"nbn\">Malaga or Granada<\/b><span class=\"nbd\">Malaga is under an hour, the Alhambra in Granada makes a great day out<\/span><\/div><\/div><\/div><\/div><div class=\"ag\" id=\"ag-sailthreeseas\"><h3>Dubrovnik, your week on land<\/h3><p class=\"agh\">The area around your hotel. Your day by day cruise is in the Itinerary tab.<\/p><p class=\"agi\">Hotel Lapad sits on a peaceful harbour on the Lapad side of Dubrovnik. The famous old town, with its marble streets and city walls, is about 5 minutes away by taxi, and there are pebble beaches and a seafront promenade close by.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Places to eat<\/h4><ul><li>Seafood restaurants on the harbour near the hotel<\/li><li>Cafes and konobas tucked away in the old town<\/li><li>Buffet breakfast at the hotel, with a la carte on the lobby terrace<\/li><\/ul><\/div><div class=\"agb\"><h4>Evenings<\/h4><ul><li>Award winning cocktails at the hotel bar<\/li><li>Sunset from the city walls or the cable car<\/li><li>Bars along the Lapad promenade<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Easy days out from your hotel<\/h4><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Taxi<\/span><div><b class=\"nbn\">Dubrovnik old town<\/b><span class=\"nbd\">About 5 minutes by taxi, or a half hour walk<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Walk<\/span><div><b class=\"nbn\">Lapad beach<\/b><span class=\"nbd\">A small pebble beach about 10 minutes away<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Cable car<\/span><div><b class=\"nbn\">Mount Srd<\/b><span class=\"nbd\">Views over the old town and the islands<\/span><\/div><\/div><div class=\"nbr\" style=\"margin-bottom:10px\"><span class=\"nbt\">Boat<\/span><div><b class=\"nbn\">Lokrum and the Elaphiti islands<\/b><span class=\"nbd\">Short boat trips from the old harbour<\/span><\/div><\/div><\/div><\/div>",
