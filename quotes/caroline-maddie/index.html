   "html": "<style>\n.agjump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}\n.agjump a{background:var(--pill,#E8EDFF);color:var(--blue,#004AAD);font-weight:800;font-size:14px;border-radius:999px;padding:7px 14px;text-decoration:none}\n.ag{background:#fff;border:2px solid var(--line,#DCE3FF);border-radius:24px;padding:22px;margin:0 0 26px;scroll-margin-top:90px}\n.ag h3{font-family:'Archivo Black',sans-serif;color:var(--blue,#004AAD);font-size:24px;line-height:1.15;margin:0}\n.ag .agh{font-weight:700;color:var(--muted,#55607A);margin:4px 0 14px;font-size:15px}\n.agstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 0 16px;border-radius:18px}\n.agstrip::-webkit-scrollbar{display:none}\n.agstrip figure{flex:0 0 40%;margin:0;position:relative;scroll-snap-align:start;border-radius:16px;overflow:hidden}\n.agstrip img{width:100%;height:230px;object-fit:cover;display:block}\n.agstrip.sm figure{flex-basis:30%}\n.agstrip.sm img{height:170px}\n.agstrip figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;background:linear-gradient(transparent,rgba(16,20,43,.78));color:#fff;font-weight:700;font-size:13px}\n.ag .agi{font-size:16px;margin:0 0 16px}\n.aggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}\n.agb{background:var(--pill,#F1F4FD);border-radius:18px;padding:16px 18px}\n.agb h4{margin:0 0 8px;color:var(--blue,#004AAD);font-family:'Archivo',sans-serif;font-weight:800;font-size:17px}\n.agb ul{margin:0;padding-left:18px}\n.agb li{margin:5px 0;font-size:15px}\n.agb li b{color:var(--ink,#10142B)}\n.agb.safe{background:var(--blue,#004AAD);color:#fff}\n.agb.safe h4{color:#FFD21F}\n.agnb{margin-top:22px;padding-top:18px;border-top:3px dashed #99ACFF}\n.agnb h4{margin:0 0 4px;color:var(--blue,#004AAD);font-family:'Archivo Black',sans-serif;font-size:19px}\n.agnb .agnbi{margin:0 0 14px;font-size:15px;color:var(--muted,#55607A)}\n.nbl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.nbr{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line,#DCE3FF);border-radius:16px;padding:12px 14px;background:#fff}\n.nbr .nbt{flex:0 0 auto;background:#FFD21F;color:var(--blue,#004AAD);font-weight:800;font-size:12.5px;border-radius:999px;padding:4px 10px;white-space:nowrap}\n.nbr b.nbn{display:block;color:var(--blue,#004AAD);font-weight:800;font-size:15.5px}\n.nbr span.nbd{display:block;font-size:14px;margin-top:2px}\n.nbr span.nbd b{color:var(--ink,#10142B)}\n.agcred{font-size:11.5px;color:var(--muted,#55607A);margin:14px 0 0}\n.agcred a{color:inherit}\n.agswipe{font-size:13px;color:var(--muted,#55607A);margin:-8px 0 14px}\n@media(max-width:900px){.aggrid,.nbl{grid-template-columns:1fr}.agstrip figure{flex-basis:82%}.agstrip.sm figure{flex-basis:70%}.agstrip img{height:210px}.ag{padding:16px}.ag h3{font-size:21px}.nbr{flex-direction:column;gap:6px}}\n<\/style><div class=\"agjump\"><a href=\"#ag-olivar\">Messonghi, Corfu<\/a><a href=\"#ag-leon\">Colònia de Sant Jordi, Majorca<\/a><a href=\"#ag-aquablu\">Lambi, Kos<\/a><a href=\"#ag-contessina\">Tsilivi, Zante<\/a><\/div><div class=\"ag\" id=\"ag-olivar\"><h3>Messonghi, Corfu<\/h3><div class=\"agh\">Where The Olivar Suites is<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1723445734460-63b6c2d516e5?w=1280&q=78&auto=format&fit=crop\" alt=\"Corfu Old Town and the New Fortress\"><figcaption>Corfu Old Town, about 40 minutes away<\/figcaption><\/figure><\/div><p class=\"agi\">A small, quiet beach village on Corfu's south east coast, where the Messonghi river meets the sea. The hotel is right on the beach and the village is flat, so the tavernas are a two or three minute stroll, with no hills or busy roads to worry about.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Eat and drink<\/h4><ul><li><b>Taverna Minore<\/b>, <b>Bo The Butcher<\/b> and <b>Korali<\/b>, two or three minutes' walk<\/li><li>Fish tavernas along the river and the beach<\/li><li>The hotel's own Flya restaurant and Olibar for a quiet evening in<\/li><\/ul><\/div><div class=\"agb safe\"><h4>What it is like<\/h4><ul><li>Relaxed and friendly, the quieter of the neighbouring villages<\/li><li>Lovely for a gentle evening stroll, but more traditional village than glamorous harbour<\/li><li>Moraitika next door has more bars and shops, a short walk or taxi<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 10 mins<\/span><div><b class=\"nbn\">Moraitika<\/b><span class=\"nbd\">Bigger village with more bars, shops and tavernas<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 15 mins<\/span><div><b class=\"nbn\">Korission Lagoon<\/b><span class=\"nbd\">Dunes and quiet beaches on the west coast<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 40 mins<\/span><div><b class=\"nbn\">Corfu Town<\/b><span class=\"nbd\">The Old Town, Liston arcades and fortresses<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 45 mins<\/span><div><b class=\"nbn\">Achilleion Palace<\/b><span class=\"nbd\">Empress Sisi's palace and gardens above the sea<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://unsplash.com\" target=\"_blank\" rel=\"noopener\">Unsplash<\/a>.<\/p><\/div><div class=\"ag\" id=\"ag-leon\"><h3>Colònia de Sant Jordi, Majorca<\/h3><div class=\"agh\">Where Universal Grand León &amp; Spa is<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Isla_de_Mallorca_-_Barcas_en_el_puerto_de_Colonia_Sant_Jordi_-_panoramio.jpg/1280px-Isla_de_Mallorca_-_Barcas_en_el_puerto_de_Colonia_Sant_Jordi_-_panoramio.jpg\" alt=\"Traditional fishing boats in the harbour\"><figcaption>Traditional fishing boats in the harbour<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Mallorca-Sant_Jordi-Promenade-01.jpg/1280px-Mallorca-Sant_Jordi-Promenade-01.jpg\" alt=\"The palm lined seafront promenade\"><figcaption>The palm lined seafront promenade<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Colonia_de_Sant_Jordi_-_panoramio.jpg/1280px-Colonia_de_Sant_Jordi_-_panoramio.jpg\" alt=\"Boats moored by the harbour restaurants\"><figcaption>Boats moored by the harbour restaurants<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Ses_Salines%2C_Balearic_Islands%2C_Spain_-_panoramio_%2818%29.jpg/1280px-Ses_Salines%2C_Balearic_Islands%2C_Spain_-_panoramio_%2818%29.jpg\" alt=\"Sunset on the beaches by the village\"><figcaption>Sunset on the beaches by the village<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Colonia_de_Sant_Jordi.jpg/1280px-Colonia_de_Sant_Jordi.jpg\" alt=\"The village from above, with the salt pans behind\"><figcaption>The village from above, with the salt pans behind<\/figcaption><\/figure><\/div><p class=\"agswipe\">Use the arrows or swipe to see more, and tap any photo to see it full screen<\/p><p class=\"agi\">The hotel sits right on the seafront promenade in Colònia de Sant Jordi, a genuine Mallorcan fishing village on the quiet south coast. Little wooden boats bob in the harbour, boats head out to the Cabrera National Park by day, and evenings are all about a stroll along the front and a long dinner by the water. It is relaxed and grown up rather than a party resort, smaller and calmer than Cala d'Or, with busy terraces on summer nights.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>On your doorstep<\/h4><ul><li>The palm lined seafront promenade runs from the hotel to the harbour, about a flat 12 to 15 minute stroll<\/li><li>Bassa des Cabots, a small rocky bathing spot 3 minutes away, with Platja des Port and sandy Es Dolç a short walk along the coast<\/li><li>The old fishing harbour, with boats to the Cabrera National Park and its Blue Cave, including a 3 hour sunset cruise<\/li><li>A weekly evening market on Avinguda Primavera from May to October, and small shops along the promenade<\/li><li>Ice cream from <b>Colonial<\/b> and pastries from <b>Panadería Pons<\/b><\/li><li>Worth knowing: there is no sandy beach right outside, guests swim off the rocks or stroll to the beaches<\/li><\/ul><\/div><div class=\"agb\"><h4>Eating out in the village<\/h4><ul><li><b>Sal de Cocó<\/b>, seafood and Mediterranean dishes on a pergola terrace on the harbour wall, from chef Marta Rosselló. My pick for a special dinner (closed Tuesdays)<\/li><li><b>Port Blau<\/b>, harbourside seafood since 1965, famous for lobster stew and sea bass baked in salt<\/li><li><b>Cassai Beach House<\/b>, a converted fisherman's house looking out to Cabrera, with lobster paella<\/li><li><b>Salicornia<\/b>, modern Mallorcan cooking opposite the old fishing port<\/li><li><b>Vermutería del Mar<\/b>, relaxed tapas and rice dishes on the harbour (closed Tuesdays)<\/li><li><b>Es Carbó Bistro<\/b>, a little gem in the village streets, best to book<\/li><\/ul><\/div><div class=\"agb\"><h4>Bars and evenings<\/h4><ul><li><b>Cassai Sunset Club<\/b>, cocktails on a sunset terrace from 6pm<\/li><li><b>Bodeguita El Cubano<\/b>, a piano bar with mojitos and live Latin music on Thursday and Saturday nights<\/li><li><b>5illes Eat &amp; Drink<\/b>, tapas and cocktails on the main street<\/li><li>A tapas route around the village bars on Thursday evenings<\/li><\/ul><\/div><div class=\"agb safe\"><h4>How it feels for the two of you<\/h4><ul><li>A quiet, friendly village where the evening walk is along the seafront promenade, with couples and families out for dinner<\/li><li>One of the calmest options of the four for walking back together after dinner<\/li><li>Taxi apps do not work here, so reception will book one for trips out<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby towns and how close they are<\/h4><p class=\"agnbi\">Drive times from Colònia de Sant Jordi are approximate.<\/p><div class=\"agstrip sm\"><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1656508443831-5881fd24d221?w=1280&q=78&auto=format&fit=crop\" alt=\"Es Trenc beach, just along the coast\"><figcaption>Es Trenc beach, just along the coast<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Mallorca-Santany%C3%AD_%28city%29-Pla%C3%A7a_Major-market-02.jpg/1280px-Mallorca-Santany%C3%AD_%28city%29-Pla%C3%A7a_Major-market-02.jpg\" alt=\"Market day in Santanyí, 17 minutes away\"><figcaption>Market day in Santanyí, 17 minutes away<\/figcaption><\/figure><\/div><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">short taxi<\/span><div><b class=\"nbn\">Es Trenc beach<\/b><span class=\"nbd\">One of Majorca's most beautiful natural beaches, a long sweep of pale sand and clear water<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 7 mins<\/span><div><b class=\"nbn\">Ses Salines<\/b><span class=\"nbd\">Small village by the salt pans, with a weekly market on Thursdays and the Flor de Sal d'Es Trenc salt works nearby<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 15 mins<\/span><div><b class=\"nbn\">Campos<\/b><span class=\"nbd\">Traditional market town with a Thursday morning market in the main square<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 17 mins<\/span><div><b class=\"nbn\">Santanyí<\/b><span class=\"nbd\">Honey coloured stone town with galleries, boutiques and a big market on Wednesdays and Saturdays<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 20 mins<\/span><div><b class=\"nbn\">Cala Figuera<\/b><span class=\"nbd\">A picture perfect working fishing harbour lined with old boathouses<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 20 mins<\/span><div><b class=\"nbn\">Cala Llombards<\/b><span class=\"nbd\">A pretty turquoise cove backed by pine trees<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 30 mins<\/span><div><b class=\"nbn\">Cala d'Or<\/b><span class=\"nbd\">Smart marina resort with shops, cafés and sheltered coves<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 45 mins<\/span><div><b class=\"nbn\">Palma<\/b><span class=\"nbd\">The cathedral, old town shopping and harbour, for a day out in the city<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://commons.wikimedia.org/wiki/File:Isla_de_Mallorca_-_Barcas_en_el_puerto_de_Colonia_Sant_Jordi_-_panoramio.jpg\" target=\"_blank\" rel=\"noopener\">LANOEL<\/a> (CC BY-SA 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Mallorca-Sant_Jordi-Promenade-01.jpg\" target=\"_blank\" rel=\"noopener\">Asurnipal<\/a> (CC BY-SA 4.0); <a href=\"https://commons.wikimedia.org/wiki/File:Colonia_de_Sant_Jordi_-_panoramio.jpg\" target=\"_blank\" rel=\"noopener\">Anka D.<\/a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Ses_Salines,_Balearic_Islands,_Spain_-_panoramio_(18).jpg\" target=\"_blank\" rel=\"noopener\">mateu mulet<\/a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Colonia_de_Sant_Jordi.jpg\" target=\"_blank\" rel=\"noopener\">Andrés Nieto Porras<\/a> (CC BY-SA 2.0); <a href=\"https://unsplash.com/photos/INSAlcTeuTU\" target=\"_blank\" rel=\"noopener\">Bruno Kelzer<\/a> (Unsplash); <a href=\"https://commons.wikimedia.org/wiki/File:Mallorca-Santany%C3%AD_(city)-Pla%C3%A7a_Major-market-02.jpg\" target=\"_blank\" rel=\"noopener\">Asurnipal<\/a> (CC BY-SA 4.0).<\/p><\/div><div class=\"ag\" id=\"ag-aquablu\"><h3>Lambi, Kos<\/h3><div class=\"agh\">Where Theros All Suite Hotel is<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Na_pl%C3%A1%C5%BEi_v_Lambi_-_panoramio.jpg/1280px-Na_pl%C3%A1%C5%BEi_v_Lambi_-_panoramio.jpg\" alt=\"Sunbeds and beach bars on Lambi beach\"><figcaption>Sunbeds and beach bars on Lambi beach<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/2024_%28365_challenge_No._2%29_-_Week_46_%28Kos_sets%29_-_Week_3%2C_Day_5_-_Pic_5_-_early_morning_sun_on_windmill%2C_Lambi%2C_Kos_-_Flickr_-_ambabheg.jpg/1280px-2024_%28365_challenge_No._2%29_-_Week_46_%28Kos_sets%29_-_Week_3%2C_Day_5_-_Pic_5_-_early_morning_sun_on_windmill%2C_Lambi%2C_Kos_-_Flickr_-_ambabheg.jpg\" alt=\"The old windmill by Mylos Beach Bar\"><figcaption>The old windmill by Mylos Beach Bar<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Fishing_boats_in_the_port_of_Kos._Greece.jpg/1280px-Fishing_boats_in_the_port_of_Kos._Greece.jpg\" alt=\"Kos Town harbour, about 10 minutes away\"><figcaption>Kos Town harbour, about 10 minutes away<\/figcaption><\/figure><\/div><p class=\"agi\">A calm, pretty village just north of Kos Town, on a long Blue Flag beach. Theros sits right in Lambi centre, 140m from the beach with tavernas and bars on the doorstep. A flat seafront path lined with beach bars and tavernas runs all the way into Kos Town, under 10 minutes by bike or taxi, or about 25 minutes on foot from Theros.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Eat and drink<\/h4><ul><li><b>Istros<\/b>, <b>Taverna Mike<\/b> and <b>Old River<\/b> along the Lambi seafront<\/li><li><b>Mylos Beach Bar<\/b> by the windmill for sunset drinks<\/li><li>In Kos Town: <b>Petrino<\/b>, <b>Agkyra<\/b> on the marina and the <b>Omega Sky Bar<\/b> rooftop<\/li><\/ul><\/div><div class=\"agb safe\"><h4>What it is like<\/h4><ul><li>Relaxed by the hotel, with the buzz of Kos Town close by when you want it<\/li><li>Taxi back after a late dinner in town rather than walking the path<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 10 mins<\/span><div><b class=\"nbn\">Kos Town<\/b><span class=\"nbd\">Harbour, castle, old town shops and restaurants<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 15 mins<\/span><div><b class=\"nbn\">The Asklepion<\/b><span class=\"nbd\">The island's famous ancient site with views to Turkey<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 20 mins<\/span><div><b class=\"nbn\">Tigaki<\/b><span class=\"nbd\">White sand and shallow water<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 20 mins<\/span><div><b class=\"nbn\">Zia<\/b><span class=\"nbd\">Mountain village famous for its sunsets<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://commons.wikimedia.org/wiki/File:Na_pl%C3%A1%C5%BEi_v_Lambi_-_panoramio.jpg\" target=\"_blank\" rel=\"noopener\">Vítězslav Šarina<\/a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:2024_(365_challenge_No._2)_-_Week_46_(Kos_sets)_-_Week_3,_Day_5_-_Pic_5_-_early_morning_sun_on_windmill,_Lambi,_Kos_-_Flickr_-_ambabheg.jpg\" target=\"_blank\" rel=\"noopener\">Forbes Johnston<\/a> (CC BY 2.0); <a href=\"https://commons.wikimedia.org/wiki/File:Fishing_boats_in_the_port_of_Kos._Greece.jpg\" target=\"_blank\" rel=\"noopener\">Ввласенко<\/a> (CC BY-SA 3.0).<\/p><\/div><div class=\"ag\" id=\"ag-contessina\"><h3>Tsilivi and Planos, Zante<\/h3><div class=\"agh\">Where Contessina Suites &amp; Spa is<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Bay_-_panoramio_%281%29.jpg/1280px-Bay_-_panoramio_%281%29.jpg\" alt=\"Evening in the little harbour at Planos\"><figcaption>Evening in the little harbour at Planos<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Beach_-_panoramio_%2861%29.jpg/1280px-Beach_-_panoramio_%2861%29.jpg\" alt=\"The sandy bay at Tsilivi\"><figcaption>The sandy bay at Tsilivi<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1571021785662-712e369a2829?w=1280&q=78&auto=format&fit=crop\" alt=\"Navagio Shipwreck Bay\"><figcaption>Navagio Shipwreck Bay<\/figcaption><\/figure><\/div><p class=\"agi\">The quieter Planos end of Tsilivi, on a wide sandy bay looking across to Kefalonia. The beach is a couple of minutes away and the tavernas and bars of Tsilivi centre are about 300m, so dinner out every night is an easy stroll.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Eat and drink<\/h4><ul><li><b>The Olive Tree<\/b>, <b>Calypso<\/b> and <b>Trenta Nove<\/b> for a lovely dinner<\/li><li><b>Taverna by the Sea Paradeisos<\/b> right on the beach<\/li><li><b>Piscina Pool Bar<\/b> and <b>Drunk Moon<\/b> for relaxed drinks<\/li><\/ul><\/div><div class=\"agb safe\"><h4>What it is like<\/h4><ul><li>Busy and friendly in the evenings, never anywhere quiet to walk<\/li><li>Livelier than Lambi but far gentler than Laganas<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 10 mins<\/span><div><b class=\"nbn\">Zante Town<\/b><span class=\"nbd\">Solomos Square, Roma Street shopping and Bochali for sunset<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 13 mins<\/span><div><b class=\"nbn\">Alykes<\/b><span class=\"nbd\">Long sandy beach with beach tavernas<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 25 mins<\/span><div><b class=\"nbn\">Keri<\/b><span class=\"nbd\">Lighthouse sunsets and boat trips to the caves<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">around 30 to 40 mins<\/span><div><b class=\"nbn\">Navagio<\/b><span class=\"nbd\">Shipwreck Bay from the clifftop or a boat trip<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://commons.wikimedia.org/wiki/File:Bay_-_panoramio_(1).jpg\" target=\"_blank\" rel=\"noopener\">Alexey Seleznev<\/a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Beach_-_panoramio_(61).jpg\" target=\"_blank\" rel=\"noopener\">Alexey Seleznev<\/a> (CC BY 3.0); <a href=\"https://unsplash.com/photos/UISG2rrArCc\" target=\"_blank\" rel=\"noopener\">Andrey Shevard<\/a> (Unsplash).<\/p><\/div>"
