   "html": "<style>\n.agjump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}\n.agjump a{background:var(--pill,#E8EDFF);color:var(--blue,#004AAD);font-weight:800;font-size:14px;border-radius:999px;padding:7px 14px;text-decoration:none}\n.ag{background:#fff;border:2px solid var(--line,#DCE3FF);border-radius:24px;padding:22px;margin:0 0 26px;scroll-margin-top:90px}\n.ag h3{font-family:'Archivo Black',sans-serif;color:var(--blue,#004AAD);font-size:24px;line-height:1.15;margin:0}\n.ag .agh{font-weight:700;color:var(--muted,#55607A);margin:4px 0 14px;font-size:15px}\n.agstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 0 16px;border-radius:18px}\n.agstrip::-webkit-scrollbar{display:none}\n.agstrip figure{flex:0 0 40%;margin:0;position:relative;scroll-snap-align:start;border-radius:16px;overflow:hidden}\n.agstrip img{width:100%;height:230px;object-fit:cover;display:block}\n.agstrip.sm figure{flex-basis:30%}\n.agstrip.sm img{height:170px}\n.agstrip figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;background:linear-gradient(transparent,rgba(16,20,43,.78));color:#fff;font-weight:700;font-size:13px}\n.ag .agi{font-size:16px;margin:0 0 16px}\n.aggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}\n.agb{background:var(--pill,#F1F4FD);border-radius:18px;padding:16px 18px}\n.agb h4{margin:0 0 8px;color:var(--blue,#004AAD);font-family:'Archivo',sans-serif;font-weight:800;font-size:17px}\n.agb ul{margin:0;padding-left:18px}\n.agb li{margin:5px 0;font-size:15px}\n.agb li b{color:var(--ink,#10142B)}\n.agb.safe{background:var(--blue,#004AAD);color:#fff}\n.agb.safe h4{color:#FFD21F}\n.agnb{margin-top:22px;padding-top:18px;border-top:3px dashed #99ACFF}\n.agnb h4{margin:0 0 4px;color:var(--blue,#004AAD);font-family:'Archivo Black',sans-serif;font-size:19px}\n.agnb .agnbi{margin:0 0 14px;font-size:15px;color:var(--muted,#55607A)}\n.nbl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.nbr{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line,#DCE3FF);border-radius:16px;padding:12px 14px;background:#fff}\n.nbr .nbt{flex:0 0 auto;background:#FFD21F;color:var(--blue,#004AAD);font-weight:800;font-size:12.5px;border-radius:999px;padding:4px 10px;white-space:nowrap}\n.nbr b.nbn{display:block;color:var(--blue,#004AAD);font-weight:800;font-size:15.5px}\n.nbr span.nbd{display:block;font-size:14px;margin-top:2px}\n.nbr span.nbd b{color:var(--ink,#10142B)}\n.agcred{font-size:11.5px;color:var(--muted,#55607A);margin:14px 0 0}\n.agcred a{color:inherit}\n.agswipe{font-size:13px;color:var(--muted,#55607A);margin:-8px 0 14px}\n@media(max-width:900px){.aggrid,.nbl{grid-template-columns:1fr}.agstrip figure{flex-basis:82%}.agstrip.sm figure{flex-basis:70%}.agstrip img{height:210px}.ag{padding:16px}.ag h3{font-size:21px}.nbr{flex-direction:column;gap:6px}}\n<\/style><div class=\"agjump\"><a href=\"#ag-pierros\">Agios Sostis, Zante<\/a><a href=\"#ag-contessina\">Tsilivi, Zante<\/a><a href=\"#ag-aquablu\">Lambi, Kos<\/a><a href=\"#ag-ikos\">Kefalos Bay, Kos<\/a><a href=\"#ag-dassia\">Dassia, Corfu<\/a><a href=\"#ag-oceania\">Nea Moudania, Halkidiki<\/a><\/div><div class=\"ag\" id=\"ag-pierros\"><h3>Agios Sostis and Laganas Bay, Zante<\/h3><div class=\"agh\">Where Pierros Verde is<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1629286520432-fe333ba1513d?w=1280&q=78&auto=format&fit=crop\" alt=\"The little bridge out to Cameo Island at Agios Sostis\"><figcaption>The little bridge out to Cameo Island at Agios Sostis<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1571021785662-712e369a2829?w=1280&q=78&auto=format&fit=crop\" alt=\"Navagio Shipwreck Bay\"><figcaption>Navagio Shipwreck Bay<\/figcaption><\/figure><\/div><p class=\"agi\">Pierros Verde sits on a peaceful pine covered hill above Laganas Bay, between the little harbour of Agios Sostis and the long sandy beach of Laganas. The beach is about 400m away and the nearest bars and restaurants about 800m, so you can walk, but it is a hill and quiet roads, so most guests take a short taxi in the evening.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Eat and drink<\/h4><ul><li>Agios Sostis harbour (about 1.3km) for fish tavernas by the water and the footbridge to Cameo Island<\/li><li>The hotel's own à la carte restaurant and cocktail bar for a quiet night in<\/li><li>Zante Town for dinner on Solomos Square, about 15 minutes by taxi<\/li><\/ul><\/div><div class=\"agb safe\"><h4>How it feels for the two of you<\/h4><ul><li>Very peaceful at the hotel, with lovely views over the bay<\/li><li>Laganas, about 1.3km away, is Zante's party strip, so Agios Sostis is the nicer way to go for dinner<\/li><li>Taxis are the easy option after dark rather than walking the roads<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 5 mins<\/span><div><b class=\"nbn\">Agios Sostis<\/b><span class=\"nbd\">Small harbour, tavernas and Cameo Island<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 15 mins<\/span><div><b class=\"nbn\">Zante Town<\/b><span class=\"nbd\">Solomos Square, Roma Street shops and Bochali for sunset<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 20 mins<\/span><div><b class=\"nbn\">Keri<\/b><span class=\"nbd\">Lighthouse sunsets and boat trips to the caves<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 40 mins<\/span><div><b class=\"nbn\">Navagio<\/b><span class=\"nbd\">Shipwreck Bay from the clifftop or a boat trip<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://unsplash.com/photos/yEyyluiNr1c\" target=\"_blank\" rel=\"noopener\">Kevin Charit<\/a> (Unsplash); <a href=\"https://unsplash.com/photos/UISG2rrArCc\" target=\"_blank\" rel=\"noopener\">Andrey Shevard<\/a> (Unsplash).<\/p><\/div><div class=\"ag\" id=\"ag-contessina\"><h3>Tsilivi and Planos, Zante<\/h3><div class=\"agh\">Where Contessina Suites &amp; Spa is<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Bay_-_panoramio_%281%29.jpg/1280px-Bay_-_panoramio_%281%29.jpg\" alt=\"Evening in the little harbour at Planos\"><figcaption>Evening in the little harbour at Planos<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Beach_-_panoramio_%2861%29.jpg/1280px-Beach_-_panoramio_%2861%29.jpg\" alt=\"The sandy bay at Tsilivi\"><figcaption>The sandy bay at Tsilivi<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1571021785662-712e369a2829?w=1280&q=78&auto=format&fit=crop\" alt=\"Navagio Shipwreck Bay\"><figcaption>Navagio Shipwreck Bay<\/figcaption><\/figure><\/div><p class=\"agi\">The quieter Planos end of Tsilivi, on a wide sandy bay looking across to Kefalonia. The beach is a couple of minutes away and the tavernas and bars of Tsilivi centre are about 300m, so dinner out every night is an easy stroll.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Eat and drink<\/h4><ul><li><b>The Olive Tree<\/b>, <b>Calypso<\/b> and <b>Trenta Nove<\/b> for a lovely dinner<\/li><li><b>Taverna by the Sea Paradeisos<\/b> right on the beach<\/li><li><b>Piscina Pool Bar<\/b> and <b>Drunk Moon<\/b> for relaxed drinks<\/li><\/ul><\/div><div class=\"agb safe\"><h4>How it feels for the two of you<\/h4><ul><li>Busy and friendly in the evenings, never anywhere quiet to walk<\/li><li>Livelier than Lambi but far gentler than Laganas<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 10 mins<\/span><div><b class=\"nbn\">Zante Town<\/b><span class=\"nbd\">Solomos Square, Roma Street shopping and Bochali for sunset<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 13 mins<\/span><div><b class=\"nbn\">Alykes<\/b><span class=\"nbd\">Long sandy beach with beach tavernas<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 25 mins<\/span><div><b class=\"nbn\">Keri<\/b><span class=\"nbd\">Lighthouse sunsets and boat trips to the caves<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">around 30 to 40 mins<\/span><div><b class=\"nbn\">Navagio<\/b><span class=\"nbd\">Shipwreck Bay from the clifftop or a boat trip<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://commons.wikimedia.org/wiki/File:Bay_-_panoramio_(1).jpg\" target=\"_blank\" rel=\"noopener\">Alexey Seleznev<\/a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Beach_-_panoramio_(61).jpg\" target=\"_blank\" rel=\"noopener\">Alexey Seleznev<\/a> (CC BY 3.0); <a href=\"https://unsplash.com/photos/UISG2rrArCc\" target=\"_blank\" rel=\"noopener\">Andrey Shevard<\/a> (Unsplash).<\/p><\/div><div class=\"ag\" id=\"ag-aquablu\"><h3>Lambi, Kos<\/h3><div class=\"agh\">Where Aqua Blu and Theros All Suite Hotel are<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Na_pl%C3%A1%C5%BEi_v_Lambi_-_panoramio.jpg/1280px-Na_pl%C3%A1%C5%BEi_v_Lambi_-_panoramio.jpg\" alt=\"Sunbeds and beach bars on Lambi beach\"><figcaption>Sunbeds and beach bars on Lambi beach<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/2024_%28365_challenge_No._2%29_-_Week_46_%28Kos_sets%29_-_Week_3%2C_Day_5_-_Pic_5_-_early_morning_sun_on_windmill%2C_Lambi%2C_Kos_-_Flickr_-_ambabheg.jpg/1280px-2024_%28365_challenge_No._2%29_-_Week_46_%28Kos_sets%29_-_Week_3%2C_Day_5_-_Pic_5_-_early_morning_sun_on_windmill%2C_Lambi%2C_Kos_-_Flickr_-_ambabheg.jpg\" alt=\"The old windmill by Mylos Beach Bar\"><figcaption>The old windmill by Mylos Beach Bar<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Fishing_boats_in_the_port_of_Kos._Greece.jpg/1280px-Fishing_boats_in_the_port_of_Kos._Greece.jpg\" alt=\"Kos Town harbour, about 10 minutes away\"><figcaption>Kos Town harbour, about 10 minutes away<\/figcaption><\/figure><\/div><p class=\"agi\">A calm, pretty village just north of Kos Town, on a long Blue Flag beach. Aqua Blu is on the quieter stretch, and Theros sits right in Lambi centre, 140m from the beach with tavernas and bars on the doorstep. A flat seafront path lined with beach bars and tavernas runs all the way into Kos Town, under 10 minutes by bike or taxi, or about 25 minutes on foot from Theros.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Eat and drink<\/h4><ul><li><b>Istros<\/b>, <b>Taverna Mike<\/b> and <b>Old River<\/b> along the Lambi seafront<\/li><li><b>Mylos Beach Bar<\/b> by the windmill for sunset drinks<\/li><li>In Kos Town: <b>Petrino<\/b>, <b>Agkyra<\/b> on the marina and the <b>Omega Sky Bar<\/b> rooftop<\/li><\/ul><\/div><div class=\"agb safe\"><h4>How it feels for the two of you<\/h4><ul><li>Relaxed by the hotel, with the buzz of Kos Town close by when you want it<\/li><li>Taxi back after a late dinner in town rather than walking the path<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 10 mins<\/span><div><b class=\"nbn\">Kos Town<\/b><span class=\"nbd\">Harbour, castle, old town shops and restaurants<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 15 mins<\/span><div><b class=\"nbn\">The Asklepion<\/b><span class=\"nbd\">The island's famous ancient site with views to Turkey<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 20 mins<\/span><div><b class=\"nbn\">Tigaki<\/b><span class=\"nbd\">White sand and shallow water<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 20 mins<\/span><div><b class=\"nbn\">Zia<\/b><span class=\"nbd\">Mountain village famous for its sunsets<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://commons.wikimedia.org/wiki/File:Na_pl%C3%A1%C5%BEi_v_Lambi_-_panoramio.jpg\" target=\"_blank\" rel=\"noopener\">Vítězslav Šarina<\/a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:2024_(365_challenge_No._2)_-_Week_46_(Kos_sets)_-_Week_3,_Day_5_-_Pic_5_-_early_morning_sun_on_windmill,_Lambi,_Kos_-_Flickr_-_ambabheg.jpg\" target=\"_blank\" rel=\"noopener\">Forbes Johnston<\/a> (CC BY 2.0); <a href=\"https://commons.wikimedia.org/wiki/File:Fishing_boats_in_the_port_of_Kos._Greece.jpg\" target=\"_blank\" rel=\"noopener\">Ввласенко<\/a> (CC BY-SA 3.0).<\/p><\/div><div class=\"ag\" id=\"ag-ikos\"><h3>Kefalos Bay, Kos<\/h3><div class=\"agh\">Where Ikos Aria is<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Kefalos_beach._Kastri_island_and_chapel_of_St._Nicholas._Kos%2C_Greece.jpg/1280px-Kefalos_beach._Kastri_island_and_chapel_of_St._Nicholas._Kos%2C_Greece.jpg\" alt=\"Kastri islet and its chapel, just off the beach\"><figcaption>Kastri islet and its chapel, just off the beach<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Kamari%2C_Kos%2C_Greece_%285654220668%29.jpg/1280px-Kamari%2C_Kos%2C_Greece_%285654220668%29.jpg\" alt=\"Kamari harbour and its seafood tavernas\"><figcaption>Kamari harbour and its seafood tavernas<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Paradise_Beach.jpg/1280px-Paradise_Beach.jpg\" alt=\"Paradise Beach, about 2km away\"><figcaption>Paradise Beach, about 2km away<\/figcaption><\/figure><\/div><p class=\"agi\">The quiet, unspoilt south west tip of Kos on a sweeping sandy bay with clear, shallow water. The little Kastri chapel islet is a short swim offshore and Kamari's harbour tavernas are 20 to 30 minutes' walk along the beach. The most peaceful choice of the options.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Eat and drink<\/h4><ul><li>Eight restaurants at the resort, all included, with Michelin starred chef menus<\/li><li>Ikos Dine Out at <b>Mylotopi<\/b> and <b>Kochylari<\/b> in the local area, included<\/li><li><b>Jenny Camel<\/b> and <b>Captain John<\/b> for seafood in Kamari<\/li><\/ul><\/div><div class=\"agb safe\"><h4>How it feels for the two of you<\/h4><ul><li>Calm, sleepy and very safe feeling<\/li><li>Best if you are happy to spend most evenings enjoying the resort, with Dine Out or a taxi for a change<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 5 to 10 mins<\/span><div><b class=\"nbn\">Kefalos village<\/b><span class=\"nbd\">Hilltop village with a windmill and castle ruin<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 5 mins<\/span><div><b class=\"nbn\">Paradise Beach<\/b><span class=\"nbd\">Sunbeds, watersports and volcanic bubbles in the water<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 25 to 30 mins<\/span><div><b class=\"nbn\">Mastichari<\/b><span class=\"nbd\">Fishing harbour, long sandy beach and sunsets<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 45 to 50 mins<\/span><div><b class=\"nbn\">Kos Town<\/b><span class=\"nbd\">Harbour, castle, old town restaurants and shopping<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://commons.wikimedia.org/wiki/File:Kefalos_beach._Kastri_island_and_chapel_of_St._Nicholas._Kos,_Greece.jpg\" target=\"_blank\" rel=\"noopener\">Ввласенко<\/a> (CC BY-SA 4.0); <a href=\"https://commons.wikimedia.org/wiki/File:Kamari,_Kos,_Greece_(5654220668).jpg\" target=\"_blank\" rel=\"noopener\">Michal Osmenda<\/a> (CC BY-SA 2.0); <a href=\"https://commons.wikimedia.org/wiki/File:Paradise_Beach.jpg\" target=\"_blank\" rel=\"noopener\">Michal Osmenda<\/a> (CC BY-SA 2.0).<\/p><\/div><div class=\"ag\" id=\"ag-dassia\"><h3>Dassia, Corfu<\/h3><div class=\"agh\">Where Ikos Dassia is<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1723445734460-63b6c2d516e5?w=1280&q=78&auto=format&fit=crop\" alt=\"Corfu Old Town, about 20 minutes away\"><figcaption>Corfu Old Town, about 20 minutes away<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1632945167111-57cde0a03df2?w=1280&q=78&auto=format&fit=crop\" alt=\"The Old Fortress in Corfu Town\"><figcaption>The Old Fortress in Corfu Town<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1567927663055-efed28734f1f?w=1280&q=78&auto=format&fit=crop\" alt=\"The view from Angelokastro on the west coast\"><figcaption>The view from Angelokastro on the west coast<\/figcaption><\/figure><\/div><p class=\"agi\">Ikos Dassia is right on the beach on Corfu's green east coast, looking across the water to the mainland. It is only about 50m from the centre of Dassia, a relaxed resort with a main street of tavernas, cafés, bars and little shops, so you can walk out for dinner in a couple of minutes. Corfu Old Town is about 20 minutes away by taxi.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Eat and drink<\/h4><ul><li>Seven à la carte restaurants at the resort, all included, plus Ikos Dine Out at local partner restaurants<\/li><li>Dassia's tavernas and beach bars, a couple of minutes' walk<\/li><li>Corfu Old Town for dinner in the Liston arcades or the narrow Venetian lanes<\/li><\/ul><\/div><div class=\"agb safe\"><h4>How it feels for the two of you<\/h4><ul><li>Easy and relaxed, with everything in Dassia a short, flat walk<\/li><li>Ikos Dassia has a splash park and family suites, so there will be some families around<\/li><li>Taxis and the local bus make Corfu Town an easy evening out<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 10 mins<\/span><div><b class=\"nbn\">Gouvia Marina<\/b><span class=\"nbd\">Yachts, waterfront cafés and bars<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 20 mins<\/span><div><b class=\"nbn\">Corfu Old Town<\/b><span class=\"nbd\">UNESCO old town, the Liston, fortresses and shopping<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 35 mins<\/span><div><b class=\"nbn\">Achilleion Palace<\/b><span class=\"nbd\">Empress Sisi's summer palace and gardens<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 45 mins<\/span><div><b class=\"nbn\">Paleokastritsa<\/b><span class=\"nbd\">Turquoise coves, boat trips and Angelokastro castle<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://unsplash.com/photos/u8zZuObJ5Iw\" target=\"_blank\" rel=\"noopener\">Michel Struharova<\/a> (Unsplash); <a href=\"https://unsplash.com/photos/Q4E6pkCzKJk\" target=\"_blank\" rel=\"noopener\">Lazar Krstić<\/a> (Unsplash); <a href=\"https://unsplash.com/photos/_xlSNDkKYdw\" target=\"_blank\" rel=\"noopener\">Pascal Debrunner<\/a> (Unsplash).<\/p><\/div><div class=\"ag\" id=\"ag-oceania\"><h3>Nea Moudania, Halkidiki<\/h3><div class=\"agh\">Where Ikos Oceania is<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1568218631576-30faccc374ad?w=1280&q=78&auto=format&fit=crop\" alt=\"Sunbeds on the beach in Halkidiki\"><figcaption>Sunbeds on the beach in Halkidiki<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1687956737469-7d3216f588f2?w=1280&q=78&auto=format&fit=crop\" alt=\"Kavourotripes in Sithonia, a lovely day trip\"><figcaption>Kavourotripes in Sithonia, a lovely day trip<\/figcaption><\/figure><\/div><p class=\"agi\">Ikos Oceania sits on the coast of Halkidiki, just outside Nea Moudania at the start of the Kassandra peninsula. The beach is about 350m away across a small road, and the nearest shops, bars and restaurants are about 850m, with the centre of Nea Moudania, a real working Greek town with a seafront promenade and harbour, about 1km away. A 10 to 15 minute walk, or a quick taxi.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Eat and drink<\/h4><ul><li>Six restaurants at the resort, five of them à la carte, all included, plus Ikos Dine Out<\/li><li>Nea Moudania's seafront for fish tavernas and cafés where the locals eat<\/li><li>Afytos on Kassandra for dinner on its clifftop square, about 35 minutes away<\/li><\/ul><\/div><div class=\"agb safe\"><h4>How it feels for the two of you<\/h4><ul><li>Calm and very safe feeling, with a genuine local Greek town on the doorstep rather than a tourist strip<\/li><li>The resort has family suites, so there will be some families around<\/li><li>Best for enjoying the resort, with days out by taxi or hire car<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 15 mins<\/span><div><b class=\"nbn\">Potidea Canal<\/b><span class=\"nbd\">A pretty canal with a beach and fish tavernas<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 30 mins<\/span><div><b class=\"nbn\">Sani<\/b><span class=\"nbd\">Smart marina, beach clubs and the Sani Dunes<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 35 mins<\/span><div><b class=\"nbn\">Afytos<\/b><span class=\"nbd\">Stone village on a clifftop above the sea<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 1 hour<\/span><div><b class=\"nbn\">Thessaloniki<\/b><span class=\"nbd\">The waterfront, White Tower and great food<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://unsplash.com/photos/GeLHmnxJZyU\" target=\"_blank\" rel=\"noopener\">Reiseuhu<\/a> (Unsplash); <a href=\"https://unsplash.com/photos/-mUWT5FjDPI\" target=\"_blank\" rel=\"noopener\">Stefanos Keramaris<\/a> (Unsplash).<\/p><\/div>"
