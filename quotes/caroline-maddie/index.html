   "intro": "Where each hotel sits, how far it is to walk to restaurants and bars, and what each place feels like for the two of you after dark. Walking times are approximate.",
   "html": "<div class=\"trip\"><div class=\"box\"><h3>Colònia de Sant Jordi, Majorca</h3><p style=\"margin:0 0 10px\">Universal Grand León &amp; Spa. A real fishing village on Majorca's quieter south coast, with a pretty harbour, boats heading out to the Cabrera National Park and a seafront of restaurant terraces. Smaller, calmer and more authentic than Cala d'Or, with a Tuesday evening market through the summer.</p><ul><li><b>The hotel:</b> on the seafront in the village centre</li><li><b>Harbour and waterfront restaurants:</b> about 500m, roughly a 6 to 8 minute flat stroll along the seafront</li><li><b>Beaches:</b> a small beach 200m away, sandy Es Dolç 700m, and the famous Es Trenc a short taxi ride</li><li><b>Evenings:</b> relaxed and friendly, a lovely, safe walk for the two of you to dinner and back</li><li><b>Transfer:</b> around 1 hour 15 minutes, private</li></ul></div><div class=\"box\"><h3>Lambi and Kos Town, Kos</h3><p style=\"margin:0 0 10px\">Aqua Blu Boutique Hotel &amp; Spa. Lambi sits on the northern edge of Kos Town, with a long sandy beach and a relaxed strip of tavernas, cafés and bars. Kos Town has a lovely harbour, the old castle, the Hippocrates plane tree and lanes full of restaurants and cocktail bars.</p><ul><li><b>The beach:</b> 20m from the hotel</li><li><b>Lambi tavernas and bars:</b> about 500m, around a 6 minute walk</li><li><b>Kos Town harbour:</b> about 3km along a flat seafront path, 35 to 40 minutes on foot or a 10 minute taxi, and bikes are a popular way to get about</li><li><b>Evenings:</b> calm by the hotel and buzzy in town, a comfortable area for the two of you</li><li><b>Transfer:</b> around 45 minutes, private</li></ul></div><div class=\"box\"><h3>Tsilivi, Zante</h3><p style=\"margin:0 0 10px\">Contessina Suites &amp; Spa. A popular resort on Zante's east coast with a long Blue Flag beach, a small harbour and a good choice of tavernas and bars. Zante Town, with its grand square and harbour front, is a short taxi away.</p><ul><li><b>The beach:</b> 150m from the hotel</li><li><b>Tsilivi centre:</b> about 300m, around a 4 minute walk</li><li><b>Tavernas and bars:</b> plenty within about 700m, under 10 minutes on foot</li><li><b>Evenings:</b> the liveliest of the four, busy with couples and families, so you are never walking anywhere quiet</li><li><b>Transfer:</b> around 40 minutes, private</li></ul></div><div class=\"box\"><h3>Kefalos, Kos</h3><p style=\"margin:0 0 10px\">Ikos Aria. The peaceful south west corner of Kos, with long sandy beaches, the little chapel islet of Kastri and the hilltop village of Kefalos. The most tranquil of the four, best for evenings spent mostly at the resort.</p><ul><li><b>The beach:</b> right in front of the hotel</li><li><b>Nearest shops and tavernas:</b> about 1km, around 12 to 15 minutes on foot</li><li><b>Kefalos village:</b> 4.5km, a short taxi</li><li><b>Dine Out:</b> dinner at local partner tavernas 2km to 4km away is included, and you have an electric MINI for a day</li><li><b>Transfer:</b> around 20 minutes, private shuttle</li></ul></div></div>"
