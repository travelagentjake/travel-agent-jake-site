eon\">Colònia de Sant Jordi, Majorca</a><a href=\"#ag-aquablu\">Lambi and Kos Town, Kos</a><a href=\"#ag-contessina\">Tsilivi and Planos, Zante</a><a href=\"#ag-ikos\">Kefalos, Kos</a></div><div class=\"ag\" id=\"ag-leon\"><h3>Colònia de Sant Jordi, Majorca</h3><div class=\"agh\">Home to Universal Grand León &amp; Spa</div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Isla_de_Mallorca_-_Barcas_en_el_puerto_de_Colonia_Sant_Jordi_-_panoramio.jpg/1280px-Isla_de_Mallorca_-_Barcas_en_el_puerto_de_Colonia_Sant_Jordi_-_panoramio.jpg\" alt=\"Traditional fishing boats in the harbour\"><figcaption>Traditional fishing boats in the harbour</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Mallorca-Sant_Jordi-Promenade-01.jpg/1280px-Mallorca-Sant_Jordi-Promenade-01.jpg\" alt=\"The palm lined seafront promenade\"><figcaption>The palm lined seafront promenade</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Colonia_de_Sant_Jordi_-_panoramio.jpg/1280px-Colonia_de_Sant_Jordi_-_panoramio.jpg\" alt=\"Boats moored in the harbour by the restaurants\"><figcaption>Boats moored in the harbour by the restaurants</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Ses_Salines%2C_Balearic_Islands%2C_Spain_-_panoramio_%2818%29.jpg/1280px-Ses_Salines%2C_Balearic_Islands%2C_Spain_-_panoramio_%2818%29.jpg\" alt=\"Sunset on the beaches near the village\"><figcaption>Sunset on the beaches near the village</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Colonia_de_Sant_Jordi.jpg/1280px-Colonia_de_Sant_Jordi.jpg\" alt=\"The village from above, with the salt pans behind\"><figcaption>The village from above, with the salt pans behind</figcaption></figure></div><p class=\"agswipe\">Swipe for more photos of the area</p><p class=\"agi\">A genuine Mallorcan fishing village on the quiet south coast, where little wooden boats bob in the harbour and evenings are all about a long dinner by the water. It is relaxed and grown up rather than a party resort, smaller and calmer than Cala d'Or, with busy terraces along the promenade on summer nights and boats heading out to the Cabrera National Park by day.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Eating out</h4><ul><li><b>Sal de Cocó</b>, seafood and Mediterranean dishes on a pergola terrace right on the harbour wall, from chef Marta Rosselló. My pick for a special dinner (closed Tuesdays)</li><li><b>Port Blau</b>, harbourside seafood since 1965, famous for its lobster stew and sea bass baked in salt</li><li><b>Cassai Beach House</b>, a converted fisherman's house looking out towards Cabrera, with lobster paella and a barefoot luxury feel</li><li><b>Salicornia</b>, modern Mallorcan cooking on the seafront opposite the old fishing port</li><li><b>Vermutería del Mar</b>, relaxed tapas and rice dishes on the harbour (closed Tuesdays)</li><li><b>Es Carbó Bistro</b>, a little gem tucked in the village streets with excellent reviews, best to book</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li><b>Cassai Sunset Club</b>, cocktails on a sunset terrace from 6pm</li><li><b>Bodeguita El Cubano</b>, a piano bar with mojitos and live Latin music on Thursday and Saturday nights</li><li><b>5illes Eat &amp; Drink</b>, tapas and cocktails on the main street</li><li>A tapas route around the village bars on Thursday evenings</li><li>Ice cream from <b>Colonial</b> and pastries from <b>Panadería Pons</b> for a stroll along the front</li></ul></div><div class=\"agb\"><h4>Shops and markets</h4><ul><li>A weekly evening market on Avinguda Primavera from May to October</li><li>Small shops and boutiques along the promenade between Platja des Port and the marina</li><li>Flor de Sal d'Es Trenc sea salt from the salt works just outside the village, a lovely gift to bring home</li><li>Bigger weekly markets nearby in Ses Salines (Thursday) and Santanyí (Saturday)</li></ul></div><div class=\"agb\"><h4>Things to see and do</h4><ul><li>Boat trips from the harbour to the Cabrera National Park and its Blue Cave, including a 3 hour sunset cruise</li><li>Es Trenc, one of Majorca's most beautiful natural beaches, a short taxi ride away</li><li>The coastal path linking the harbour, Platja des Port and sandy Es Dolç</li><li>A guided visit and salt tasting at the Salines d'Es Trenc</li><li>Cala Llombards, a picture perfect cove about 20 minutes' drive away</li></ul></div><div class=\"agb\"><h4>Distances from the hotel</h4><ul><li>On the seafront promenade in the centre of the village</li><li>Bassa des Cabots, a small rocky bathing spot: 3 minutes</li><li>Platja des Port, the harbour and the waterfront restaurants: about 1.1km, a flat 12 to 15 minute walk along the seafront</li><li>Es Dolç beach: 10 to 20 minutes on the coastal path from the marina</li><li>Palma airport: around 40 to 45 minutes by private transfer</li><li>Worth knowing: there is no sandy beach right outside, guests swim off the rocks or stroll to the beaches. Taxi apps do not work here, so ask reception to book one</li></ul></div><div class=\"agb safe\"><h4>How it feels for the two of you</h4><ul><li>A quiet, friendly village where the evening walk is along the seafront promenade, with couples and families out for dinner</li><li>One of the calmest options of the four for walking back together after dinner</li></ul></div></div><p class=\"agcred\">Photos from Wikimedia Commons: <a href=\"https://commons.wikimedia.org/wiki/File:Isla_de_Mallorca_-_Barcas_en_el_puerto_de_Colonia_Sant_Jordi_-_panoramio.jpg\" target=\"_blank\" rel=\"noopener\">LANOEL</a> (CC BY-SA 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Mallorca-Sant_Jordi-Promenade-01.jpg\" target=\"_blank\" rel=\"noopener\">Asurnipal</a> (CC BY-SA 4.0); <a href=\"https://commons.wikimedia.org/wiki/File:Colonia_de_Sant_Jordi_-_panoramio.jpg\" target=\"_blank\" rel=\"noopener\">Anka D.</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Ses_Salines,_Balearic_Islands,_Spain_-_panoramio_(18).jpg\" target=\"_blank\" rel=\"noopener\">mateu mulet</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Colonia_de_Sant_Jordi.jpg\" target=\"_blank\" rel=\"noopener\">Andrés Nieto Porras</a> (CC BY-SA 2.0).</p></div><div class=\"ag\" id=\"ag-aquablu\"><h3>Lambi and Kos Town, Kos</h3><div class=\"agh\">Home to Aqua Blu Boutique Hotel &amp; Spa</div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Fishing_boats_in_the_port_of_Kos._Greece.jpg/1280px-Fishing_boats_in_the_port_of_Kos._Greece.jpg\" alt=\"Fishing boats in Kos Town harbour\"><figcaption>Fishing boats in Kos Town harbour</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Holidays_Greece_-_panoramio_%28360%29.jpg/1280px-Holidays_Greece_-_panoramio_%28360%29.jpg\" alt=\"Restaurant lined lanes in Kos Town\"><figcaption>Restaurant lined lanes in Kos Town</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0c/Greece_kos_city.jpg/1280px-Greece_kos_city.jpg\" alt=\"Kos Town and its harbour from above\"><figcaption>Kos Town and its harbour from above</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/Boulevard_Kos.jpg/1280px-Boulevard_Kos.jpg\" alt=\"The seafront boulevard\"><figcaption>The seafront boulevard</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Kos_citt%C3%A0%2C_marina.JPG/1280px-Kos_citt%C3%A0%2C_marina.JPG\" alt=\"The palm lined marina promenade\"><figcaption>The palm lined marina promenade</figcaption></figure></div><p class=\"agswipe\">Swipe for more photos of the area</p><p class=\"agi\">Lambi is the relaxed beach suburb on the northern edge of Kos Town, a long sandy beach backed by a handful of tavernas and beach bars. The real draw is Kos Town itself, with a harbour full of boats, the castle of the Knights, palm lined promenades, ancient ruins right in the middle of town and an old town of lanes packed with restaurants, courtyards and cocktail gardens.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Eating out in Lambi</h4><ul><li><b>Istros</b>, modern Greek cooking with live music some nights, about 900m along the road into town</li><li><b>Taverna Mike</b>, fresh Greek dishes and seafood with generous portions</li><li><b>Old River</b>, on the beachfront road at the southern end of Lambi</li><li>At the hotel: <b>Cuvée</b> restaurant and the <b>Sips + Bites</b> bar</li></ul></div><div class=\"agb\"><h4>Eating out in Kos Town</h4><ul><li><b>Petrino</b>, modern Greek food in a beautiful stone courtyard with a great wine list</li><li><b>Lofaki</b>, panoramic views over the town and sea, perfect for a celebration dinner</li><li><b>Agkyra</b>, waterfront seafood looking over the marina</li><li><b>Elia</b>, traditional cooking in an 1890 house in the old town</li><li><b>H2O</b>, stylish dining right on the water at the Kos Aktis</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li><b>Mylos Beach Bar</b>, in Lambi, a boho lounge beside an old windmill with DJs some nights</li><li><b>Omega Sky Bar</b>, rooftop sundowners in Kos Town</li><li><b>Sitar</b>, cocktails overlooking the harbour</li><li><b>Kaseta</b>, a cocktail garden draped in bougainvillea</li><li><b>Hamam Club</b>, a stylish bar in the old Turkish baths</li><li>Bar Street is the young, lively part of town and easy to avoid</li></ul></div><div class=\"agb\"><h4>Shops and sights</h4><ul><li>The 1930s Municipal Market on Eleftherias Square for honey, herbs, olive oil and local crafts</li><li>Old town lanes of shops and boutiques</li><li>The Hippocrates Plane Tree and the Castle of the Knights by the harbour</li><li>The Ancient Agora next to the harbour, Casa Romana and the Asklepion</li><li>A ferry day trip to Bodrum in Turkey, or a boat trip to the islands of Kalymnos, Pserimos and Plati</li></ul></div><div class=\"agb\"><h4>Distances from the hotel</h4><ul><li>The beach: 100m</li><li>The first tavernas and bars in Lambi: about 500m</li><li>Kos Town centre: about 3km, and the harbour about 4km, along a flat seafront path. That is 45 to 50 minutes on foot, under 10 minutes by bike or a short taxi</li><li>City buses stop 100m from the hotel, and taxis wait on the harbour front for the ride back</li><li>Kos airport: around 30 minutes by private transfer</li></ul></div><div class=\"agb safe\"><h4>How it feels for the two of you</h4><ul><li>Kos Town is busy and friendly in the evenings, and in one recent visitor survey 93 in 100 people said they felt fully safe after dark</li><li>Stay on the busy harbour front and old town, and take a taxi back to the hotel after dinner rather than walking the path late</li></ul></div></div><p class=\"agcred\">Photos from Wikimedia Commons: <a href=\"https://commons.wikimedia.org/wiki/File:Fishing_boats_in_the_port_of_Kos._Greece.jpg\" target=\"_blank\" rel=\"noopener\">Ввласенко</a> (CC BY-SA 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Holidays_Greece_-_panoramio_(360).jpg\" target=\"_blank\" rel=\"noopener\">Roton Piotr</a> (CC BY-SA 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Greece_kos_city.jpg\" target=\"_blank\" rel=\"noopener\">Arne Müseler</a> (CC BY-SA 3.0 de); <a href=\"https://commons.wikimedia.org/wiki/File:Boulevard_Kos.jpg\" target=\"_blank\" rel=\"noopener\">Rob Koster</a> (CC BY-SA 4.0); <a href=\"https://commons.wikimedia.org/wiki/File:Kos_citt%C3%A0,_marina.JPG\" target=\"_blank\" rel=\"noopener\">sailko</a> (CC BY-SA 3.0).</p></div><div class=\"ag\" id=\"ag-contessina\"><h3>Tsilivi and Planos, Zante</h3><div class=\"agh\">Home to Contessina Suites &amp; Spa</div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Bay_-_panoramio_%281%29.jpg/1280px-Bay_-_panoramio_%281%29.jpg\" alt=\"Evening in the little harbour at Planos, Tsilivi\"><figcaption>Evening in the little harbour at Planos, Tsilivi</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Planos_291_00%2C_Greece_-_panoramio_%2810%29.jpg/1280px-Planos_291_00%2C_Greece_-_panoramio_%2810%29.jpg\" alt=\"A busy taverna terrace in Planos\"><figcaption>A busy taverna terrace in Planos</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Beach_-_panoramio_%2861%29.jpg/1280px-Beach_-_panoramio_%2861%29.jpg\" alt=\"The sandy bay at Tsilivi\"><figcaption>The sandy bay at Tsilivi</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Zakynthos_May_2009_Tsilivi_-_panoramio.jpg/1280px-Zakynthos_May_2009_Tsilivi_-_panoramio.jpg\" alt=\"Looking over Tsilivi bay\"><figcaption>Looking over Tsilivi bay</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Byzantine_Museum_%E2%80%93_Zakynthos_%E2%80%93_Greek_%E2%80%93_01.jpg/1280px-Byzantine_Museum_%E2%80%93_Zakynthos_%E2%80%93_Greek_%E2%80%93_01.jpg\" alt=\"Solomos Square in Zante Town, a short taxi away\"><figcaption>Solomos Square in Zante Town, a short taxi away</figcaption></figure></div><p class=\"agswipe\">Swipe for more photos of the area</p><p class=\"agi\">Tsilivi and neighbouring Planos sit on a wide sandy bay on Zante's north east coast, looking across the sea to Kefalonia. It is a lively but friendly resort full of family run tavernas, with a quieter, more grown up side away from the main strip, and it winds down at a sensible hour. Zante's party town, Laganas, is on the other side of the island.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Eating out</h4><ul><li><b>The Olive Tree</b>, family run since 1984, with tables under an old olive tree and its own olive oil</li><li><b>Calypso</b>, a garden terrace and some of the best reviews in Tsilivi</li><li><b>Trenta Nove</b>, lawns and shaded terraces, romantic and calm</li><li><b>The Halfway House</b>, Greek food and a wine bar, hugely popular</li><li><b>Taverna by the Sea Paradeisos</b>, right on the beach with views across to Kefalonia</li><li><b>The Balcony</b>, upmarket, with sunset views over the bay (about 10 minutes uphill)</li><li>In Zante Town: <b>Prosilio</b>, an award winning courtyard restaurant off Solomos Square, and <b>Lofos</b> on Bochali hill for sunset over the harbour</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li><b>Piscina Pool Bar</b>, lounge music in an olive grove</li><li><b>Drunk Moon</b>, mellow, with Motown and soul</li><li><b>Saratseno</b>, a family run café bar with sea views, open since 1997</li><li>Beach bars <b>Freddie's</b> and <b>Boomerang</b> for a sundowner</li><li>At the hotel: <b>Lentika</b>, <b>Nobile</b> fine dining in the roof garden and the <b>NovantaTre</b> wine cellar</li><li>Livelier strip bars with karaoke are there if you want them, and easy to avoid</li></ul></div><div class=\"agb\"><h4>Shops</h4><ul><li>Gift and beach shops along the Tsilivi strip</li><li>Zante Town's long pedestrian Roma Street for shops, local crafts and Miretta artisan gelato</li><li>Local treats to bring home: mandolato almond and honey nougat, jasmine perfume and local wines</li></ul></div><div class=\"agb\"><h4>Things to see and do</h4><ul><li>Navagio Shipwreck Bay, seen from the water on a boat trip or from the clifftop viewpoint about 25 minutes' drive away</li><li>Boat trips to the Blue Caves on the north coast</li><li>Turtle spotting around Marathonisi island in Laganas Bay</li><li>Sunset at the Keri lighthouse viewpoint</li><li>Bochali hill above Zante Town, for views over the whole harbour</li></ul></div><div class=\"agb\"><h4>Distances from the hotel</h4><ul><li>The beach: about 100 to 250m</li><li>Bars and restaurants: under 5 minutes' walk</li><li>Tsilivi centre: about 300m</li><li>Zante Town: about 10 to 15 minutes by taxi, roughly £12 to £15</li><li>Buses are infrequent, so taxis are the easiest way to explore</li><li>Zante airport: around 15 to 20 minutes by private transfer</li></ul></div><div class=\"agb safe\"><h4>How it feels for the two of you</h4><ul><li>Busy in the evenings with couples and families, so you are never walking anywhere quiet</li><li>Livelier than Colònia de Sant Jordi, with a much gentler feel than Laganas</li></ul></div></div><p class=\"agcred\">Photos from Wikimedia Commons: <a href=\"https://commons.wikimedia.org/wiki/File:Bay_-_panoramio_(1).jpg\" target=\"_blank\" rel=\"noopener\">Alexey Seleznev</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Planos_291_00,_Greece_-_panoramio_(10).jpg\" target=\"_blank\" rel=\"noopener\">Andris Malygin</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Beach_-_panoramio_(61).jpg\" target=\"_blank\" rel=\"noopener\">Alexey Seleznev</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Zakynthos_May_2009_Tsilivi_-_panoramio.jpg\" target=\"_blank\" rel=\"noopener\">maczopikczu</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Byzantine_Museum_%E2%80%93_Zakynthos_%E2%80%93_Greek_%E2%80%93_01.jpg\" target=\"_blank\" rel=\"noopener\">Maesi64</a> (CC0).</p></div><div class=\"ag\" id=\"ag-ikos\"><h3>Kefalos, Kos</h3><div class=\"agh\">Home to Ikos Aria</div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Kefalos_beach._Kastri_island_and_chapel_of_St._Nicholas._Kos%2C_Greece.jpg/1280px-Kefalos_beach._Kastri_island_and_chapel_of_St._Nicholas._Kos%2C_Greece.jpg\" alt=\"Kastri islet and its chapel, just off the beach\"><figcaption>Kastri islet and its chapel, just off the beach</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Kamari%2C_Kos%2C_Greece_%285654220668%29.jpg/1280px-Kamari%2C_Kos%2C_Greece_%285654220668%29.jpg\" alt=\"Kamari, the little harbour with the seafood tavernas\"><figcaption>Kamari, the little harbour with the seafood tavernas</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Kefalos_K%C3%B3s_9.jpg/1280px-Kefalos_K%C3%B3s_9.jpg\" alt=\"The old windmill in Kefalos village\"><figcaption>The old windmill in Kefalos village</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Kos_isthmos01.JPG/1280px-Kos_isthmos01.JPG\" alt=\"Kefalos Bay from the hills\"><figcaption>Kefalos Bay from the hills</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/Church_of_the_Transfiguration_in_Kefalos._View_from_the_west._Kos%2C_Greece.jpg/1280px-Church_of_the_Transfiguration_in_Kefalos._View_from_the_west._Kos%2C_Greece.jpg\" alt=\"A blue domed church in Kefalos village\"><figcaption>A blue domed church in Kefalos village</figcaption></figure></div><p class=\"agswipe\">Swipe for more photos of the area</p><p class=\"agi\">Kefalos is the quiet, unspoilt south west tip of Kos: long sandy beaches, the little chapel islet of Kastri just offshore, a hilltop village with an old windmill and the small fishing harbour of Kamari with its seafood tavernas. It is the most peaceful choice of the four, best if you are happy to spend most evenings enjoying the resort itself, with Dine Out for a taste of the village.</p><div class=\"aggrid\"><div class=\"agb\"><h4>Eating out at the resort</h4><ul><li>Eight restaurants, all included: <b>Fresco</b> by Michelin starred chef Ettore Botrini, <b>Oliva</b> by Andoni Luis Aduriz, <b>Provence</b> by Pascal Barbot, <b>Ouzo</b> looking out to Kastri, <b>Kos</b> for island dishes and <b>Anaya</b> for Asian flavours</li><li>Dinner is by reservation with a smart casual dress code</li></ul></div><div class=\"agb\"><h4>Eating out locally</h4><ul><li>Dine Out, included: <b>Mylotopi</b> in the windmill settlement at the top of Kefalos (about 4km) and <b>Kochylari</b> for traditional Kos cooking (about 2km)</li><li><b>Jenny Camel</b>, seafood in converted stone houses overlooking Kamari Bay</li><li><b>Taverna Cavos</b>, grilled fish on the promenade with bay views</li><li><b>Captain John</b>, seafood with tables on the sand in Kamari</li><li><b>Agios Theologos</b>, on the wild west coast about 5km away, with wonderful terrace views</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li>Nine bars at the resort, including the Lagoon Lobby Bar with Aegean sunset views</li><li><b>Sebastians</b>, on the harbour front and <b>Acropol Bar</b> by the sea in Kamari</li><li>Evenings in the area are low key and relaxed. Kardamena, the lively resort, is about 25 minutes away</li></ul></div><div class=\"agb\"><h4>Things to see and do</h4><ul><li>Swim or take a pedalo out to Kastri islet and its chapel</li><li>The early Christian basilicas of Agios Stefanos on the beach</li><li>Sunset in the mountain village of Zia</li><li>A day trip to the Nisyros volcano from Kardamena</li><li>A free day out in an electric MINI (drivers aged 25 to 75, so Caroline would drive)</li></ul></div><div class=\"agb\"><h4>Distances from the resort</h4><ul><li>The beach: right in front</li><li>Kamari's tavernas, cafés and gift shops: 20 to 30 minutes on foot along the road or the beach, or a short taxi</li><li>Kefalos village: about 4.5km</li><li>Kos Town: about 45 minutes by car</li><li>Kos airport: around 20 minutes by private shuttle</li></ul></div><div class=\"agb safe\"><h4>How it feels for the two of you</h4><ul><li>Calm, sleepy and very safe feeling, with nothing rowdy nearby</li><li>In the evenings it is best to use Dine Out or a taxi rather than walk along the road</li></ul></div></div><p class=\"agcred\">Photos from Wikimedia Commons: <a href=\"https://commons.wikimedia.org/wiki/File:Kefalos_beach._Kastri_island_and_chapel_of_St._Nicholas._Kos,_Greece.jpg\" target=\"_blank\" rel=\"noopener\">Ввласенко</a> (CC BY-SA 4.0); <a href=\"https://commons.wikimedia.org/wiki/File:Kamari,_Kos,_Greece_(5654220668).jpg\" target=\"_blank\" rel=\"noopener\">Michal Osmenda</a> (CC BY-SA 2.0); <a href=\"https://commons.wikimedia.org/wiki/File:Kefalos_K%C3%B3s_9.jpg\" target=\"_blank\" rel=\"noopener\">Karelj</a> (Public domain); <a href=\"https://commons.wikimedia.org/wiki/File:Kos_isthmos01.JPG\" target=\"_blank\" rel=\"noopener\">Tedmek</a> (CC BY-SA 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Church_of_the_Transfiguration_in_Kefalos._View_from_the_west._Kos,_Greece.jpg\" target=\"_blank\" rel=\"noopener\">Ввласенко</a> (CC BY-SA 3.0).</p></div>"
