ax(0,1fr));gap:10px}\n.nbr{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line,#DCE3FF);border-radius:16px;padding:12px 14px;background:#fff}\n.nbr .nbt{flex:0 0 auto;background:#FFD21F;color:var(--blue,#004AAD);font-weight:800;font-size:12.5px;border-radius:999px;padding:4px 10px;white-space:nowrap}\n.nbr b.nbn{display:block;color:var(--blue,#004AAD);font-weight:800;font-size:15.5px}\n.nbr span.nbd{display:block;font-size:14px;margin-top:2px}\n.nbr span.nbd b{color:var(--ink,#10142B)}\n.agcred{font-size:11.5px;color:var(--muted,#55607A);margin:14px 0 0}\n.agcred a{color:inherit}\n.agswipe{font-size:13px;color:var(--muted,#55607A);margin:-8px 0 14px}\n@media(max-width:900px){.aggrid,.nbl{grid-template-columns:1fr}.agstrip figure{flex-basis:82%}.agstrip.sm figure{flex-basis:70%}.agstrip img{height:210px}.ag{padding:16px}.ag h3{font-size:21px}.nbr{flex-direction:column;gap:6px}}\n<\/style><div class=\"agjump\"><a href=\"#ag-olivar\">Messonghi, Corfu<\/a><a href=\"#ag-marbella\">Puerto Banus and Marbella<\/a><\/div><div class=\"ag\" id=\"ag-olivar\"><h3>Messonghi, Corfu<\/h3><div class=\"agh\">Where The Olivar Suites is<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1723445734460-63b6c2d516e5?w=1280&q=78&auto=format&fit=crop\" alt=\"Corfu Old Town and the New Fortress\"><figcaption>Corfu Old Town, about 40 minutes away<\/figcaption><\/figure><\/div><p class=\"agi\">A small, quiet beach village on Corfu's south east coast, where the Messonghi river meets the sea. The hotel is right on the beach and the village is flat, so the tavernas are a two or three minute stroll, with no hills or busy roads to worry about.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Eat and drink<\/h4><ul><li><b>Taverna Minore<\/b>, <b>Bo The Butcher<\/b> and <b>Korali<\/b>, two or three minutes' walk<\/li><li>Fish tavernas along the river and the beach<\/li><li>The hotel's own Flya restaurant and Olibar for a quiet evening in<\/li><\/ul><\/div><div class=\"agb safe\"><h4>What it is like<\/h4><ul><li>Relaxed and friendly, the quieter of the neighbouring villages<\/li><li>Lovely for a gentle evening stroll, but more traditional village than glamorous harbour<\/li><li>Moraitika next door has more bars and shops, a short walk or taxi<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 10 mins<\/span><div><b class=\"nbn\">Moraitika<\/b><span class=\"nbd\">Bigger village with more bars, shops and tavernas<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 15 mins<\/span><div><b class=\"nbn\">Korission Lagoon<\/b><span class=\"nbd\">Dunes and quiet beaches on the west coast<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 40 mins<\/span><div><b class=\"nbn\">Corfu Town<\/b><span class=\"nbd\">The Old Town, Liston arcades and fortresses<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 45 mins<\/span><div><b class=\"nbn\">Achilleion Palace<\/b><span class=\"nbd\">Empress Sisi's palace and gardens above the sea<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://unsplash.com\" target=\"_blank\" rel=\"noopener\">Unsplash<\/a>.<\/p><\/div><div class=\"ag\" id=\"ag-marbella\"><h3>Puerto Banus and the Golden Mile, Marbella<\/h3><div class=\"agh\">Where the three Marbella hotels are<\/div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1657469291895-754b9c4328fd?w=1280&q=78&auto=format&fit=crop\" alt=\"A superyacht in Puerto Banus marina\"><figcaption>Puerto Banus marina<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1780658309233-465e54f70a72?w=1280&q=78&auto=format&fit=crop\" alt=\"A plaza in Marbella Old Town\"><figcaption>Marbella Old Town<\/figcaption><\/figure><\/div><p class=\"agi\">Marbella's most glamorous stretch of coast, joined by a flat seafront promenade that runs for miles along the beach. Gran Hotel Guadalpin Banus is on the promenade at Puerto Banus, about 15 to 20 minutes' walk from the marina. Puente Romano and Nobu sit together on the Golden Mile, about 3km east, with their own village of restaurants on site and Puerto Banus a short taxi ride or a long seafront walk away.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>Eat and drink<\/h4><ul><li>Puerto Banus marina for waterfront restaurants, cocktail bars and people watching<\/li><li>The Puente Romano village for Nobu and a dozen other restaurants in one place<\/li><li>Beach clubs along the promenade for long lunches by the sea<\/li><\/ul><\/div><div class=\"agb safe\"><h4>What it is like<\/h4><ul><li>Smart and upmarket, with the pretty harbour and evening buzz you described<\/li><li>The seafront promenade is flat, well lit and busy in the evenings<\/li><li>Taxis are plentiful and easy to hail or book through the hotel, so no need to pre-book every evening<\/li><\/ul><\/div><\/div><div class=\"agnb\"><h4>Nearby, for a day out<\/h4><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 10 mins<\/span><div><b class=\"nbn\">Marbella Old Town<\/b><span class=\"nbd\">Orange Square, whitewashed lanes and tapas bars<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 15 mins<\/span><div><b class=\"nbn\">Nueva Andalucia<\/b><span class=\"nbd\">Restaurants and the La Campana market<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 30 mins<\/span><div><b class=\"nbn\">Estepona<\/b><span class=\"nbd\">Flower filled old town and a long promenade<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">about 1 hour<\/span><div><b class=\"nbn\">Ronda<\/b><span class=\"nbd\">The famous gorge, bridge and old town in the mountains<\/span><\/div><\/div><\/div><\/div><p class=\"agcred\">Photos: <a href=\"https://unsplash.com/photos/Ew2NANUmKP4\" target=\"_blank\" rel=\"noopener\">Viktor Ritsvall<\/a> (Unsplash); <a href=\"https://unsplash.com/photos/Ch8BdNFpo8I\" target=\"_blank\" rel=\"noopener\">Milan Trninic<\/a> (Unsplash).<\/p><\/div>"
  }
