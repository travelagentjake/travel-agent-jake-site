ax(0,1fr));gap:10px}\n.nbr{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line,#DCE3FF);border-radius:16px;padding:12px 14px;background:#fff}\n.nbr .nbt{flex:0 0 auto;background:#FFD21F;color:var(--blue,#004AAD);font-weight:800;font-size:12.5px;border-radius:999px;padding:4px 10px;white-space:nowrap}\n.nbr b.nbn{display:block;color:var(--blue,#004AAD);font-weight:800;font-size:15.5px}\n.nbr span.nbd{display:block;font-size:14px;margin-top:2px}\n.nbr span.nbd b{color:var(--ink,#10142B)}\n.agcred{font-size:11.5px;color:var(--muted,#55607A);margin:14px 0 0}\n.agcred a{color:inherit}\n.agswipe{font-size:13px;color:var(--muted,#55607A);margin:-8px 0 14px}\n@media(max-width:900px){.aggrid,.nbl{grid-template-columns:1fr}.agstrip figure{flex-basis:82%}.agstrip.sm figure{flex-basis:70%}.agstrip img{height:210px}.ag{padding:16px}.ag h3{font-size:21px}.nbr{flex-direction:column;gap:6px}}\n</style><div class=\"agjump\"><a href=\"#ag-leon\">Colònia de Sant Jordi, Majorca</a><a href=\"#ag-aquablu\">Lambi, Kos</a><a href=\"#ag-contessina\">Tsilivi and Planos, Zante</a><a href=\"#ag-ikos\">Agios Stefanos and Kefalos Bay, Kos</a></div><div class=\"ag\" id=\"ag-leon\"><h3>Colònia de Sant Jordi, Majorca</h3><div class=\"agh\">Where Universal Grand León &amp; Spa is</div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Isla_de_Mallorca_-_Barcas_en_el_puerto_de_Colonia_Sant_Jordi_-_panoramio.jpg/1280px-Isla_de_Mallorca_-_Barcas_en_el_puerto_de_Colonia_Sant_Jordi_-_panoramio.jpg\" alt=\"Traditional fishing boats in the harbour\"><figcaption>Traditional fishing boats in the harbour</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Mallorca-Sant_Jordi-Promenade-01.jpg/1280px-Mallorca-Sant_Jordi-Promenade-01.jpg\" alt=\"The palm lined seafront promenade\"><figcaption>The palm lined seafront promenade</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Colonia_de_Sant_Jordi_-_panoramio.jpg/1280px-Colonia_de_Sant_Jordi_-_panoramio.jpg\" alt=\"Boats moored by the harbour restaurants\"><figcaption>Boats moored by the harbour restaurants</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Ses_Salines%2C_Balearic_Islands%2C_Spain_-_panoramio_%2818%29.jpg/1280px-Ses_Salines%2C_Balearic_Islands%2C_Spain_-_panoramio_%2818%29.jpg\" alt=\"Sunset on the beaches by the village\"><figcaption>Sunset on the beaches by the village</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Colonia_de_Sant_Jordi.jpg/1280px-Colonia_de_Sant_Jordi.jpg\" alt=\"The village from above, with the salt pans behind\"><figcaption>The village from above, with the salt pans behind</figcaption></figure></div><p class=\"agswipe\">Swipe for more photos</p><p class=\"agi\">The hotel sits right on the seafront promenade in Colònia de Sant Jordi, a genuine Mallorcan fishing village on the quiet south coast. Little wooden boats bob in the harbour, boats head out to the Cabrera National Park by day, and evenings are all about a stroll along the front and a long dinner by the water. It is relaxed and grown up rather than a party resort, smaller and calmer than Cala d'Or, with busy terraces on summer nights.</p><div class=\"aggrid\"><div class=\"agb\"><h4>On your doorstep</h4><ul><li>The palm lined seafront promenade runs from the hotel to the harbour, about a flat 12 to 15 minute stroll</li><li>Bassa des Cabots, a small rocky bathing spot 3 minutes away, with Platja des Port and sandy Es Dolç a short walk along the coast</li><li>The old fishing harbour, with boats to the Cabrera National Park and its Blue Cave, including a 3 hour sunset cruise</li><li>A weekly evening market on Avinguda Primavera from May to October, and small shops along the promenade</li><li>Ice cream from <b>Colonial</b> and pastries from <b>Panadería Pons</b></li><li>Worth knowing: there is no sandy beach right outside, guests swim off the rocks or stroll to the beaches</li></ul></div><div class=\"agb\"><h4>Eating out in the village</h4><ul><li><b>Sal de Cocó</b>, seafood and Mediterranean dishes on a pergola terrace on the harbour wall, from chef Marta Rosselló. My pick for a special dinner (closed Tuesdays)</li><li><b>Port Blau</b>, harbourside seafood since 1965, famous for lobster stew and sea bass baked in salt</li><li><b>Cassai Beach House</b>, a converted fisherman's house looking out to Cabrera, with lobster paella</li><li><b>Salicornia</b>, modern Mallorcan cooking opposite the old fishing port</li><li><b>Vermutería del Mar</b>, relaxed tapas and rice dishes on the harbour (closed Tuesdays)</li><li><b>Es Carbó Bistro</b>, a little gem in the village streets, best to book</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li><b>Cassai Sunset Club</b>, cocktails on a sunset terrace from 6pm</li><li><b>Bodeguita El Cubano</b>, a piano bar with mojitos and live Latin music on Thursday and Saturday nights</li><li><b>5illes Eat &amp; Drink</b>, tapas and cocktails on the main street</li><li>A tapas route around the village bars on Thursday evenings</li></ul></div><div class=\"agb safe\"><h4>How it feels for the two of you</h4><ul><li>A quiet, friendly village where the evening walk is along the seafront promenade, with couples and families out for dinner</li><li>One of the calmest options of the four for walking back together after dinner</li><li>Taxi apps do not work here, so reception will book one for trips out</li></ul></div></div><div class=\"agnb\"><h4>Nearby towns and how close they are</h4><p class=\"agnbi\">Drive times from Colònia de Sant Jordi are approximate.</p><div class=\"agstrip sm\"><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1656508443831-5881fd24d221?w=1280&q=78&auto=format&fit=crop\" alt=\"Es Trenc beach, just along the coast\"><figcaption>Es Trenc beach, just along the coast</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Mallorca-Santany%C3%AD_%28city%29-Pla%C3%A7a_Major-market-02.jpg/1280px-Mallorca-Santany%C3%AD_%28city%29-Pla%C3%A7a_Major-market-02.jpg\" alt=\"Market day in Santanyí, 17 minutes away\"><figcaption>Market day in Santanyí, 17 minutes away</figcaption></figure></div><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">short taxi</span><div><b class=\"nbn\">Es Trenc beach</b><span class=\"nbd\">One of Majorca's most beautiful natural beaches, a long sweep of pale sand and clear water</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 7 mins</span><div><b class=\"nbn\">Ses Salines</b><span class=\"nbd\">Small village by the salt pans, with a weekly market on Thursdays and the Flor de Sal d'Es Trenc salt works nearby</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 15 mins</span><div><b class=\"nbn\">Campos</b><span class=\"nbd\">Traditional market town with a Thursday morning market in the main square</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 17 mins</span><div><b class=\"nbn\">Santanyí</b><span class=\"nbd\">Honey coloured stone town with galleries, boutiques and a big market on Wednesdays and Saturdays</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 20 mins</span><div><b class=\"nbn\">Cala Figuera</b><span class=\"nbd\">A picture perfect working fishing harbour lined with old boathouses</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 20 mins</span><div><b class=\"nbn\">Cala Llombards</b><span class=\"nbd\">A pretty turquoise cove backed by pine trees</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 30 mins</span><div><b class=\"nbn\">Cala d'Or</b><span class=\"nbd\">Smart marina resort with shops, cafés and sheltered coves</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 45 mins</span><div><b class=\"nbn\">Palma</b><span class=\"nbd\">The cathedral, old town shopping and harbour, for a day out in the city</span></div></div></div></div><p class=\"agcred\">Photos: <a href=\"https://commons.wikimedia.org/wiki/File:Isla_de_Mallorca_-_Barcas_en_el_puerto_de_Colonia_Sant_Jordi_-_panoramio.jpg\" target=\"_blank\" rel=\"noopener\">LANOEL</a> (CC BY-SA 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Mallorca-Sant_Jordi-Promenade-01.jpg\" target=\"_blank\" rel=\"noopener\">Asurnipal</a> (CC BY-SA 4.0); <a href=\"https://commons.wikimedia.org/wiki/File:Colonia_de_Sant_Jordi_-_panoramio.jpg\" target=\"_blank\" rel=\"noopener\">Anka D.</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Ses_Salines,_Balearic_Islands,_Spain_-_panoramio_(18).jpg\" target=\"_blank\" rel=\"noopener\">mateu mulet</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Colonia_de_Sant_Jordi.jpg\" target=\"_blank\" rel=\"noopener\">Andrés Nieto Porras</a> (CC BY-SA 2.0); <a href=\"https://unsplash.com/photos/INSAlcTeuTU\" target=\"_blank\" rel=\"noopener\">Bruno Kelzer</a> (Unsplash); <a href=\"https://commons.wikimedia.org/wiki/File:Mallorca-Santany%C3%AD_(city)-Pla%C3%A7a_Major-market-02.jpg\" target=\"_blank\" rel=\"noopener\">Asurnipal</a> (CC BY-SA 4.0).</p></div><div class=\"ag\" id=\"ag-aquablu\"><h3>Lambi, Kos</h3><div class=\"agh\">Where Aqua Blu Boutique Hotel &amp; Spa is</div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Na_pl%C3%A1%C5%BEi_v_Lambi_-_panoramio.jpg/1280px-Na_pl%C3%A1%C5%BEi_v_Lambi_-_panoramio.jpg\" alt=\"Sunbeds and beach bars on Lambi beach\"><figcaption>Sunbeds and beach bars on Lambi beach</figcaption></figure><figure><img loading=\"lazy\" src=\"https://upload.wikimedia.org/wikipedia/commons/0/06/Lambi_boardwalk.jpg\" alt=\"A boardwalk through the dunes to Lambi beach\"><figcaption>A boardwalk through the dunes to Lambi beach</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/2024_%28365_challenge_No._2%29_-_Week_46_%28Kos_sets%29_-_Week_3%2C_Day_5_-_Pic_5_-_early_morning_sun_on_windmill%2C_Lambi%2C_Kos_-_Flickr_-_ambabheg.jpg/1280px-2024_%28365_challenge_No._2%29_-_Week_46_%28Kos_sets%29_-_Week_3%2C_Day_5_-_Pic_5_-_early_morning_sun_on_windmill%2C_Lambi%2C_Kos_-_Flickr_-_ambabheg.jpg\" alt=\"The old windmill by Mylos Beach Bar\"><figcaption>The old windmill by Mylos Beach Bar</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Lambi_K%C3%B3s_7.jpg/1280px-Lambi_K%C3%B3s_7.jpg\" alt=\"Clear water and island views from Lambi\"><figcaption>Clear water and island views from Lambi</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Lambi_K%C3%B3s_10.jpg/1280px-Lambi_K%C3%B3s_10.jpg\" alt=\"Evening light along the Lambi shore\"><figcaption>Evening light along the Lambi shore</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Lambi_K%C3%B3s_3.jpg/1280px-Lambi_K%C3%B3s_3.jpg\" alt=\"The little tourist train on Lambi&#x27;s seafront road\"><figcaption>The little tourist train on Lambi&#x27;s seafront road</figcaption></figure></div><p class=\"agswipe\">Swipe for more photos</p><p class=\"agi\">Lambi is a small, pretty coastal village just north of Kos Town and a calmer alternative to the island's busier resorts. Aqua Blu sits on the quieter stretch of its long Blue Flag beach, about 1km of sand and fine shingle shaded by tamarisk trees, looking out to the island of Pserimos. A flat seafront road and cycle path runs the length of Lambi into town, lined with beach bars, cafés and tavernas, with an old 19th century windmill at its heart.</p><div class=\"aggrid\"><div class=\"agb\"><h4>On your doorstep</h4><ul><li>The beach 100m from the hotel, with organised sunbeds and umbrellas, beach showers and shade under the tamarisk trees. Beach bars often include sunbeds when you buy a drink</li><li>The Nautical Club of Kos on the beach, for sailing and swimming</li><li>A flat seafront cycle path into Kos Town, under 10 minutes by bike</li><li>The old windmill and Mylos Beach Bar, with its bougainvillea garden</li><li>The little tourist train on Lambi's seafront road</li><li>Worth knowing: the seabed has some smooth rocks in places, so water shoes are handy</li></ul></div><div class=\"agb\"><h4>Eating out in Lambi</h4><ul><li>At the hotel: <b>Cuvée</b> restaurant and the <b>Sips + Bites</b> bar</li><li><b>Istros</b>, modern Greek cooking with live music some nights, about 900m along the road into town</li><li><b>Taverna Mike</b>, fresh Greek dishes and seafood with generous portions</li><li><b>Old River</b>, on the beachfront road at the southern end of Lambi</li><li>Plenty of other beachfront tavernas and cafés along the Lambi seafront road, the first about 500m from the hotel</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li><b>Mylos Beach Bar</b>, a boho lounge by the windmill for sunset drinks, which turns into an open air club with DJs on some nights</li><li>Relaxed beach bars along the front, with the evening light looking out over the water</li><li>The quieter end of Lambi, where the hotel is, has olive trees and a calmer feel than the stretch nearer town</li></ul></div><div class=\"agb safe\"><h4>How it feels for the two of you</h4><ul><li>Calm and easy going by the hotel, with the buzz of Kos Town 10 minutes away when you want it</li><li>Kos Town is busy and friendly in the evenings, and in one recent visitor survey 93 in 100 people said they felt fully safe after dark</li><li>After dinner in town, a taxi back is the easy option rather than walking the path late</li></ul></div></div><div class=\"agnb\"><h4>Nearby towns and how close they are</h4><p class=\"agnbi\">Drive times from Lambi are approximate.</p><div class=\"agstrip sm\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Fishing_boats_in_the_port_of_Kos._Greece.jpg/1280px-Fishing_boats_in_the_port_of_Kos._Greece.jpg\" alt=\"Kos Town harbour, about 10 minutes away\"><figcaption>Kos Town harbour, about 10 minutes away</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Holidays_Greece_-_panoramio_%28360%29.jpg/1280px-Holidays_Greece_-_panoramio_%28360%29.jpg\" alt=\"Restaurant lined lanes in Kos Town\"><figcaption>Restaurant lined lanes in Kos Town</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Asklepion%2C_Kos%2C_Greece_%285652986451%29.jpg/1280px-Asklepion%2C_Kos%2C_Greece_%285652986451%29.jpg\" alt=\"The Asklepion, about 10 to 15 minutes away\"><figcaption>The Asklepion, about 10 to 15 minutes away</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/Kos_-_Strand_beiTigkaki.JPG/1280px-Kos_-_Strand_beiTigkaki.JPG\" alt=\"Tigaki&#x27;s white sand, about 20 minutes away\"><figcaption>Tigaki&#x27;s white sand, about 20 minutes away</figcaption></figure></div><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 10 mins by taxi or bike</span><div><b class=\"nbn\">Kos Town</b><span class=\"nbd\">The harbour, castle and old town, about 3km away (35 to 45 minutes on foot along the seafront). Restaurants: <b>Petrino</b> in a stone courtyard, <b>Lofaki</b> for views, <b>Agkyra</b> for seafood on the marina, <b>Elia</b> in an 1890 house. Bars: <b>Omega Sky Bar</b> rooftop, <b>Sitar</b> on the harbour, <b>Kaseta</b> cocktail garden, <b>Hamam Club</b> in the old Turkish baths. Plus the 1930s market hall on Eleftherias Square</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 10 to 15 mins</span><div><b class=\"nbn\">The Asklepion</b><span class=\"nbd\">The island's most important ancient site, on a hillside with views over to Turkey</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 15 mins</span><div><b class=\"nbn\">Psalidi and Agios Fokas</b><span class=\"nbd\">Quieter beaches of sand and pebbles south of town</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 15 mins</span><div><b class=\"nbn\">Zipari</b><span class=\"nbd\">A traditional inland village on the way to the mountains</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 20 mins</span><div><b class=\"nbn\">Tigaki</b><span class=\"nbd\">White sand and shallow water, with sunset views to Kalymnos</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 20 mins</span><div><b class=\"nbn\">Marmari</b><span class=\"nbd\">About 2km of sandy beach and dunes, popular with windsurfers</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 20 mins</span><div><b class=\"nbn\">Zia</b><span class=\"nbd\">Mountain village famous for its sunsets</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 20 to 25 mins</span><div><b class=\"nbn\">Therma hot springs</b><span class=\"nbd\">Natural hot pools where the springs meet the sea, reached by a short path</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 30 mins</span><div><b class=\"nbn\">Kardamena</b><span class=\"nbd\">Lively resort and the departure point for boat trips to the Nisyros volcano</span></div></div></div></div><p class=\"agcred\">Photos: <a href=\"https://commons.wikimedia.org/wiki/File:Na_pl%C3%A1%C5%BEi_v_Lambi_-_panoramio.jpg\" target=\"_blank\" rel=\"noopener\">Vítězslav Šarina</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Lambi_boardwalk.jpg\" target=\"_blank\" rel=\"noopener\">Robin from Kraków</a> (CC BY 2.0); <a href=\"https://commons.wikimedia.org/wiki/File:2024_(365_challenge_No._2)_-_Week_46_(Kos_sets)_-_Week_3,_Day_5_-_Pic_5_-_early_morning_sun_on_windmill,_Lambi,_Kos_-_Flickr_-_ambabheg.jpg\" target=\"_blank\" rel=\"noopener\">Forbes Johnston</a> (CC BY 2.0); <a href=\"https://commons.wikimedia.org/wiki/File:Lambi_K%C3%B3s_7.jpg\" target=\"_blank\" rel=\"noopener\">Karelj</a> (Public domain); <a href=\"https://commons.wikimedia.org/wiki/File:Lambi_K%C3%B3s_10.jpg\" target=\"_blank\" rel=\"noopener\">Karelj</a> (Public domain); <a href=\"https://commons.wikimedia.org/wiki/File:Lambi_K%C3%B3s_3.jpg\" target=\"_blank\" rel=\"noopener\">Karelj</a> (Public domain); <a href=\"https://commons.wikimedia.org/wiki/File:Fishing_boats_in_the_port_of_Kos._Greece.jpg\" target=\"_blank\" rel=\"noopener\">Ввласенко</a> (CC BY-SA 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Holidays_Greece_-_panoramio_(360).jpg\" target=\"_blank\" rel=\"noopener\">Roton Piotr</a> (CC BY-SA 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Asklepion,_Kos,_Greece_(5652986451).jpg\" target=\"_blank\" rel=\"noopener\">Michal Osmenda</a> (CC BY-SA 2.0); <a href=\"https://commons.wikimedia.org/wiki/File:Kos_-_Strand_beiTigkaki.JPG\" target=\"_blank\" rel=\"noopener\">H. Zell</a> (CC BY-SA 3.0).</p></div><div class=\"ag\" id=\"ag-contessina\"><h3>Tsilivi and Planos, Zante</h3><div class=\"agh\">Where Contessina Suites &amp; Spa is</div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Bay_-_panoramio_%281%29.jpg/1280px-Bay_-_panoramio_%281%29.jpg\" alt=\"Evening in the little harbour at Planos, Tsilivi\"><figcaption>Evening in the little harbour at Planos, Tsilivi</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Planos_291_00%2C_Greece_-_panoramio_%2810%29.jpg/1280px-Planos_291_00%2C_Greece_-_panoramio_%2810%29.jpg\" alt=\"A busy taverna terrace in Planos\"><figcaption>A busy taverna terrace in Planos</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Beach_-_panoramio_%2861%29.jpg/1280px-Beach_-_panoramio_%2861%29.jpg\" alt=\"The sandy bay at Tsilivi\"><figcaption>The sandy bay at Tsilivi</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Zakynthos_May_2009_Tsilivi_-_panoramio.jpg/1280px-Zakynthos_May_2009_Tsilivi_-_panoramio.jpg\" alt=\"Looking over Tsilivi bay\"><figcaption>Looking over Tsilivi bay</figcaption></figure></div><p class=\"agswipe\">Swipe for more photos</p><p class=\"agi\">Contessina sits in Planos, the quieter end of Tsilivi, on a wide sandy bay on Zante's north east coast looking across the sea to Kefalonia. Tsilivi is lively but friendly, full of family run tavernas and cafés, with a more grown up side away from the main strip, and it winds down at a sensible hour. The little harbour at Planos is lovely in the evening light.</p><div class=\"aggrid\"><div class=\"agb\"><h4>On your doorstep</h4><ul><li>The sandy beach about 100 to 250m away, with sunbeds, watersports and calm, shallow water</li><li>Bars and restaurants under 5 minutes' walk, with Tsilivi centre about 300m away</li><li>The little harbour at Planos, with fishing boats and sunset views</li><li>Gift and beach shops along the Tsilivi strip</li></ul></div><div class=\"agb\"><h4>Eating out in Tsilivi and Planos</h4><ul><li>At the hotel: <b>Lentika</b>, <b>Nobile</b> fine dining in the roof garden and the <b>NovantaTre</b> wine cellar</li><li><b>The Olive Tree</b>, family run since 1984, with tables under an old olive tree and its own olive oil</li><li><b>Calypso</b>, a garden terrace and some of the best reviews in Tsilivi</li><li><b>Trenta Nove</b>, lawns and shaded terraces, romantic and calm</li><li><b>The Halfway House</b>, Greek food and a wine bar, hugely popular</li><li><b>Taverna by the Sea Paradeisos</b>, right on the beach with views to Kefalonia</li><li><b>The Balcony</b>, upmarket, with sunset views over the bay (about 10 minutes uphill)</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li><b>Piscina Pool Bar</b>, lounge music in an olive grove</li><li><b>Drunk Moon</b>, mellow, with Motown and soul</li><li><b>Saratseno</b>, a family run café bar with sea views, open since 1997</li><li>Beach bars <b>Freddie's</b> and <b>Boomerang</b> for a sundowner</li><li>Livelier strip bars with karaoke are there if you want them, and easy to avoid</li></ul></div><div class=\"agb safe\"><h4>How it feels for the two of you</h4><ul><li>Busy in the evenings with couples and families, so you are never walking anywhere quiet</li><li>Livelier than Colònia de Sant Jordi, but far gentler than Laganas on the other side of the island</li><li>Buses are infrequent, so taxis are the easiest way to explore</li></ul></div></div><div class=\"agnb\"><h4>Nearby towns and how close they are</h4><p class=\"agnbi\">Drive times from Tsilivi are approximate.</p><div class=\"agstrip sm\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Byzantine_Museum_%E2%80%93_Zakynthos_%E2%80%93_Greek_%E2%80%93_01.jpg/1280px-Byzantine_Museum_%E2%80%93_Zakynthos_%E2%80%93_Greek_%E2%80%93_01.jpg\" alt=\"Solomos Square in Zante Town, about 10 minutes away\"><figcaption>Solomos Square in Zante Town, about 10 minutes away</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/Tavern_at_Alykes_Beach%2C_Zakynthos%2C_Greece_01.jpg/1280px-Tavern_at_Alykes_Beach%2C_Zakynthos%2C_Greece_01.jpg\" alt=\"A beach taverna at Alykes, about 13 minutes away\"><figcaption>A beach taverna at Alykes, about 13 minutes away</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Keri_majakas.jpg/1280px-Keri_majakas.jpg\" alt=\"Keri lighthouse, a favourite sunset spot\"><figcaption>Keri lighthouse, a favourite sunset spot</figcaption></figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1571021785662-712e369a2829?w=1280&q=78&auto=format&fit=crop\" alt=\"Navagio Shipwreck Bay\"><figcaption>Navagio Shipwreck Bay</figcaption></figure></div><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 10 mins by taxi</span><div><b class=\"nbn\">Zante Town</b><span class=\"nbd\">The island's capital, with Solomos Square, the long pedestrian Roma Street for shopping and Miretta gelato. <b>Prosilio</b>, an award winning courtyard restaurant off Solomos Square, and <b>Lofos</b> on Bochali hill for sunset over the harbour</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 13 mins</span><div><b class=\"nbn\">Alykes</b><span class=\"nbd\">Long sandy beach with clear water and beach tavernas</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 14 mins</span><div><b class=\"nbn\">Laganas</b><span class=\"nbd\">Zante's party resort, and Laganas Bay for turtle spotting around Marathonisi</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 16 mins</span><div><b class=\"nbn\">Agios Sostis</b><span class=\"nbd\">A little harbour with a footbridge out to Cameo Island</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 20 mins</span><div><b class=\"nbn\">Vasilikos</b><span class=\"nbd\">A quiet peninsula of olive groves, home to Gerakas beach</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 25 mins</span><div><b class=\"nbn\">Keri</b><span class=\"nbd\">Keri lighthouse for sunset, and boat trips to the Keri caves</span></div></div><div class=\"nbr\"><span class=\"nbt\">around 30 mins</span><div><b class=\"nbn\">Agios Nikolaos</b><span class=\"nbd\">The little port for boat trips to the Blue Caves on the north coast</span></div></div><div class=\"nbr\"><span class=\"nbt\">around 30 to 40 mins</span><div><b class=\"nbn\">Navagio Shipwreck Bay</b><span class=\"nbd\">Seen from the clifftop viewpoint, or from the water on a boat trip</span></div></div></div></div><p class=\"agcred\">Photos: <a href=\"https://commons.wikimedia.org/wiki/File:Bay_-_panoramio_(1).jpg\" target=\"_blank\" rel=\"noopener\">Alexey Seleznev</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Planos_291_00,_Greece_-_panoramio_(10).jpg\" target=\"_blank\" rel=\"noopener\">Andris Malygin</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Beach_-_panoramio_(61).jpg\" target=\"_blank\" rel=\"noopener\">Alexey Seleznev</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Zakynthos_May_2009_Tsilivi_-_panoramio.jpg\" target=\"_blank\" rel=\"noopener\">maczopikczu</a> (CC BY 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Byzantine_Museum_%E2%80%93_Zakynthos_%E2%80%93_Greek_%E2%80%93_01.jpg\" target=\"_blank\" rel=\"noopener\">Maesi64</a> (CC0); <a href=\"https://commons.wikimedia.org/wiki/File:Tavern_at_Alykes_Beach,_Zakynthos,_Greece_01.jpg\" target=\"_blank\" rel=\"noopener\">Christaras A</a> (CC BY-SA 3.0); <a href=\"https://commons.wikimedia.org/wiki/File:Keri_majakas.jpg\" target=\"_blank\" rel=\"noopener\">Andrus Uuetalu</a> (CC BY-SA 3.0 ee); <a href=\"https://unsplash.com/photos/UISG2rrArCc\" target=\"_blank\" rel=\"noopener\">Andrey Shevard</a> (Unsplash).</p></div><div class=\"ag\" id=\"ag-ikos\"><h3>Agios Stefanos and Kefalos Bay, Kos</h3><div class=\"agh\">Where Ikos Aria is</div><div class=\"agstrip\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Kefalos_beach._Kastri_island_and_chapel_of_St._Nicholas._Kos%2C_Greece.jpg/1280px-Kefalos_beach._Kastri_island_and_chapel_of_St._Nicholas._Kos%2C_Greece.jpg\" alt=\"Kastri islet and its chapel, just off Agios Stefanos beach\"><figcaption>Kastri islet and its chapel, just off Agios Stefanos beach</figcaption></figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1752253509910-5c6e59c4c297?w=1280&q=78&auto=format&fit=crop\" alt=\"Swimming out towards Kastri\"><figcaption>Swimming out towards Kastri</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Kamari%2C_Kos%2C_Greece_%285654220668%29.jpg/1280px-Kamari%2C_Kos%2C_Greece_%285654220668%29.jpg\" alt=\"Kamari harbour and its seafood tavernas\"><figcaption>Kamari harbour and its seafood tavernas</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Kos_isthmos01.JPG/1280px-Kos_isthmos01.JPG\" alt=\"Kefalos Bay from the hills\"><figcaption>Kefalos Bay from the hills</figcaption></figure></div><p class=\"agswipe\">Swipe for more photos</p><p class=\"agi\">Ikos Aria sits on Kefalos Bay at the quiet, unspoilt south west tip of Kos, a sweeping half moon bay of sand and small pebbles with clear, shallow water. Just along the beach is Agios Stefanos, with the ruins of an early Christian basilica on the sand and the little chapel islet of Kastri a short swim offshore. A lantern lit promenade with places to eat runs on to the small fishing harbour of Kamari. It is the most peaceful choice of the four.</p><div class=\"aggrid\"><div class=\"agb\"><h4>On your doorstep</h4><ul><li>Agios Stefanos beach, about 300m away, with sunbeds and the ruins of two early Christian basilicas right on the sand</li><li>Kastri islet and its blue domed chapel, about 90m offshore. Swim or take a pedalo across and ring the bell</li><li>Kamari's small harbour, cafés and gift shops: 20 to 30 minutes on foot along the road or the beach</li><li>Windsurfing, jet skis and parasailing at Kamari</li><li>Paradise Beach, famous for the volcanic bubbles rising through the water, about 2km away</li></ul></div><div class=\"agb\"><h4>Eating out</h4><ul><li>Eight restaurants at the resort, all included: <b>Fresco</b> by Michelin starred chef Ettore Botrini, <b>Oliva</b> by Andoni Luis Aduriz, <b>Provence</b> by Pascal Barbot, <b>Ouzo</b> looking out to Kastri, <b>Kos</b> for island dishes and <b>Anaya</b> for Asian flavours</li><li>Dine Out, included: <b>Mylotopi</b> in the windmill settlement of Kefalos (about 4km) and <b>Kochylari</b> for traditional Kos cooking (about 2km)</li><li><b>Jenny Camel</b>, seafood in converted stone houses overlooking Kamari Bay</li><li><b>Taverna Cavos</b>, grilled fish on the promenade with bay views</li><li><b>Captain John</b>, seafood with tables on the sand in Kamari</li></ul></div><div class=\"agb\"><h4>Bars and evenings</h4><ul><li>Nine bars at the resort, including the Lagoon Lobby Bar with Aegean sunset views</li><li><b>Sebastians</b>, on the harbour front and <b>Acropol Bar</b> by the sea in Kamari</li><li>Evenings in the area are low key and relaxed</li></ul></div><div class=\"agb safe\"><h4>How it feels for the two of you</h4><ul><li>Calm, sleepy and very safe feeling, with nothing rowdy nearby</li><li>In the evenings it is best to use Dine Out or a taxi rather than walk along the road</li><li>Best if you are happy to spend most evenings enjoying the resort itself</li></ul></div></div><div class=\"agnb\"><h4>Nearby towns and how close they are</h4><p class=\"agnbi\">Drive times from Kefalos Bay are approximate.</p><div class=\"agstrip sm\"><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Kefalos_K%C3%B3s_9.jpg/1280px-Kefalos_K%C3%B3s_9.jpg\" alt=\"The windmill in Kefalos village, 5 to 10 minutes away\"><figcaption>The windmill in Kefalos village, 5 to 10 minutes away</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Paradise_Beach.jpg/1280px-Paradise_Beach.jpg\" alt=\"Paradise Beach, about 2km away\"><figcaption>Paradise Beach, about 2km away</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/Mastichari_Harbour_-_panoramio.jpg/1280px-Mastichari_Harbour_-_panoramio.jpg\" alt=\"Mastichari harbour, about 25 to 30 minutes away\"><figcaption>Mastichari harbour, about 25 to 30 minutes away</figcaption></figure><figure><img loading=\"lazy\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Nike%2C_Kardamaina._Kos%2C_Geece.jpg/1280px-Nike%2C_Kardamaina._Kos%2C_Geece.jpg\" alt=\"Kardamena seafront, about 25 to 30 minutes away\"><figcaption>Kardamena seafront, about 25 to 30 minutes away</figcaption></figure></div><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">about 5 to 10 mins</span><div><b class=\"nbn\">Kefalos village</b><span class=\"nbd\">The old hilltop village above the bay, with the Papavasilis windmill, a medieval castle ruin and Mylotopi for Dine Out</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 5 mins</span><div><b class=\"nbn\">Paradise Beach</b><span class=\"nbd\">Sunbeds, watersports and volcanic bubbles in the water</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 10 mins</span><div><b class=\"nbn\">Agios Theologos</b><span class=\"nbd\">Wild west coast beach with a taverna terrace for sunset</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 20 mins</span><div><b class=\"nbn\">Antimachia</b><span class=\"nbd\">A Venetian castle and a restored working windmill, near the airport</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 25 to 30 mins</span><div><b class=\"nbn\">Mastichari</b><span class=\"nbd\">Fishing harbour with a long sandy beach, sunsets and ferries to Kalymnos</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 25 to 30 mins</span><div><b class=\"nbn\">Kardamena</b><span class=\"nbd\">The island's lively resort, with boat trips to the Nisyros volcano</span></div></div><div class=\"nbr\"><span class=\"nbt\">around 40 mins</span><div><b class=\"nbn\">Zia</b><span class=\"nbd\">Mountain village famous for its sunsets</span></div></div><div class=\"nbr\"><span class=\"nbt\">about 45 to 50 mins</span><div><b class=\"nbn\">Kos Town</b><span class=\"nbd\">The harbour, castle, old town restaurants and shopping</span></div></div></div></div><p class=\"agcred\">Photos: <a href=\"https://commons.wikimedia.org/wiki/File:Kefalos_beach._Kastri_island_and_c
