   "html": "<div class=\"aggrid\"><div class=\"agb safe\"><h4>Disney 14 day Magic Ticket with Memory Maker<\/h4><ul><li>14 days at the four Walt Disney World theme parks: Magic Kingdom, EPCOT, Hollywood Studios and Animal Kingdom<\/li><li><b>Memory Maker<\/b> included, so you can download all your Disney PhotoPass pictures and ride photos<\/li><li>Disney counts anyone aged 10 and over as an adult, so your 10 year old will need an adult ticket<\/li><\/ul><\/div><div class=\"agb\"><h4>Universal 14 day ticket, all parks<\/h4><ul><li>14 days at Universal's parks, perfect for the Harry Potter worlds, the big coasters and Volcano Bay<\/li><li>Ideal with either hotel, as both have free shuttles to Universal<\/li><li>I will confirm exactly which parks are included in the 2028 ticket when it is released<\/li><\/ul><\/div><\/div><p class=\"agi\" style=\"margin-top:16px\">Theme park tickets for May 2028 have not been released yet, so I cannot give you a live price today. As soon as they are on sale I will send you the prices and can add them to your booking, so the whole holiday is in one place.<\/p>"

ax(0,1fr));gap:10px}\n.nbr{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line,#DCE3FF);border-radius:16px;padding:12px 14px;background:#fff}\n.nbr .nbt{flex:0 0 auto;background:#FFD21F;color:var(--blue,#004AAD);font-weight:800;font-size:12.5px;border-radius:999px;padding:4px 10px;white-space:nowrap}\n.nbr b.nbn{display:block;color:var(--blue,#004AAD);font-weight:800;font-size:15.5px}\n.nbr span.nbd{display:block;font-size:14px;margin-top:2px}\n.nbr span.nbd b{color:var(--ink,#10142B)}\n.agcred{font-size:11.5px;color:var(--muted,#55607A);margin:14px 0 0}\n.agcred a{color:inherit}\n.agswipe{font-size:13px;color:var(--muted,#55607A);margin:-8px 0 14px}\n@media(max-width:900px){.aggrid,.nbl{grid-template-columns:1fr}.agstrip figure{flex-basis:82%}.agstrip.sm figure{flex-basis:70%}.agstrip img{height:210px}.ag{padding:16px}.ag h3{font-size:21px}.nbr{flex-direction:column;gap:6px}}\n\n.agb.safe li b{color:#FFD21F}\n<\/style><div class=\"agjump\"><a href=\"#ga-avanti\">From the Avanti<\/a><a href=\"#ga-coco\">From CoCo Key<\/a><a href=\"#ga-iride\">The I-Ride Trolley<\/a><a href=\"#ga-other\">Taxis and Disney transport<\/a><\/div><div class=\"ag\" id=\"ga-avanti\"><h3>From the Avanti International Resort<\/h3><div class=\"agh\">Free scheduled shuttles, so no car needed for the big parks<\/div><p class=\"agi\">The resort runs free scheduled shuttle buses for overnight guests, and the resort fee that normally covers them is already included in your TUI price.<\/p><div class=\"aggrid\"><div class=\"agb safe\"><h4>Universal and Epic Universe<\/h4><ul><li><b>Free<\/b> scheduled shuttle to Universal Orlando, which is only about 10 minutes away<\/li><li>Book your seats at the hotel Attraction Ticket Desk, up to 24 hours ahead<\/li><li>Daytime seats are first come, first served, so book the day before<\/li><\/ul><\/div><div class=\"agb\"><h4>Walt Disney World and SeaWorld<\/h4><ul><li><b>Free<\/b> scheduled shuttle to the Disney transportation centre and to SeaWorld<\/li><li>Reserve online at least 3 hours before, and be at the pick up point 10 minutes early<\/li><li>From the Disney transportation centre you take the monorail or ferry to Magic Kingdom, or the monorail to EPCOT<\/li><\/ul><\/div><\/div><\/div><div class=\"ag\" id=\"ga-coco\"><h3>From CoCo Key Resort &amp; Water Park<\/h3><div class=\"agh\">Free shuttles plus an I-Ride Trolley stop right outside<\/div><p class=\"agi\">CoCo Key is an official Universal Partner Hotel and the resort fee is waived for TUI guests, so these are all free for you.<\/p><div class=\"aggrid\"><div class=\"agb safe\"><h4>Universal and Epic Universe<\/h4><ul><li><b>Free<\/b> shuttle to Universal Orlando, timed around the park opening hours<\/li><li>Book at the Universal Vacation Planning Centre in the lobby (7am to 11am daily), 24 hours ahead<\/li><li><b>Free<\/b> shuttle to Epic Universe with several departures each morning and returns each evening<\/li><\/ul><\/div><div class=\"agb\"><h4>Walt Disney World (EPCOT)<\/h4><ul><li><b>Free<\/b> daily shuttle straight to EPCOT, currently leaving at 9:50am<\/li><li>Return pick up from EPCOT at 5:45pm, be there 10 minutes early<\/li><li>From EPCOT the monorail links to the Disney transportation centre and Magic Kingdom<\/li><\/ul><\/div><\/div><p class=\"agi\" style=\"margin-top:14px\"><b>Bonus:<\/b> CoCo Key gives guests free I-Ride Trolley passes at the front desk, and the trolley stops right in front of the hotel.<\/p><\/div><div class=\"ag\" id=\"ga-iride\"><h3>What is the I-Ride Trolley?<\/h3><div class=\"agh\">The easy, cheap way up and down International Drive<\/div><div class=\"agstrip sm\"><figure><img loading=\"lazy\" src=\"https://cdn.images.tui/tuin-img/2025_9/15_14/1a3d4501-1855-4292-8ac0-b35900f0609f/ACC_041628_FLO_74_I_Ride_Trolley_WEBWebOriginalCompressed.jpg\" alt=\"The I-Ride Trolley outside CoCo Key\"><figcaption>The I-Ride Trolley outside CoCo Key<\/figcaption><\/figure><figure><img loading=\"lazy\" src=\"https://images.unsplash.com/photo-1647527380663-4c4dafd29274?w=900&q=80&auto=format&fit=crop\" alt=\"The big wheel at ICON Park on International Drive\"><figcaption>ICON Park, a short trolley ride away<\/figcaption><\/figure><\/div><p class=\"agi\">The I-Ride Trolley is a hop on, hop off bus that looks like an old fashioned tram. It runs along the whole of International Drive, linking both hotels with the restaurants, shops, ICON Park, the outlet malls and SeaWorld. It is perfect for evenings out and for days when you are not at the big parks.<\/p><div class=\"aggrid\"><div class=\"agb\"><h4>How it works<\/h4><ul><li>Runs every day from <b>8am to 10:30pm<\/b><\/li><li><b>Red Line<\/b> runs the length of International Drive about every 20 minutes<\/li><li><b>Green Line<\/b> covers Universal Boulevard and Major Boulevard about every 45 minutes<\/li><li>Free transfers between the two lines<\/li><\/ul><\/div><div class=\"agb safe\"><h4>How much it costs<\/h4><ul><li>Single ride: <b>$2<\/b> for adults (about £1.50) and <b>$1<\/b> for children aged 3 to 9 (about 75p). Your 10 year old pays the adult fare<\/li><li>Exact change in US dollars only, drivers do not carry change<\/li><li>Unlimited passes per person: 1 day $8 (about £6), 7 days $18 (about £13.50), 14 days $22 (about £16.50)<\/li><li>Passes are bought online or at shops and hotels on I-Drive, not on board<\/li><\/ul><\/div><\/div><p class=\"agcred\">Fares and timetables are set by the I-Ride Trolley and can change before 2028.<\/p><\/div><div class=\"ag\" id=\"ga-other\"><h3>Taxis, Uber and getting from the airport<\/h3><div class=\"agh\">For everything else<\/div><div class=\"nbl\"><div class=\"nbr\"><span class=\"nbt\">Included<\/span><div><b class=\"nbn\">Airport coach transfers<\/b><span class=\"nbd\">Your TUI coach meets you at Melbourne Orlando airport and takes you to the hotel, around <b>90 minutes<\/b>. If you would rather go straight there, a private taxi transfer is in the extras below.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Handy<\/span><div><b class=\"nbn\">Uber and Lyft<\/b><span class=\"nbd\">Both work well across Orlando and are often the quickest way to Disney Springs or a park the shuttles do not cover. Prices vary with the time of day.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Free<\/span><div><b class=\"nbn\">Disney transport<\/b><span class=\"nbd\">Once you are inside Walt Disney World, Disney's own buses, monorail, boats and Skyliner link the parks and Disney Springs.<\/span><\/div><\/div><div class=\"nbr\"><span class=\"nbt\">Tip<\/span><div><b class=\"nbn\">Mix and match<\/b><span class=\"nbd\">Use the free hotel shuttles for park days, the trolley for evenings on I-Drive and an Uber for the odd awkward journey. Most families never miss having a car.<\/span><\/div><\/div><\/div><\/div>"

   "html": "<div class=\"aggrid\"><div class=\"agb\"><h4>Before you fly<\/h4><ul><li>Everyone needs an <b>ESTA<\/b>, including the children. The official fee is $40.62 each (about £30). Only apply on the official site, esta.cbp.dhs.gov, as copycat sites charge far more<\/li><li>Passports must be valid for your whole stay<\/li><li>You will need US plug adaptors (type A)<\/li><\/ul><\/div><div class=\"agb safe\"><h4>Florida in May<\/h4><ul><li>Hot and sunny, with average highs of around 31°C<\/li><li>Short afternoon showers are common, so pack light waterproofs<\/li><li>Lots of sun cream, hats and refillable water bottles for park days<\/li><\/ul><\/div><div class=\"agb\"><h4>Money tips<\/h4><ul><li>Prices in shops and restaurants are shown before sales tax, which is added at the till<\/li><li>Tipping of around 15% to 20% is normal in restaurants<\/li><li>A fee free travel card is handy for paying in dollars<\/li><\/ul><\/div><div class=\"agb\"><h4>Room only<\/h4><ul><li>Both hotels have restaurants, cafes and a marketplace on site for breakfast<\/li><li>International Drive is packed with family restaurants of every kind, a short walk or trolley ride away<\/li><li>Room only gives you the freedom to eat in the parks on park days<\/li><\/ul><\/div><\/div>"
