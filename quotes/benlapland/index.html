in:0;padding-left:20px;line-height:1.55\"><li>A husky sled ride through the snowy forest, with one grown up driving after full instruction and the kids snuggled in the sled</li><li>A reindeer sleigh ride with a local Sámi guide</li><li>A fun filled show with Santa's Elves inside their Magical Igloo, plus a real igloo with an ice bar</li><li>An interactive performance in the Sleigh Barn, full of festive surprises</li><li>Warming huts and Lappish kotas with hot berry juice, ginger biscuits and pancakes</li><li>Snow games as many times as you like: mini skidoos, snow hockey, crazy reindeer golf, tandem skiing, tobogganing and kick sledding</li><li>The Search for Santa by snowmobile sleigh along the glow trail to his secret log cabin</li><li>A private meeting with Santa just for your family, and a special gift from Santa's sack for each child</li><li>Everything is free flow, so you do it all at your own pace</li></ul></div><h3 style=\"color:#10142B;font-size:20px;margin:18px 0 12px\">Your day by day itinerary</h3><div style=\"background:#fff;border:1px solid #dfe5f5;border-radius:16px;padding:16px 18px;margin:0 0 14px\"><h3 style=\"color:#004AAD;font-size:18px;margin:0 0 8px\">Day 1 &middot; Sunday 19 December, arrival</h3><ul style=\"margin:0;padding-left:20px;line-height:1.55\"><li>Fly from Birmingham at 06:50, with festive fun from the cabin crew on the way</li><li>Land in Ivalo at 12:30, where the elves are waiting to greet you</li><li>Collect your thermal suits and boots, then a 25 minute coach ride to Saariselkä</li><li>The afternoon is yours: tobogganing, snowball fights and building snowmen</li><li>Dinner at your hotel. Optional: a Northern Lights adventure tonight</li></ul></div><div style=\"background:#fff;border:1px solid #dfe5f5;border-radius:16px;padding:16px 18px;margin:0 0 14px\"><h3 style=\"color:#004AAD;font-size:18px;margin:0 0 8px\">Day 2 &middot; Monday 20 December, Adventure Day</h3><ul style=\"margin:0;padding-left:20px;line-height:1.55\"><li>A free day to explore Saariselkä, play in the snow and relax</li><li>Optional adventures can be added, such as husky or reindeer rides, a snowmobile safari, snowshoeing or skiing</li><li>Dinner at your hotel</li></ul></div><div style=\"background:#fff;border:1px solid #dfe5f5;border-radius:16px;padding:16px 18px;margin:0 0 14px\"><h3 style=\"color:#004AAD;font-size:18px;margin:0 0 8px\">Day 3 &middot; Tuesday 21 December, Search for Santa Day</h3><ul style=\"margin:0;padding-left:20px;line-height:1.55\"><li>A full day at the Arctic Circle Centre with huskies, reindeer, the elves' igloo show and the Sleigh Barn</li><li>Lunch, kotas, pancakes and as many snow games as the kids can manage</li><li>The snowmobile sleigh ride to Santa's secret cabin for your private family meeting</li><li>Back to Saariselkä for your Festive Dinner, so pop a Christmas jumper under your snowsuit</li></ul></div><div style=\"background:#fff;border:1px solid #dfe5f5;border-radius:16px;padding:16px 18px;margin:0 0 14px\"><h3 style=\"color:#004AAD;font-size:18px;margin:0 0 8px\">Day 4 &middot; Wednesday 22 December, home</h3><ul style=\"margin:0;padding-left:20px;line-height:1.55\"><li>A relaxed breakfast and a last play in the snow or stroll round the village</li><li>Coach to Ivalo Airport, fly home at 13:30 and land in Birmingham at 15:15</li></ul></div><div style=\"background:#fff;border:1px solid #dfe5f5;border-radius:16px;padding:16px 18px;margin:0 0 14px\"><h3 style=\"color:#004AAD;font-size:18px;margin:0 0 8px\">Not included</h3><ul style=\"margin:0;padding-left:20px;line-height:1.55\"><li>Lunch on arrival day, Adventure Day and departure day</li><li>Optional adventures, which you can add on the Extras tab</li><li>Personal spending, such as souvenirs and drinks at the bar</li><li>Winter sports travel insurance, which is a condition of booking</li></ul></div>",
