asy each hotel and the area around it is for anyone who finds walking difficult.", "html": "<div class=\"box\" style=\"background:#fff;border:2px solid #DCE3FF;border-radius:24px;padding:22px;margin:0 0 16px\"><h3 style=\"margin:0 0 6px\">Alvor Baia Resort Hotel<\/h3><p style=\"margin:0 0 10px\"><b>The easiest of the three for anyone with walking difficulties.<\/b><\/p><ul style=\"margin:0;padding-left:20px\"><li style=\"margin:0 0 6px\">One main building with lifts to the bedrooms, and a step free route from the entrance to the lifts, reception and restaurant.<\/li><li style=\"margin:0 0 6px\">The pools, pool bar and restaurants are all together on site, so day to day walking is short.<\/li><li style=\"margin:0 0 6px\">The beach is 1.5km away, but there is a free hotel shuttle bus there throughout the day.<\/li><li style=\"margin:0 0 6px\">Shops and bars are about 900m away and Alvor centre about 1.2km, so a taxi is easiest. The old village streets are cobbled and slope up to the church.<\/li><li style=\"margin:0 0 6px\">I will ask for rooms close to the lifts when I book.<\/li><\/ul><\/div><div class=\"box\" style=\"background:#fff;border:2px solid #DCE3FF;border-radius:24px;padding:22px;margin:0 0 16px\"><h3 style=\"margin:0 0 6px\">Ukino Palmeiras Village<\/h3><p style=\"margin:0 0 10px\"><b>Fine for the kids, harder for anyone who struggles with walking.<\/b><\/p><ul style=\"margin:0;padding-left:20px\"><li style=\"margin:0 0 6px\">The hotel lists lifts to all levels, and adapted rooms with accessible bathrooms can be requested.<\/li><li style=\"margin:0 0 6px\">It is a large resort of over 500 rooms spread across several blocks on the clifftop, so there is more walking between rooms, pools and restaurants.<\/li><li style=\"margin:0 0 6px\">The beach is 300m away but reached down steep steps to the cove, so it is not ideal for anyone who finds steps hard.<\/li><li style=\"margin:0 0 6px\">Armacao de Pera's centre is about 2.5km away, so you would need a taxi to go out.<\/li><\/ul><\/div><div class=\"box\" style=\"background:#fff;border:2px solid #DCE3FF;border-radius:24px;padding:22px;margin:0 0 16px\"><h3 style=\"margin:0 0 6px\">Albir Garden Resort & Aquapark<\/h3><p style=\"margin:0 0 10px\"><b>Not the best fit for walking difficulties.<\/b><\/p><ul style=\"margin:0;padding-left:20px\"><li style=\"margin:0 0 6px\">The pebble beach is about 1.3km away and Albir centre about 850m, without a beach shuttle.<\/li><li style=\"margin:0 0 6px\">I have kept it here so you can compare all three.<\/li><\/ul><\/div><p class=\"small\" style=\"margin:6px 0 0\">Jet2 do not publish accessibility details for these hotels, so the points above come from the hotels' own listings and guest reviews. Jet2 also offer free assistance at Bristol and Faro airports and on the flights, which I can arrange when I book.<\/p>"}], "travelFacts": {}, "rooms": ["Room 1: 2 adults and 2 children (7 and 5)", "Room 2: 1 adult and 2 children (7 and 2)", "Room 3: 2 adults and 2 children (7 and 10)", "Room 4: 2 adults and 2 children (16 and 12)"], "included": ["Direct return flights from Bristol with Jet2", "22kg hold bag and 10kg hand luggage each", "All inclusive food and drink", "Transfers to and from your hotel", "ATOL protected"], "todoIntro": "When you fancy a day away from the pool, here are a few family favourites near each option.", "areas": [{"img": "https://images.unsplash.com/photo-1639246051951-b11841516201", "title": "Alvor boardwalk", "text": "Near Alvor Baia. A long, flat wooden boardwalk along the dunes and beach, easy going for everyone.", "alt": "Boardwalk by the sea at sunset", "link": "https://www.getyourguide.com/en-gb/alvor-l2936/ttd/", "linkLabel": "See things to do in Alvor"}, {"img": "https://images.unsplash.com/photo-1777448812169-87c81fb36970", "title": "Zoomarine", "text": "A marine park near Albufeira with dolphin shows, rides and pools, about 30 minutes from both Algarve hotels.", "alt": "Dolphins leaping at a marine park show",
